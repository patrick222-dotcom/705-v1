/* ---------- global toast + confirm (module-scoped, avoids prop-drilling) ---------- */
const _ui = { toastFns:new Set(), confirmFn:null };
function toast(msg, kind){ _ui.toastFns.forEach(fn=>fn(msg, kind||'info')); }
function confirmAsync(msg, opts){
  if(_ui.confirmFn) return _ui.confirmFn(msg, opts||{});
  return Promise.resolve(window.confirm(msg));  // fallback if host isn't mounted
}
function Toaster(){
  const [items,setItems] = useState([]);
  useEffect(()=>{
    const add=(msg,kind)=>{
      const id=Date.now()+Math.random();
      setItems(x=>[...x,{id,msg,kind}]);
      setTimeout(()=>setItems(x=>x.filter(i=>i.id!==id)), 3600);
    };
    _ui.toastFns.add(add);
    return ()=>{ _ui.toastFns.delete(add); };
  },[]);
  if(!items.length) return null;
  const icon={success:'✓',error:'⚠️',info:'•'};
  return (
    <div className="toaster" role="status" aria-live="polite">
      {items.map(t=>(
        <div key={t.id} className={'toast '+(t.kind||'info')} onClick={()=>setItems(x=>x.filter(i=>i.id!==t.id))}>
          <span className="ic" aria-hidden="true">{icon[t.kind]||'•'}</span><span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}
function ConfirmHost(){
  const [st,setSt] = useState(null); // {msg, opts, resolve}
  useEffect(()=>{
    _ui.confirmFn=(msg,opts)=>new Promise(res=>setSt({msg,opts:opts||{},resolve:res}));
    return ()=>{ _ui.confirmFn=null; };
  },[]);
  if(!st) return null;
  const done=(v)=>{ st.resolve(v); setSt(null); };
  const o=st.opts;
  return (
    <div className="scrim" style={{zIndex:210}} onClick={()=>done(false)}>
      <div className="cdlg" onClick={e=>e.stopPropagation()} role="alertdialog" aria-modal="true">
        <div className="ct">{o.title||'Are you sure?'}</div>
        <div className="cm">{st.msg}</div>
        <div className="crow">
          <button className="btn btn-ghost" onClick={()=>done(false)}>{o.cancel||'Cancel'}</button>
          <button className={'btn '+(o.danger?'btn-danger':'btn-primary')} onClick={()=>done(true)} autoFocus>{o.confirm||'Confirm'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- error boundary ---------- */
class ErrorBoundary extends React.Component {
  constructor(props){
    super(props);
    this.state = {hasError:false, error:null};
  }
  static getDerivedStateFromError(error){
    return {hasError:true, error};
  }
  componentDidCatch(error, errorInfo){
    console.error('ErrorBoundary caught:', error, errorInfo);
  }
  render(){
    if(this.state.hasError){
      return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',padding:'24px',background:'var(--paper)'}}>
          <div style={{maxWidth:'440px',background:'var(--paper)',borderRadius:'20px',padding:'28px',textAlign:'center'}}>
            <div style={{fontSize:'48px',marginBottom:'16px'}}>⚠️</div>
            <div style={{fontFamily:'Bricolage Grotesque',fontWeight:'700',fontSize:'22px',color:'var(--ink)',marginBottom:'12px'}}>Something went wrong</div>
            <div style={{fontSize:'14px',color:'var(--muted)',marginBottom:'24px',lineHeight:'1.5'}}>
              The app encountered an error. Try refreshing the page.
            </div>
            <button onClick={()=>window.location.reload()} style={{background:'var(--indigo)',color:'#fff',border:'none',borderRadius:'12px',padding:'12px 24px',fontWeight:'600',fontSize:'14px',cursor:'pointer'}}>
              Reload App
            </button>
            {this.state.error && (
              <div style={{marginTop:'20px',padding:'12px',background:'#FFF4F2',borderRadius:'10px',fontSize:'12px',color:'#C73A26',textAlign:'left',fontFamily:'monospace',overflow:'auto'}}>
                {this.state.error.toString()}
              </div>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================================================= */
function App(){
  const [ready,setReady] = useState(false);
  const [setupComplete,setSetupComplete] = useState(false);
  const [obStep,setObStep] = useState(0); // 0 welcome..4 done

  const [name,setName] = useState('there');
  const [baseRate,setBaseRate] = useState(65.15);
  const [federalTaxRate,setFederal] = useState(12);
  const [stateTaxRate,setState] = useState(2.5);
  const [pretaxDeductions,setPretax] = useState(0);
  const [posttaxDeductions,setPosttax] = useState(0);
  const [ficaType,setFicaType] = useState('standard');
  const [ficaPct,setFicaPct] = useState(7.65);
  const [payPeriodStart,setPPS] = useState(todayISO());
  const [shifts,setShifts] = useState({});
  const [customWithholdings,setCW] = useState([]);
  const [differentials,setDiff] = useState(DIFF_DEFAULTS);
  const [templates,setTemplates] = useState([]);   // saved shift presets for quick logging
  const [dayEvents,setDayEvents] = useState({});   // 'YYYY-MM-DD' -> [{id,kind,hours?}] (PTO/education/appt/off)
  const [notes,setNotes] = useState({});           // 'YYYY-MM-DD' -> short free-text note

  const [sheetDate,setSheetDate] = useState(null);   // add-shift sheet open for date
  const [showSettings,setShowSettings] = useState(false);
  const [showBreakdown,setShowBreakdown] = useState(false);
  const [showAuth,setShowAuth] = useState(false);  // auth modal
  const [authMode,setAuthMode] = useState('signin'); // 'signin' or 'signup'
  const [user,setUser] = useState(null);  // current user
  const [session,setSession] = useState(null);  // auth session
  const [syncing,setSyncing] = useState(false);  // cloud sync in progress
  const [syncError,setSyncError] = useState(false);  // last cloud save failed
  const [paystub,setPaystub] = useState(null);
  const [parsing,setParsing] = useState(false);
  const [showFeedback,setShowFeedback] = useState(false);
  const [showSwaps,setShowSwaps] = useState(false);   // shift swap board sheet
  // pending swap matches awaiting MY accept, refreshed by SwapsSheet alongside its own board
  // poll (never polled while the sheet is closed — badge just keeps showing the last-known count)
  const [swapPendingCount,setSwapPendingCount] = useState(0);
  const [icsImport,setIcsImport] = useState(null);   // schedule-import stepper state, or null when closed
  const [calView,setCalView] = useState('month');   // 'month' | 'year' (pay-period & week views removed 2026-07-24; calView was never persisted, so no stored-value migration is needed)
  const [calFocus,setCalFocus] = useState(payPeriodStart); // reference date for week/month/year browsing
  const [qfMode,setQfMode] = useState(false);        // quick-fill: picking/applying a template across days
  const [qfTemplate,setQfTemplate] = useState(null); // the template being applied while qfMode is on
  const qfTouched = useRef(new Set());               // day-keys toggled this quick-fill session (for analytics)

  const fileImport = useRef(null);
  const hydratedForUser = useRef(null);   // user.id whose cloud data is loaded & safe to overwrite
  const loadingRef = useRef(null);        // user.id currently being loaded (in-flight guard)
  const prevUserId = useRef(null);         // last seen auth user id (detects real user changes)
  const snapshotRef = useRef(null);        // latest {user,data} for the pagehide flush
  const oversizeWarned = useRef(false);    // warn once if the blob outgrows the free-tier budget
  const lastSeenAt = useRef(null);         // updated_at of the cloud blob we last wrote/loaded (sync guard)
  const BACKUP_KEY = uid => STORE_KEY + '::' + uid;  // per-user local mirror (never the shared anon key)

  /* ---- single serializer (used by save effect, export, and flush) ---- */
  const serializeState = ()=>({
    name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,
    ficaWithholdingType:ficaType,ficaWithholdingPercent:ficaPct,
    payPeriodStart,shifts,customWithholdings,differentials,templates,dayEvents,notes,setupComplete
  });

  /* ---- single hydrator (used by every load path: cloud init, auth change, localStorage, import) ---- */
  /* opts.landCurrent: snap the pay period to the one containing today (phase-preserved) —
       used on initial/sign-in loads so landing always shows the current paycheck.
     opts.keepPeriod: leave the currently-displayed pay period untouched — used by the
       focus-refetch sync so pulling remote edits doesn't yank the user's view. */
  const applyData = (raw, opts={})=>{
    const d = sanitizeData(raw);
    if(!d) return;
    if(d.name) setName(d.name);
    if(d.baseRate!=null) setBaseRate(d.baseRate);
    if(d.federalTaxRate!=null) setFederal(d.federalTaxRate);
    if(d.stateTaxRate!=null) setState(d.stateTaxRate);
    if(d.pretaxDeductions!=null) setPretax(d.pretaxDeductions);
    if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);
    if(d.ficaWithholdingType) setFicaType(d.ficaWithholdingType);
    if(d.ficaWithholdingPercent!=null) setFicaPct(d.ficaWithholdingPercent);
    if(!opts.keepPeriod){
      if(opts.landCurrent) setPPS(currentPeriodStart(d.payPeriodStart||todayISO()));
      else if(d.payPeriodStart) setPPS(d.payPeriodStart);
    }
    if(d.shifts) setShifts(d.shifts);
    if(d.customWithholdings) setCW(d.customWithholdings);
    if(d.differentials){
      const m={...DIFF_DEFAULTS};
      Object.entries(d.differentials).forEach(([k,v])=>{ if(v&&typeof v==='object'&&!Array.isArray(v)) m[k]={...(DIFF_DEFAULTS[k]||{color:'#8A93A6',type:'dollar'}),...v}; });
      setDiff(m);
    }
    if(d.templates) setTemplates(d.templates);
    if(d.dayEvents) setDayEvents(d.dayEvents);
    if(d.notes) setNotes(d.notes);
    setSetupComplete(d.setupComplete!==false);
  };

  /* ---- reset every field back to first-run defaults (sign-out) ---- */
  const resetToDefaults = ()=>{
    setName('there'); setBaseRate(65.15); setFederal(12); setState(2.5);
    setPretax(0); setPosttax(0); setFicaType('standard'); setFicaPct(7.65);
    setPPS(todayISO()); setShifts({}); setCW([]); setDiff(DIFF_DEFAULTS); setTemplates([]);
    setDayEvents({}); setNotes({}); setSetupComplete(false);
  };

  /* ---- load a user's cloud blob, then mark saves safe for that user ---- */
  const hydrateFromCloud = async (userId, timeoutMs)=>{
    if(loadingRef.current===userId || hydratedForUser.current===userId) return true; // no double-load
    loadingRef.current = userId;
    try{
      const row = await withTimeout(loadCloudRow(userId), timeoutMs||6000, 'cloud load');
      if(row && row.data){ applyData(row.data,{landCurrent:true}); lastSeenAt.current = row.updatedAt; }
      else{
        // genuinely no cloud row yet — recover any local backup we mirrored for this user
        try{ const b = localStorage.getItem(BACKUP_KEY(userId)); if(b) applyData(JSON.parse(b),{landCurrent:true}); }catch(_){}
      }
      hydratedForUser.current = userId;  // ONLY now are cloud saves for this user safe
      setSyncError(false);
      return true;
    }catch(e){
      // timeout / error: leave hydratedForUser unset so we never clobber cloud with stale/default state
      console.error('Cloud load error:',e);
      return false;
    }finally{
      loadingRef.current = null;
    }
  };

  /* check auth session */
  useEffect(()=>{
    const init = async ()=>{
      try{
        if(!supabase) throw new Error('Supabase unavailable — offline mode');
        const {data:{session}} = await withTimeout(supabase.auth.getSession(), 4000, 'auth check');
        setSession(session);
        setUser(session?.user ?? null);
        if(session?.user){
          prevUserId.current = session.user.id;
          await hydrateFromCloud(session.user.id, 6000);
        }
      }catch(e){console.error('Auth session error:',e);}
      setReady(true);
      const sp = document.getElementById('splash');
      if(sp){ sp.style.opacity='0'; setTimeout(()=>sp.remove(),400); }
    };
    init();

    if(!supabase) return;
    // Keep this callback SYNCHRONOUS — supabase-js holds the auth lock here, and awaiting
    // another client call inside it can deadlock token refresh. Defer any load with setTimeout(0).
    const {data:{subscription}} = supabase.auth.onAuthStateChange((event,session)=>{
      setSession(session);
      const nextUser = session?.user ?? null;
      setUser(nextUser);
      const nextId = nextUser?.id ?? null;
      const prevId = prevUserId.current;
      if(nextId === prevId) return;   // TOKEN_REFRESHED / USER_UPDATED / repeats — no reload, no clobber
      prevUserId.current = nextId;
      if(nextId){
        if(event==='SIGNED_IN') track('signed_in', null, nextId);
        if(hydratedForUser.current === nextId) return;  // init already loaded this user
        hydratedForUser.current = null;                 // block cloud saves until loaded
        setTimeout(()=>hydrateFromCloud(nextId, 6000), 0);
      }else{
        // Signed out: wipe in-memory state so the debounced save can't leak this user's
        // wage data into the shared anonymous localStorage key, then restore pre-login anon data.
        hydratedForUser.current = null;
        setSyncError(false);
        resetToDefaults();
        lastSeenAt.current = null;
        setTimeout(()=>{ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) applyData(JSON.parse(raw),{landCurrent:true}); }catch(_){} }, 0);
      }
    });
    return ()=> subscription.unsubscribe();
  },[]);

  /* load anonymous localStorage data at mount (cloud load, if any, overwrites it) */
  useEffect(()=>{
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) applyData(JSON.parse(raw),{landCurrent:true});
    }catch(e){ console.error('load',e); }
  },[]);

  /* save (debounced) */
  useEffect(()=>{
    if(!ready) return;
    const dataToSave = serializeState();
    snapshotRef.current = {user, data:dataToSave};  // keep the flush handler current
    const id = setTimeout(async ()=>{
      if(user){
        // F2: never write until this exact user's cloud blob has hydrated, or we'd overwrite it with stale/default state
        if(hydratedForUser.current !== user.id) return;
        // Free-tier guard: a single pathological blob shouldn't balloon the DB. Well above any
        // realistic pay history (~a few KB), so this only ever trips on corruption/abuse.
        if(JSON.stringify(dataToSave).length > MAX_BLOB_BYTES){
          if(!oversizeWarned.current){ oversizeWarned.current = true; toast('Your data got unusually large — cloud sync paused. Try clearing old shifts.','error'); }
          try{ localStorage.setItem(BACKUP_KEY(user.id), JSON.stringify(dataToSave)); }catch(_){}
          setSyncError(true);
          return;
        }
        setSyncing(true);
        let ts=null;
        try{ ts = await saveToSupabase(user.id, dataToSave); }
        finally{ setSyncing(false); }
        setSyncError(!ts);
        if(ts){ lastSeenAt.current = ts; try{ localStorage.removeItem(BACKUP_KEY(user.id)); }catch(_){} }   // remember our own write; a successful save makes cloud authoritative, so drop any stale local backup
        else{
          // network drop: mirror to a PER-USER key (not the shared anon STORE_KEY) so nothing is lost and nothing leaks
          try{ localStorage.setItem(BACKUP_KEY(user.id), JSON.stringify(dataToSave)); }catch(_){}
        }
      }else{
        try{
          localStorage.setItem(STORE_KEY, JSON.stringify(dataToSave));
        }catch(e){ if(e.name==='QuotaExceededError') toast('Storage full — export your data.','error'); }
      }
    },500);
    return ()=>clearTimeout(id);
  },[ready,user,name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,ficaType,ficaPct,payPeriodStart,shifts,customWithholdings,differentials,templates,dayEvents,notes,setupComplete]);

  /* flush the latest snapshot on backgrounding / tab close (500ms debounce would otherwise drop it) */
  useEffect(()=>{
    const flush = ()=>{
      const snap = snapshotRef.current;
      if(!snap) return;
      if(snap.user){
        // best-effort immediate cloud save; never mirror a signed-in user's data into the shared anon key
        if(hydratedForUser.current === snap.user.id){ try{ saveToSupabase(snap.user.id, snap.data).then(ts=>{ if(ts){ lastSeenAt.current=ts; try{ localStorage.removeItem(BACKUP_KEY(snap.user.id)); }catch(_){} } }); }catch(_){} }
      }else{
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(snap.data)); }catch(_){}
      }
    };
    const onVis = ()=>{ if(document.visibilityState==='hidden') flush(); };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ window.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', onVis); };
  },[]);

  /* manual retry when a cloud save failed */
  const retrySync = async ()=>{
    if(!user || hydratedForUser.current!==user.id) return;
    setSyncing(true);
    let ts=null;
    try{ ts = await saveToSupabase(user.id, serializeState()); }
    finally{ setSyncing(false); }
    setSyncError(!ts);
    if(ts){ lastSeenAt.current = ts; try{ localStorage.removeItem(BACKUP_KEY(user.id)); }catch(_){} }
  };

  /* WebKit-safe sign-out. supabase-js signOut() calls getSession() + a /logout network
     request and only clears the local session AFTER they resolve — both deadlock on iOS
     WebKit (same bug the getSession 4s-race guards). So we race it against a timeout and,
     no matter what, purge the persisted auth token ourselves so we always end up signed out. */
  const clearAuthStorage = ()=>{ try{ Object.keys(localStorage).filter(k=>k.indexOf('sb-')===0 && k.indexOf('auth-token')>=0).forEach(k=>localStorage.removeItem(k)); }catch(_){} };
  const signOutClient = async ()=>{
    try{ if(supabase) await withTimeout(supabase.auth.signOut({scope:'local'}), 3000, 'sign out'); }
    catch(e){ console.error('Sign out:', e); }
    clearAuthStorage();
  };
  const handleSignOut = async ()=>{
    if(!(await confirmAsync('You can sign back in anytime.',{title:'Sign out?',confirm:'Sign out'}))) return;
    await signOutClient();
    // Force signed-out state locally — never rely on onAuthStateChange, which won't fire if
    // signOut stalled. Mirrors the SIGNED_OUT branch (safe/idempotent if that also fires).
    hydratedForUser.current = null; lastSeenAt.current = null; prevUserId.current = null;
    setSyncError(false);
    setSession(null); setUser(null);
    resetToDefaults();
    setTimeout(()=>{ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) applyData(JSON.parse(raw),{landCurrent:true}); }catch(_){} }, 0);
  };

  /* Cross-device sync: while the tab is visible, poll the cloud blob (every 15s) and also
     refetch on focus/visibility. If another device wrote a NEWER blob, apply it. Guarded by
     updated_at AND content-equality so we never echo our own write, re-save identical data
     (which would ping-pong between devices), or clobber unsaved local edits; keepPeriod
     leaves the user's current pay-period view alone.
     NOTE: this is poll-based near-realtime, not push. A Supabase Realtime subscription would
     make it instant — a possible future upgrade. */
  useEffect(()=>{
    if(!supabase || !user) return;
    let busy=false, stopped=false;
    const normalize = o => { try{ return JSON.stringify({...o, payPeriodStart:0}); }catch(_){ return ''; } };
    const refetch = async ()=>{
      if(busy || stopped || document.visibilityState==='hidden') return;
      if(hydratedForUser.current !== user.id) return;   // only after this user has safely hydrated
      busy=true;
      try{
        const row = await withTimeout(loadCloudRow(user.id), 6000, 'sync refetch');
        if(row && row.data && row.updatedAt && (!lastSeenAt.current || new Date(row.updatedAt).getTime() > new Date(lastSeenAt.current).getTime())){
          // only apply if the remote content actually differs from what we already show
          // (ignoring the local view period) — otherwise just record that we've seen it.
          if(normalize(row.data) !== normalize(serializeState())){
            applyData(row.data,{keepPeriod:true});
          }
          lastSeenAt.current = row.updatedAt;
        }
      }catch(_){ /* offline / timeout — leave state as-is */ }
      finally{ busy=false; }
    };
    const onFocus = ()=>refetch();
    const onVis = ()=>{ if(document.visibilityState==='visible') refetch(); };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onVis);
    const id = setInterval(refetch, 15000);
    return ()=>{ stopped=true; clearInterval(id); window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', onVis); };
  },[user]);

  /* lock scroll behind overlays */
  useEffect(()=>{
    const open = sheetDate||showSettings||showBreakdown||paystub||showAuth||showFeedback||icsImport||showSwaps;
    document.body.style.overflow = open ? 'hidden':'';
    return ()=>{ document.body.style.overflow=''; };
  },[sheetDate,showSettings,showBreakdown,paystub,showAuth,showFeedback,icsImport,showSwaps]);

  /* Flush any feedback that was saved locally while offline. */
  useEffect(()=>{
    if(!supabase) return;
    let pend; try{ pend=JSON.parse(localStorage.getItem(FEEDBACK_PENDING_KEY)||'[]'); }catch(_){ pend=[]; }
    if(!Array.isArray(pend)||!pend.length) return;
    (async()=>{
      const remaining=[];
      for(const f of pend){
        const ok = await submitFeedback({message:f.message, contact:f.contact, userId:(user&&user.id)||null});
        if(!ok) remaining.push(f);
      }
      try{ localStorage.setItem(FEEDBACK_PENDING_KEY, JSON.stringify(remaining)); }catch(_){}
    })();
  },[user]);

  /* ---- period days ---- */
  const days = useMemo(()=>{
    const [y,m,d] = payPeriodStart.split('-').map(Number);
    return Array.from({length:14},(_,i)=> new Date(y,m-1,d+i));
  },[payPeriodStart]);
  const keyOf = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const addDaysISO = (s,n)=>{ const d=parseISO(s); return keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)); };
  /* the pay period (phase-aligned to `anchor`) that contains today — keeps the user's
     real 14-day cycle but always lands on the current paycheck. */
  const currentPeriodStart = (anchorISO)=> periodStartOf(todayISO(), anchorISO||todayISO());
  const periodLabel = useMemo(()=>{
    const a=days[0], b=days[13];
    const o={month:'short',day:'numeric'};
    return `${a.toLocaleDateString('en-US',o)} – ${b.toLocaleDateString('en-US',o)}, ${b.getFullYear()}`;
  },[days]);

  /* PTO gross/hours for a date: hours × baseRate, taxed normally, no differentials/bonuses. */
  const ptoStatOf = (k)=>{
    const evs = dayEvents[k]||[];
    let g=0,h=0;
    evs.forEach(e=>{ if(e.kind==='pto' && e.hours>0){ g+=e.hours*baseRate; h+=e.hours; } });
    return {g,h};
  };

  /* per-day {gross,hours,count} for any date — powers every calendar view */
  const statOf = (k)=>{
    const arr = shifts[k]||[];
    let g=0,h=0; arr.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
    const pto = ptoStatOf(k);
    g += pto.g; h += pto.h;
    return {g,h,n:arr.length};
  };

  /* viewTitle/navCal now only serve the Year view's calnav (Month has its own continuous-scroll
     header + greet-row stepper; Pay period & Week views were removed 2026-07-24). */
  const viewTitle = useMemo(()=> String(parseISO(calFocus).getFullYear()), [calFocus]);

  const navCal = (dir)=>{ const f=parseISO(calFocus); setCalFocus(keyOf(new Date(f.getFullYear()+dir,f.getMonth(),1))); };

  /* month view: continuous vertical scroll, 3 months before calFocus's month through 12 after.
     calFocus starts as today's date (its own useState initializer, independent of payPeriodStart)
     so the initial mount always centers on today's month, and a Year-view tap sets it to the
     tapped month — so centering the window on calFocus covers both entry paths. */
  const MONTH_BEFORE=3, MONTH_AFTER=12;
  const monthWindow = useMemo(()=>{
    if(calView!=='month') return [];
    const f=parseISO(calFocus), y=f.getFullYear(), m=f.getMonth();
    return Array.from({length:MONTH_BEFORE+MONTH_AFTER+1},(_,i)=>{
      const d = new Date(y, m-MONTH_BEFORE+i, 1);
      return {key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`, y:d.getFullYear(), m:d.getMonth()};
    });
  },[calView,calFocus]);
  const monthScrollRef = useRef(null);      // the .cal-vscroll container
  const monthSecRefs = useRef({});          // key ("YYYY-MM") -> section DOM node
  /* Scrolls the month container so the given "YYYY-MM" section's header sits at the top —
     shared by the entry-auto-scroll effect below and the Today button (jumpToday), which needs
     the same jump even when calFocus doesn't change value (e.g. already on today's month but
     the user scrolled away by hand — a plain state bail-out wouldn't re-run the effect). */
  const scrollMonthTo = (targetKey)=>{
    const container = monthScrollRef.current, sec = monthSecRefs.current[targetKey];
    if(!container || !sec) return;
    const cRect = container.getBoundingClientRect(), sRect = sec.getBoundingClientRect();
    container.scrollTop += (sRect.top - cRect.top);   // instant, not smooth
  };
  /* Suppresses the scroll-follow handler below while WE drive the scroll position (Today,
     the greet-row stepper, or this entry effect) — otherwise a programmatic scroll would be
     misread as the user browsing and flicker the hero through unintended periods. Token-based
     so an overlapping suppress call (e.g. the layout effect firing mid-animation) only ever
     *extends* the window — a shorter, earlier timeout can't cut off a later one's animation. */
  const programmaticScroll = useRef(false);
  const scrollSuppressTok = useRef(0);
  const suppressFollow = (ms=400)=>{
    const tok = ++scrollSuppressTok.current;
    programmaticScroll.current = true;
    setTimeout(()=>{ if(scrollSuppressTok.current===tok) programmaticScroll.current=false; }, ms);
  };
  useLayoutEffect(()=>{
    if(calView!=='month') return;
    suppressFollow(300);
    const f=parseISO(calFocus);
    scrollMonthTo(`${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}`);
    // ready/setupComplete: Month is now the default landing view, so this can first fire while
    // still on the boot splash or the onboarding screen (calendar not in the DOM yet, scrollMonthTo
    // silently no-ops). Neither is in the effect's "does the view need re-centering" logic, but both
    // gate whether the .cal-vscroll container exists at all — include them so the effect retries
    // once the dashboard actually mounts, instead of leaving the container un-scrolled forever.
  },[calView,calFocus,monthWindow,ready,setupComplete]);

  /* Hero auto-follows scroll (Month view): the period containing the day-cell row nearest a
     focus line ~1/3 down the visible scrollbox becomes ACTIVE. Cheap by construction — only
     runs once per scroll-settle (not per frame): find the month section straddling the focus
     line (>=16 cheap rect reads), then every cell sharing that row within JUST that section.
     A calendar-week row can itself straddle a period boundary (e.g. a period starting on a
     Monday puts Sunday in the OLD period, Mon–Sat in the new one, all in the same grid row) —
     resolve that split by majority of the row's 7 dates rather than an arbitrary single cell. */
  const scrollSettleTimer = useRef(null);
  const focusRowDates = ()=>{
    const container = monthScrollRef.current;
    if(!container) return null;
    const cRect = container.getBoundingClientRect();
    const focusY = cRect.top + cRect.height/3;
    const secs = Object.values(monthSecRefs.current).filter(Boolean);
    if(!secs.length) return null;
    let sec = secs.find(el=>{ const r=el.getBoundingClientRect(); return focusY>=r.top && focusY<=r.bottom; });
    if(!sec){
      let bestD=Infinity;
      secs.forEach(el=>{ const r=el.getBoundingClientRect(); const d=Math.min(Math.abs(r.top-focusY),Math.abs(r.bottom-focusY)); if(d<bestD){ bestD=d; sec=el; } });
    }
    if(!sec) return null;
    const cells = [...sec.querySelectorAll('.cell[data-date]')];
    if(!cells.length) return null;
    let bestTop=null, bestD=Infinity;

  const onMonthScroll = ()=>{

      if(!dates || !dates.length) return;
      const counts = new Map();
      dates.forEach(d=>{ const ps=periodStartOf(d,payPeriodStart); counts.set(ps,(counts.get(ps)||0)+1); });
      let ps=null, best=-1;
      counts.forEach((c,k)=>{ if(c>best){ best=c; ps=k; } });

  };

  const scrollFocusToDate = (dateISO)=>{
    const container = monthScrollRef.current;
    if(!container) return;

      const cell = container.querySelector(`.cell[data-date="${dateISO}"]`);
      if(!cell) return;

      const delta = (cellRect.top - cRect.top) - cRect.height/3;
      animateScrollTop(container, container.scrollTop + delta, 380);

  /* year view: 12-month totals from all shifts in the focused year */
  const yearMonths = useMemo(()=>{
    if(calView!=='year') return [];

      const prefix = `${y}-${String(m+1).padStart(2,'0')}-`;
      let g=0,h=0,n=0;
      Object.keys(shifts).forEach(k=>{ if(k.indexOf(prefix)===0){ (shifts[k]||[]).forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; n++; }); } });

  /* ---- calculations ---- */
  const calc = useMemo(()=>{
    let gross=0, hours=0;
    // Scope to the active pay period — a pay period is one paycheck, so taxes on this
    // gross give a proper per-paycheck take-home estimate (and the hero matches its label).
    const periodKeys = new Set(days.map(keyOf));
    Object.keys(shifts).forEach(k=>{
      if(!periodKeys.has(k)) return;
      (shifts[k]||[]).forEach(s=>{
        gross += shiftGross(baseRate, differentials[s.shiftType], s);
        hours += s.hours;
      });
    });
    // PTO: hours × baseRate adds to gross like worked time (taxed normally), but skips
    // differentials/bonuses entirely — scoped to the active pay period same as shifts.
    Object.keys(dayEvents).forEach(k=>{
      if(!periodKeys.has(k)) return;
      (dayEvents[k]||[]).forEach(e=>{
        if(e.kind==='pto' && e.hours>0){ gross += e.hours*baseRate; hours += e.hours; }
      });
    });
    // FICA (Social Security/Medicare) is levied on gross wages; pre-tax 401k/403b
    // deferrals only reduce income-tax wages. Keep the two bases separate.
    const ficaBase = gross;
    const incomeTaxBase = Math.max(0, gross - pretaxDeductions);
    let fica = 0;
    if(ficaType==='standard') fica = ficaBase*0.0765;
    else if(ficaType==='percent') fica = ficaBase*((parseFloat(ficaPct)||0)/100);
    const fed = incomeTaxBase*(federalTaxRate/100);
    const st  = incomeTaxBase*(stateTaxRate/100);
    let cw = 0;
    customWithholdings.forEach(w=>{ cw += w.type==='percent' ? incomeTaxBase*((parseFloat(w.amount)||0)/100) : (parseFloat(w.amount)||0); });
    const ded = pretaxDeductions+fica+fed+st+posttaxDeductions+cw;
    const net = Math.max(0, gross-ded);
    // Cap displayed flat pre/post at what gross can absorb so Breakdown rows still sum.
    const flatCapTotal = Math.max(0, gross - (fica+fed+st+cw));
    const dispPre  = Math.min(pretaxDeductions, flatCapTotal);
    const dispPost = Math.min(posttaxDeductions, Math.max(0, flatCapTotal - dispPre));
    return {gross,hours,fica,fed,st,cw,ded,net,pre:dispPre,post:dispPost,
      pct: gross>0 ? Math.round(net/gross*100) : 0};

  const shiftCount = useMemo(()=> Object.values(shifts).reduce((a,arr)=>a+(arr?arr.length:0),0),[shifts]);

    const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=`scrubpay-${todayISO()}.json`; a.click(); URL.revokeObjectURL(u);
  };

  /* Export every logged shift and day event (all dates, not just the active pay period) as an

  const exportICS = ()=>{
    const dtstamp = (()=>{ const d=new Date();
      return d.getUTCFullYear()+String(d.getUTCMonth()+1).padStart(2,'0')+String(d.getUTCDate()).padStart(2,'0')

    const dateKeys = new Set([...Object.keys(shifts), ...Object.keys(dayEvents)]);

    // crafted id can't inject CR/LF (or other structure) into the UID line of the .ics.
    const safeId = v => String(v==null?'x':v).replace(/[^A-Za-z0-9._-]/g,'') || 'x';
    Array.from(dateKeys).sort().forEach(dateKey=>{
      const compact = dateKey.replace(/-/g,'');
      const note = notes[dateKey];
      (shifts[dateKey]||[]).forEach(s=>{
        const label = (differentials[s.shiftType]&&differentials[s.shiftType].name) || s.shiftType || 'Shift';
        const bonusLabel = (s.bonusType && s.bonusType!=='none') ? ICS_BONUS_LABEL[s.bonusType] : null;
        const summary = `${label} shift · ${s.hours}h${bonusLabel?` · ${bonusLabel}`:''}`;
        const lines = ['BEGIN:VEVENT', 'UID:scrubpay-'+dateKey+'-'+safeId(s.id)+'@scrubpay', 'DTSTAMP:'+dtstamp];
        if(s.start && TIME_RE.test(s.start)){
          const [hh,mm] = s.start.split(':');
          lines.push('DTSTART:'+compact+'T'+hh+mm+'00');
          const totalMin = Math.round(Number(s.hours)*60);
          const dh = Math.floor(totalMin/60), dm = totalMin%60;
          let dur = 'PT'; if(dh>0) dur += dh+'H'; if(dm>0 || dh===0) dur += dm+'M';
          lines.push('DURATION:'+dur);
        } else {
          lines.push('DTSTART;VALUE=DATE:'+compact);
          lines.push('DTEND;VALUE=DATE:'+addDaysISO(dateKey,1).replace(/-/g,''));
        }
        lines.push('SUMMARY:'+icsEscape(summary));
        if(note) lines.push('DESCRIPTION:'+icsEscape(note));
        lines.push('END:VEVENT');
        veventLines.push(...lines);
        n++;
      });
      (dayEvents[dateKey]||[]).forEach(ev=>{
        const label = ICS_EVENT_LABEL[ev.kind] || 'Event';
        const summary = (ev.kind==='pto' && ev.hours>0) ? `${label} · ${ev.hours}h` : label;
        const lines = ['BEGIN:VEVENT', 'UID:scrubpay-'+dateKey+'-'+safeId(ev.id)+'@scrubpay', 'DTSTAMP:'+dtstamp,
          'DTSTART;VALUE=DATE:'+compact,
          'DTEND;VALUE=DATE:'+addDaysISO(dateKey,1).replace(/-/g,''),
          'SUMMARY:'+icsEscape(summary)];

        lines.push('END:VEVENT');
        veventLines.push(...lines);
        n++;
      });

    // Re-import idempotency: an existing shift anywhere carrying the same icsUid gets
    // MOVED/UPDATED (new date/hours/start), but its user-chosen shiftType/bonusType is kept —
    // those events skip the questionnaire entirely.
    const existingByUid = {};
    Object.entries(shifts).forEach(([dk,arr])=>{
      (arr||[]).forEach(s=>{ if(s.icsUid) existingByUid[s.icsUid] = {dateKey:dk, shift:s}; });
    });

          shiftType:match.shift.shiftType, bonusType:match.shift.bonusType, customBonus:match.shift.customBonus });
      } else {

  const clearAll = async ()=>{
    const signedIn = !!user;

  /* ---- paystub PDF ---- */
  const parsePDF = async (file)=>{
    const buf = await file.arrayBuffer();
    // Worker is hosted same-origin (deployed next to index.html) — no third-party CDN in the
    // paystub path. isEvalSupported:false is the documented CVE-2024-4367 hardening.
    pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text += c.items.map(x=>x.str).join(' ')+'\n'; }
    const ex={};
    let m;
    if((m=text.match(/Pay Begin Date:\s*(\d{2}\/\d{2}\/\d{4})/))){ const[mm,dd,yy]=m[1].split('/'); ex.payPeriodStart=`${yy}-${mm}-${dd}`; }
    if((m=text.match(/Pay Rate:\s*\$?([\d,]+\.?\d*)\s*Hourly/))) ex.baseRate=parseFloat(m[1].replace(/,/g,''));
    if((m=text.match(/403\(b\)[^\d]+([\d,]+\.?\d*)/))) ex.pretaxDeductions=parseFloat(m[1].replace(/,/g,''));
    const med=text.match(/Fed MED\/EE[^\d]+([\d,]+\.?\d*)/), oas=text.match(/Fed OASDI\/EE[^\d]+([\d,]+\.?\d*)/);
    if(med&&oas) ex.ficaWithholding=parseFloat(med[1].replace(/,/g,''))+parseFloat(oas[1].replace(/,/g,''));
    let stt=0; const pa=text.match(/PA W\/H[^\d]+([\d,]+\.?\d*)/), ph=text.match(/PA PHILADELPHIA W\/H[^\d]+([\d,]+\.?\d*)/), ls=text.match(/PA LS Tax[^\d]+([\d,]+\.?\d*)/);
    if(pa)stt+=parseFloat(pa[1].replace(/,/g,'')); if(ph)stt+=parseFloat(ph[1].replace(/,/g,'')); if(ls)stt+=parseFloat(ls[1].replace(/,/g,''));
    if(stt>0) ex.stateTax=stt;
    const g=text.match(/TOTAL GROSS[^\d]+([\d,]+\.?\d*)/); if(g) ex.grossPay=parseFloat(g[1].replace(/,/g,''));
    if(ex.ficaWithholding&&ex.grossPay) ex.ficaRate=ex.ficaWithholding/ex.grossPay*100;
    if(ex.stateTax&&ex.grossPay){ const stBase=ex.grossPay-(ex.pretaxDeductions||0); if(stBase>0) ex.stateTaxRate=ex.stateTax/stBase*100; }
    ex.shifts=[]; const sec=text.match(/HOURS AND EARNINGS([\s\S]*?)TAXES/);
    if(sec){ const rx=/(?:PD |Incentive - )([\w\s-]+?)\s+([\d.]+)\s+([\d.]+)\s+([\d,.]+)(?:\s+[\d.]+\s+[\d,.]+)?/g; let mm2; const seen=new Set();
      while((mm2=rx.exec(sec[1]))!==null){ const desc=mm2[1].trim(); const hrs=parseFloat(mm2[3]); const k=desc.toLowerCase();
        if(hrs>0&&hrs<200&&!seen.has(k)){ seen.add(k); ex.shifts.push({description:desc,rate:parseFloat(mm2[2]),hours:hrs,earnings:parseFloat(mm2[4].replace(/,/g,''))}); } } }
    return ex;
  };
  const onPaystub = async (e)=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>10*1024*1024){ toast('File too large (max 10MB).','error'); e.target.value=''; return; }
    if(f.type!=='application/pdf'){ toast('Please upload a PDF.','error'); e.target.value=''; return; }
    setParsing(true);
    try{ const p=await parsePDF(f); setPaystub(p); }
    catch(err){ toast('Could not parse that paystub.','error'); console.error(err); }
    finally{ setParsing(false); e.target.value=''; }
  };
  const applyPaystub = (override)=>{
    // `override` carries the (possibly user-edited) values from the review sheet.
    const p = override || paystub; if(!p) return;
    if(p.baseRate) setBaseRate(p.baseRate);
    if(p.payPeriodStart) setPPS(p.payPeriodStart);
    if(p.pretaxDeductions) setPretax(p.pretaxDeductions);
    if(p.stateTaxRate) setState(Math.round(p.stateTaxRate*100)/100);
    if(p.ficaRate){ setFicaType('percent'); setFicaPct(Math.round(p.ficaRate*100)/100); }
    if(p.shifts&&p.shifts.length&&p.baseRate){
      const nd={...differentials};
      p.shifts.forEach(s=>{
        const key=classifyPaystubRow(s.description);
        if(!key || key==='base') return;   // never mutate Day-regular; skip unrecognized rows
        const da = Math.round((s.rate-p.baseRate)*100)/100;
        nd[key]={...nd[key], amount: nd[key]&&nd[key].type==='multiplier'?nd[key].amount:da, active:true};
      });
      setDiff(nd);
    }
    setPaystub(null); setSetupComplete(true); setObStep(0);
    track('paystub_imported', {shifts: (p.shifts&&p.shifts.length)||0}, user?.id);
  };

  if(!ready) return null;

  /* ============== ONBOARDING ============== */
  if(!setupComplete){
    return <>
      <Onboarding {...{obStep,setObStep,name,setName,baseRate,setBaseRate,num,
      differentials,setDiff,federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
      pretaxDeductions,setPretax,posttaxDeductions,setPosttax,
      onPaystub,parsing,finish:()=>{setSetupComplete(true); track('setup_completed', null, user?.id);},
      sampleNet:()=>{ // illustrative typical 2wk schedule from their rates
        const sample=[ {shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},
          {shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'base',hours:12,bonusType:'none'} ];
        let g=0,h=0; sample.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
        const ficaBase=g; const incomeTaxBase=Math.max(0,g-pretaxDeductions);
        const fica=ficaType==='percent'?ficaBase*((parseFloat(ficaPct)||0)/100):ficaBase*0.0765;
        const net=Math.max(0, g-(pretaxDeductions+fica+incomeTaxBase*(federalTaxRate/100)+incomeTaxBase*(stateTaxRate/100)+posttaxDeductions));
        return {net,gross:g,hours:h}; }
    }} />
      {paystub && <PaystubReview paystub={paystub} differentials={differentials} onApply={applyPaystub} onCancel={()=>setPaystub(null)} />}
    </>;
  }

  /* ============== MAIN APP ============== */
  const sampleWeekendNet = Math.round(shiftGross(baseRate, differentials['weekend-eve'], {shiftType:'weekend-eve',hours:12,bonusType:'none'}) * keepRatio);

  return (
    <div>
      <div className="topbar">
        <div className="brand"><span className="b-dot"></span>scrubpay</div>
        <nav className="topnav"><span className="on">Planner</span><button className="linklike" onClick={()=>document.querySelector('.cal-head')?.scrollIntoView({block:'start'})}>Calendar</button><button className="linklike" onClick={()=>setShowSwaps(true)}>Swaps{swapPendingCount>0 && <span className="count-badge" aria-label={`${swapPendingCount} swap${swapPendingCount===1?'':'s'} awaiting your accept`}>{swapPendingCount}</span>}</button><button className="linklike" onClick={()=>setShowSettings(true)}>Settings</button></nav>
        <div className="top-actions">
          {syncing && <span style={{fontSize:12,color:'var(--muted-2)',marginRight:8}}>Syncing...</span>}
          {!syncing && syncError && <button className="linklike" onClick={retrySync} title="Tap to retry" style={{fontSize:12,color:'var(--danger)',padding:'11px 6px',margin:'-11px 6px -11px 0',display:'inline-flex',alignItems:'center',cursor:'pointer'}}>Couldn't sync — saved on this device ⟳</button>}
          <button className="btn btn-primary btn-sm desk-only" onClick={()=>{const k=keyOf(days.find(d=>!(shifts[keyOf(d)])) || days[0]); openSheet(k);}}>+ Log a shift</button>
          <button className="iconbtn" title="Send feedback" aria-label="Send feedback" onClick={()=>setShowFeedback(true)}>{Ic.chat}</button>
          <button className="iconbtn" title="Settings" onClick={()=>setShowSettings(true)}>{Ic.gear}</button>
          {user
            ? <button className="iconbtn" title="Sign out" onClick={handleSignOut}>{Ic.logout}</button>
            : <button className="btn btn-primary btn-sm" onClick={()=>setShowAuth(true)}>Sign in</button>}
          <div className="avatar">{user ? (user.email||'?').charAt(0).toUpperCase() : (name||'?').trim().charAt(0).toUpperCase()}</div>
        </div>
      </div>

      <div className="wrap">
        <div className="greet-row">
          <div className="greet"><div className="hi">{greeting()}</div><div className="name">{name==='there'?'Welcome back':name}</div></div>
          <div className="period"><button onClick={()=>movePeriod(-1)}>‹</button><span className="num">{periodLabel}</span><button onClick={()=>movePeriod(1)}>›</button></div>
        </div>

        <div className="dash">
          {/* LEFT */}
          <div className="col">
            <div className="hero">
              <div className="lbl">Projected take-home</div>
              <div className="num num">{fmt(calc.net)}</div>
              <div className="chips">
                <span className="chip">Gross {fmt(calc.gross)}</span>
                <span className="chip">Taxes & deductions –{fmt(calc.ded)}</span>
                {calc.hours>0 && <span className="chip">{calc.hours} hrs · {periodShiftCount} shifts</span>}
              </div>
              <button className="hero more linklike" onClick={()=>setShowBreakdown(true)}>See the full breakdown ›</button>
            </div>

            <div className="stats">
              <div className="stat"><div className="v num">{calc.hours.toFixed(calc.hours%1?1:0)}</div><div className="k">hours this period</div></div>
              <div className="stat"><div className="v num">{periodShiftCount}</div><div className="k">shifts this period</div></div>
            </div>

              <button onClick={()=>setShowSwaps(true)}>Open</button>

            {shiftCount>0 && baseRate>0 &&
              <div className="whatif">
                <div style={{flex:1}}><div className="t">Pick up a weekend night?</div><div className="s">That's about <b>+{fmt(sampleWeekendNet)}</b> take-home.</div></div>
                <button onClick={()=>{ const sat=days.find(d=>d.getDay()===6 && !(shifts[keyOf(d)])) || days.find(d=>d.getDay()===6) || days[0]; openSheet(keyOf(sat)); }}>Try it</button>
              </div>}

            <div className="card">
              <div className="cal-head"><div><div className="ttl">Calendar</div></div><div className="sub">{qfMode?'':'Tap a day to add or edit'}</div></div>
              {!qfMode &&

                {[['month','Month'],['year','Year']].map(([v,l])=>
                  <button key={v} role="tab" aria-selected={calView===v} className={calView===v?'on':''}

                      {monthWindow.map(mo=>

            {shiftCount===0 &&
              <div className="card" style={{textAlign:'center',padding:'26px 18px'}}>
                <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:17}}>No shifts yet</div>

                <button className="btn btn-soft" onClick={()=>openSheet(keyOf(days[0]))}>+ Log a shift</button>
              </div>}
            <div className="card">
              <h3 style={{display:'flex',alignItems:'center',gap:8}}>{Ic.swap}Shift swaps{swapPendingCount>0 && <span className="count-badge" aria-label={`${swapPendingCount} swap${swapPendingCount===1?'':'s'} awaiting your accept`}>{swapPendingCount}</span>}</h3>
              <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.5,marginBottom:14}}>Trade shifts with your unit — anonymously</div>

          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="sheet-h"><div className="t">Your paycheck math</div><button className="back" onClick={()=>setShowBreakdown(false)}>{Ic.x}</button></div>
            <div className="sub" style={{fontSize:13,color:'var(--muted-2)',marginBottom:16}}>{periodLabel} · here's where it goes</div>
            <Breakdown calc={calc} />

          </div>
        </div>}

      {showSettings &&
        <Settings onClose={()=>setShowSettings(false)}
          {...{name,setName,baseRate,setBaseRate,federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
            pretaxDeductions,setPretax,posttaxDeductions,setPosttax,differentials,setDiff,customWithholdings,setCW,num,

            onImportICS,
            onFeedback:()=>{ setShowSettings(false); setShowFeedback(true); }}} />}

      {showSwaps &&
        <SwapsSheet user={user} shifts={shifts} dayEvents={dayEvents} notes={notes} saveDayShifts={saveDayShifts} differentials={differentials}
          onClose={()=>setShowSwaps(false)} onOpenAuth={()=>{ setAuthMode('signin'); setShowAuth(true); }}
          onPendingCount={setSwapPendingCount} />}

      {showAuth && <AuthModal mode={authMode} onClose={()=>setShowAuth(false)} />}

      {showFeedback && <FeedbackSheet user={user} onClose={()=>setShowFeedback(false)} />}

      {paystub && <PaystubReview paystub={paystub} differentials={differentials} onApply={applyPaystub} onCancel={()=>setPaystub(null)} />}

      {icsImport &&
        <IcsImportSheet state={icsImport} differentials={differentials}
          onAnswer={icsAnswer} onBack={icsBack} onNext={icsNext}
          onConfirm={icsConfirmImport} onCancel={icsCancelImport} onDismissNotices={icsDismissNotices} />}

      <input ref={fileImport} type="file" accept=".json" onChange={importData} style={{display:'none'}} />
    </div>
  );
}

function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

/* ---------- Paystub review sheet (shown after a scan; applyPaystub is wired here) ---------- */
function PaystubReview({paystub,differentials,onApply,onCancel}){
  const p=paystub||{};
  const empty = !p.baseRate && !p.grossPay && !(p.shifts&&p.shifts.length);
  const [base,setBase]=useState(p.baseRate!=null?String(p.baseRate):'');
  const [pps,setPps]=useState(p.payPeriodStart||'');
  const [pre,setPre]=useState(p.pretaxDeductions!=null?String(p.pretaxDeductions):'');
  const [fica,setFica]=useState(p.ficaRate!=null?String(Math.round(p.ficaRate*100)/100):'');
  const [st,setSt]=useState(p.stateTaxRate!=null?String(Math.round(p.stateTaxRate*100)/100):'');

  if(empty){
    return (
      <div className="scrim" onClick={onCancel}>
        <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:440}}>
          <div className="sheet-h"><div className="t">Couldn't read that paystub</div><button className="back" onClick={onCancel}>{Ic.x}</button></div>
          <div className="help">We couldn't read this paystub format — you can set things up manually.</div>
          <div className="spacer" style={{height:18}}></div>
          <button className="btn btn-primary" onClick={onCancel}>Set it up manually</button>
        </div>
      </div>
    );
  }

  const baseNum = parseFloat(base)||0;
  const rows = (p.shifts||[]).map(s=>({...s, key:classifyPaystubRow(s.description)}));

  const apply=()=>{
    const draft={...p};
    const bn=parseFloat(base); if(!isNaN(bn)&&bn>0) draft.baseRate=bn; else delete draft.baseRate;
    if(pps) draft.payPeriodStart=pps; else delete draft.payPeriodStart;
    const pn=parseFloat(pre); if(!isNaN(pn)) draft.pretaxDeductions=pn; else delete draft.pretaxDeductions;
    const fn=parseFloat(fica); if(!isNaN(fn)) draft.ficaRate=fn; else delete draft.ficaRate;
    const sn=parseFloat(st); if(!isNaN(sn)) draft.stateTaxRate=sn; else delete draft.stateTaxRate;
    onApply(draft);
  };

  return (
    <div className="scrim" onClick={onCancel}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="sheet-h"><div className="t">Review your paystub</div><button className="back" onClick={onCancel}>{Ic.x}</button></div>
        <div className="sub" style={{fontSize:13,color:'var(--muted-2)',marginBottom:16}}>We read these from your PDF. Fix anything that looks off, then apply.</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <div className="row-item"><div style={{fontWeight:600,fontSize:14}}>Base hourly rate</div>
            <div className="inp pre" style={{width:124}}><span className="pfx">$</span><input type="number" inputMode="decimal" step="0.01" min="0" value={base} onChange={e=>setBase(e.target.value)} style={{textAlign:'right',fontWeight:700}}/></div></div>
          <div className="row-item"><div style={{fontWeight:600,fontSize:14}}>Pay period start</div>
            <input type="date" value={pps} onChange={e=>setPps(e.target.value)} style={{fontWeight:600,border:'1px solid var(--line)',borderRadius:11,padding:'9px 11px',fontFamily:'inherit',fontSize:13.5,background:'#fff'}}/></div>
          <div className="row-item"><div style={{fontWeight:600,fontSize:14}}>Pre-tax deductions<div style={{fontSize:11.5,color:'var(--muted-2)'}}>per pay period</div></div>
            <div className="inp pre" style={{width:124}}><span className="pfx">$</span><input type="number" inputMode="decimal" step="1" min="0" value={pre} onChange={e=>setPre(e.target.value)} style={{textAlign:'right',fontWeight:700}}/></div></div>
          <div className="row-item"><div style={{fontWeight:600,fontSize:14}}>FICA rate</div>
            <div className="inp suf" style={{width:104}}><input type="number" inputMode="decimal" step="0.01" min="0" value={fica} onChange={e=>setFica(e.target.value)} style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
          <div className="row-item"><div style={{fontWeight:600,fontSize:14}}>State tax rate</div>
            <div className="inp suf" style={{width:104}}><input type="number" inputMode="decimal" step="0.01" min="0" value={st} onChange={e=>setSt(e.target.value)} style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
        </div>

        {rows.length>0 && <>
          <div className="sec-lab" style={{marginTop:18}}>DETECTED DIFFERENTIAL ROWS</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {rows.map((r,i)=>{
              const da=Math.round((r.rate-baseNum)*100)/100;
              const known = r.key && r.key!=='base';
              const diff = known ? differentials[r.key] : null;
              return (
                <div className="row-item" key={i}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13.5}}>{r.description}</div>
                    <div style={{fontSize:11.5,color: known?'var(--muted-2)':'var(--danger)'}}>
                      {known
                        ? `→ ${diff?.name||r.key}${diff?.type==='multiplier'?'':`  ·  +$${da.toFixed(2)}/hr`}`
                        : 'Unrecognized — ignored'}
                    </div>
                  </div>
                  <div className="num" style={{fontWeight:700,fontSize:13.5,color: known?'var(--money-ink)':'var(--muted-2)'}}>${Number(r.rate||0).toFixed(2)}/hr</div>
                </div>
              );
            })}
          </div>
        </>}

        <div className="spacer" style={{height:18}}></div>
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-ghost" style={{flex:1}} onClick={onCancel}>Cancel</button>
          <button className="btn btn-primary" style={{flex:1}} onClick={apply}>Apply to my planner</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Schedule (.ics) import stepper ---------- */
/* An "Intuit-style" guided questionnaire: one card per group of similar events (see
   groupICSEvents), pre-filled by inferShiftType, ending in a confirm-all summary card.
   Re-import matches (icsImport.state.toUpdate) never reach this component — they're
   applied directly on confirm. */
function IcsImportSheet({state,differentials,onAnswer,onBack,onNext,onConfirm,onCancel,onDismissNotices}){
  const {groups,toUpdate,answers,stepIdx,dropNotice} = state;
  const total = groups.length;
  const isFinal = stepIdx >= total;
  const CHIP_OPTS = [
    ['base','Day'], ['night','Night'], ['weekend-day','Weekend day'],
    ['weekend-eve','Weekend night'], ['holiday','Holiday'], ['skip','Skip these'],
  ];

  // Parse-time drop notice (repeating / cap / window — see icsDropSummary) shown as a compact,
  // muted single line — not a toast — so it never covers the sheet's own chips/Next/Back
  // buttons. Only shown on the first card; tap to dismiss early.
  const noticeBanner = stepIdx===0 && dropNotice && (
    <div className="sub" style={{fontSize:12.5,color:'var(--muted-2)',marginBottom:16,cursor:'pointer'}} onClick={onDismissNotices} title="Dismiss">
      {dropNotice}
    </div>
  );

  if(isFinal){
    const toAdd = groups.reduce((n,g)=> n + (answers[g.key]!=='skip' ? g.items.length : 0), 0);
    const toSkip = groups.reduce((n,g)=> n + (answers[g.key]==='skip' ? g.items.length : 0), 0);
    return (
      <div className="scrim" onClick={onCancel}>
        <div className="sheet" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Confirm schedule import">
          <div className="grab"></div>
          <div className="sheet-h"><div className="t">Ready to import</div><button className="back" onClick={onCancel} aria-label="Close">{Ic.x}</button></div>
          {noticeBanner}
          <p style={{fontSize:14,color:'var(--muted)',lineHeight:1.5,margin:'0 0 20px'}}>
            {toUpdate.length>0
              ? `Add ${toAdd} shifts to your calendar and update ${toUpdate.length} that already changed?`
              : `Add ${toAdd} shifts to your calendar?`}
            {toSkip>0 && ` (${toSkip} skipped)`}
          </p>
          <div style={{display:'flex',gap:10}}>
            {total>0 && <button className="back" style={{width:44,height:44}} onClick={onBack} aria-label="Back">‹</button>}
            <button className="btn btn-primary" style={{flex:1}} onClick={onConfirm}>Confirm</button>
          </div>
        </div>
      </div>
    );
  }

  const g = groups[stepIdx];
  const sel = answers[g.key];
  return (
    <div className="scrim" onClick={onCancel}>
      <div className="sheet" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Classify imported shift">
        <div className="grab"></div>
        <div className="sheet-h"><div className="t">Import schedule</div><button className="back" onClick={onCancel} aria-label="Close">{Ic.x}</button></div>
        {noticeBanner}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18}}>
          <div className="prog"><i style={{width:((stepIdx+1)/(total+1)*100)+'%'}}></i></div>
          <span style={{fontSize:12,fontWeight:600,color:'var(--muted-2)',flex:'0 0 auto'}}>{stepIdx+1} of {total+1}</span>
        </div>
        <div className="display" style={{fontWeight:700,fontSize:19,marginBottom:6}}>{groupLabel(g)}</div>
        <div style={{fontSize:13.5,color:'var(--muted)',marginBottom:18}}>What kind of shift is this?</div>
        <div className="chips-grid" style={{marginBottom:22}}>
          {CHIP_OPTS.map(([k,l])=>(
            <button key={k} className={'chip-sel'+(sel===k?' on':'')} aria-pressed={sel===k} style={{minHeight:44}} onClick={()=>onAnswer(g.key,k)}>
              <i style={{background: k==='skip' ? 'transparent' : (differentials[k]?.color||'#8A93A6')}}></i>{l}
            </button>
          ))}
        </div>
        <div style={{display:'flex',gap:10}}>
          {stepIdx>0 && <button className="back" style={{width:44,height:44}} onClick={onBack} aria-label="Back">‹</button>}
          <button className="btn btn-primary" style={{flex:1}} onClick={onNext}>{stepIdx+1===total ? 'Review':'Next'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- Calendar ---------- */
function Calendar({days,keyOf,statOf,differentials,shifts,dayEvents,notes,onPick,qfActive,qfTemplateId,keepRatio,periodAnchor,onBoundaryPick}){
  const lead = days[0].getDay();
  const today = todayISO();
  // Flatten into grid "slots" (leading blanks + real days) so we can walk it in row order and
  // insert a full-width pay-period divider before whichever row contains a period-start date —
  // always at a row boundary (never mid-week), so the 7-column alignment never breaks.
  const slots = [];
  for(let i=0;i<lead;i++) slots.push({empty:true});
  days.forEach(dt=> slots.push({empty:false, dt, k:keyOf(dt)}));

  const nodes = [];
  slots.forEach((slot,i)=>{
    if(i%7===0 && periodAnchor){
      const row = slots.slice(i,i+7);
      const boundary = row.find(s=>!s.empty && periodStartOf(s.k,periodAnchor)===s.k);
      if(boundary){
        nodes.push(
          <div key={'div'+boundary.k} className="cal-pp-div">
            <button type="button" className="pp-chip" onClick={()=>onBoundaryPick && onBoundaryPick(boundary.k)}>{periodRangeLabel(boundary.k)}</button>
          </div>);
      }
    }
    if(slot.empty){ nodes.push(<div key={'e'+i} className="cell empty"></div>); return; }
    const {dt,k} = slot;
    const t=statOf(k); const arr=shifts[k]||[];
    const evs=(dayEvents&&dayEvents[k])||[];
    const hasShift=arr.length>0, hasEvent=evs.length>0, has=hasShift||hasEvent;
    const hasNote=!!(notes&&notes[k]);
    const qfOn = qfActive && arr.some(s=>s.templateId===qfTemplateId);
    const isToday = k===today;
    const isActive = !!periodAnchor && periodStartOf(k,periodAnchor)===periodAnchor;
    nodes.push(
      <button key={k} data-date={k} className={'cell'+(has?' has':'')+(qfOn?' qf-on':'')+(isToday?' today':'')+(isActive?' pp-active':'')} onClick={()=>onPick(k)} aria-label={dt.toDateString()
          + (hasShift ? ', ' + arr.length + ' shift' + (arr.length===1?'':'s') : '')
          + (hasEvent ? ', ' + evs.length + ' day event' + (evs.length===1?'':'s') : '')
          + (t.g>0 ? ', about ' + fmt(Math.round(t.g*keepRatio)) + ' take-home' : '')
          + (!has ? ', no shifts' : '')
          + (hasNote ? ', has a note' : '')}>
        <div className="d">{dt.getDate()}{hasNote && <span className="note-mark" aria-hidden="true"></span>}</div>
        {has
          ? <div style={{marginTop:'auto'}}>
              {/* Shift glyphs and event rings share one marker row (capped to 4 combined) so a day
                  with both never grows taller than a day with just one — see .cell min-height/overflow. */}
              <div className="dots">
                {arr.slice(0,4).map((s,i)=><i key={'s'+i} className="glyph" style={{color:differentials[s.shiftType]?.color||'#8A93A6'}}>{glyphFor(s.shiftType)}</i>)}
                {evs.slice(0,Math.max(0,4-Math.min(arr.length,4))).map((e,i)=><i key={'e'+i} className="ev" style={{borderColor:EVENT_KIND_META[e.kind]?.color||'#8A93A6'}}></i>)}
              </div>
              {/* estimated take-home, not gross — see the "Day amounts are estimated take-home" hint below the legend */}
              {t.g>0 && <div className="amt num">{'~'+fmt(Math.round(t.g*keepRatio))}</div>}
            </div>
          : <div className="plus">+</div>}
      </button>);
  });
  return <div className="grid">{nodes}</div>;
}

/* ---------- Month view: one section of the continuous vertical scroll ---------- */
function MonthSection({y,m,keyOf,statOf,differentials,shifts,dayEvents,notes,onPick,qfActive,qfTemplateId,keepRatio,secRef,periodAnchor,onBoundaryPick}){
  const days = useMemo(()=>{
    const n = new Date(y,m+1,0).getDate();
    return Array.from({length:n},(_,i)=>new Date(y,m,i+1));
  },[y,m]);
  const label = new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});

    <div className="cal-month-sec" ref={secRef}>
      <div className="cal-month-h">{label}</div>
      <div className="dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d}>{d[0]}</div>)}</div>

        dayEvents={dayEvents} notes={notes} onPick={onPick}
        qfActive={qfActive} qfTemplateId={qfTemplateId} keepRatio={keepRatio}
        periodAnchor={periodAnchor} onBoundaryPick={onBoundaryPick} />

  );
}

/* ---------- Numeric input ----------
   Keeps a raw string while focused so select-all-then-clear (the normal mobile edit
   gesture) doesn't snap the value to 0 mid-edit. Commits a parsed + clamped number on
   blur/Enter. inputMode='decimal' surfaces the 10-key pad on iOS. */
function NumInput({value,onCommit,min,max,step='0.01',placeholder,style,className,ariaLabel,id}){
  const [focused,setFocused] = useState(false);
  const [raw,setRaw] = useState('');
  const display = focused ? raw : (value===''||value==null ? '' : String(value));
  const commit = (r)=>{
    const t = (r==null?'':String(r)).trim();
    if(t===''){ onCommit(min!=null?min:0); return; }
    let n = parseFloat(t);
    if(!isFinite(n)){ onCommit(value); return; }   // garbage -> revert to last good value
    if(min!=null && n<min) n=min;
    if(max!=null && n>max) n=max;
    onCommit(n);
  };
  return <input type="number" inputMode="decimal" step={step} min={min} max={max}
    id={id} aria-label={ariaLabel} className={className} style={style} placeholder={placeholder}
    value={display}
    onFocus={()=>{ setRaw(value===''||value==null?'':String(value)); setFocused(true); }}
    onChange={e=>setRaw(e.target.value)}
    onBlur={()=>{ setFocused(false); commit(raw); }}
    onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }} />;
}

/* Formats a "HH:MM" 24h string to a short 12h label, e.g. "19:00" -> "7:00 PM". */
function fmtTime12(t){
  if(!t || !TIME_RE.test(t)) return null;
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
}

/* ---------- swap board display helpers ---------- */
function fmtDateShort(dateKeyStr){
  if(!dateKeyStr) return '';
  const [y,m,d] = dateKeyStr.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
/* "Jul 21, 22, 25" — the month only appears once, at the start of each run. */
function fmtAvailDates(dates){
  if(!dates || !dates.length) return '';
  const sorted = [...dates].sort();
  let month=null; const parts=[];
  sorted.forEach(dk=>{
    const [y,m,d] = dk.split('-').map(Number);
    const mn = new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short'});
    parts.push(mn===month ? String(d) : `${mn} ${d}`);
    month = mn;
  });
  return parts.join(', ');
}
/* "Night ×12h · starts 7:00 PM" — wage-free by construction (shift_meta never carries $). */
function giveMetaLine(meta, differentials){
  if(!meta) return '';
  const label = (differentials && differentials[meta.shiftType] && differentials[meta.shiftType].name) || meta.shiftType || 'Shift';
  const t = meta.start ? fmtTime12(meta.start) : null;
  return `${label} ×${meta.hours}h${t?` · starts ${t}`:''}`;
}

/* ---------- Add Shift Sheet ---------- */
function AddShiftSheet({dateKey,days,keyOf,differentials,existing,existingEvents,existingNote,baseRate,keepRatio,templates,onSaveTemplate,onDeleteTemplate,userId,onClose,onSave}){
  const [list,setList] = useState(existing.map(s=>({...s})));
  const [shiftType,setType] = useState('night');
  const [hours,setHours] = useState(12);
  const [bonusType,setBonus] = useState('none');
  const [customBonus,setCustomBonus] = useState(0);
  const [start,setStart] = useState('');   // optional "HH:MM" start time for the shift being configured
  const [isOvertime,setOvertime] = useState(false);   // independent OT flag — stacks 1.5× on top of the shift differential
  const [events,setEvents] = useState((existingEvents||[]).map(e=>({...e})));   // "also on this day" life events
  const [note,setNote] = useState(existingNote||'');
  const [dirty,setDirty] = useState(false);   // list/events/note changed vs incoming props — used to save-on-dismiss
  const [savingTpl,setSavingTpl] = useState(false);   // inline "save as template" name input open
  const [tplName,setTplName] = useState('');
  // True whenever shiftType/hours/bonusType/customBonus/start have been touched since the last
  // add() — reset to false there. Starts true: until add() actually runs, `list` may only hold
  // pre-existing entries the user hasn't touched, so there's no "just-added" entry to trust yet.
  // Lets doSaveTemplate() tell "just-added, controls still reflect it" apart from "reconfigured
  // after adding", instead of guessing from shiftType/hours equality (which missed bonus/start-only
  // edits and silently captured stale values).
  const configDirtySinceAdd = useRef(true);

  // Exclude 'overtime' from the shift-type chips: OT is now an independent toggle that stacks on
  // top of the chosen differential (was a mutually-exclusive chip that dropped the differential).
  // Mirrors the settings differentials editor, which already filters 'overtime' out.
  const active = Object.entries(differentials).filter(([k,d])=>d.active && k!=='overtime');
  const dt = days.find(d=>keyOf(d)===dateKey) || new Date(dateKey);
  const dateLabel = dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const draft = {shiftType,hours,bonusType,customBonus,isOvertime};
  const previewGross = shiftGross(baseRate, differentials[shiftType], draft);
  const previewNet = Math.round(previewGross*keepRatio);
  const ptoEvent = events.find(e=>e.kind==='pto');

  // A configured-but-not-yet-added shift, clamped to a legal hours range (no blocking alert).
  const draftShift = ()=>{ const o={id:Date.now()+Math.random(), shiftType, hours:Math.min(24,Math.max(0.1, hours||0.1)), bonusType, customBonus, isOvertime}; if(start) o.start=start; return o; };
  const add = ()=>{ setList([...list, draftShift()]); setBonus('none'); setStart(''); setOvertime(false); setDirty(true); configDirtySinceAdd.current=false; };
  const remove = id=>{ setList(list.filter(s=>s.id!==id)); setDirty(true); };
  // Day events (PTO/education/appt/off) toggle: one entry per kind, tap again to remove.
  const toggleEvent = (kind)=>{
    setEvents(prev=>{
      const idx = prev.findIndex(e=>e.kind===kind);
      if(idx>=0) return prev.filter((_,i)=>i!==idx);
      const ev = {id:Date.now()+Math.random(), kind};
      if(kind==='pto') ev.hours = 12;
      return [...prev, ev];
    });
    setDirty(true);
  };
  const setPtoHours = (v)=>{ setEvents(prev=>prev.map(e=> e.kind==='pto' ? {...e, hours:v} : e)); setDirty(true); };
  // Whether the day already has something to save besides the shift being configured —
  // when true, the primary button won't silently auto-add an unconfirmed draft shift
  // (e.g. a PTO-only day should never gain a phantom "Night ×12h" entry).
  const hasOtherContent = events.length>0 || note.trim().length>0;
  // Primary button: if no rows were explicitly added and there's nothing else to save,
  // commit the pending draft rather than saving nothing.
  const save = ()=> onSave(list.length ? list : (hasOtherContent ? [] : [draftShift()]), events, note.trim());
  // Scrim dismiss: never silently drop rows/events/note the user already set; a clean sheet just closes.
  const dismiss = ()=> dirty ? onSave(list, events, note.trim()) : onClose();

  // One-tap template apply: adds that template's shift to this day instantly.
  const applyTemplateTap = (t)=>{
    setList(l=>[...l, {id:Date.now()+Math.random(), shiftType:t.shiftType, hours:t.hours, bonusType:t.bonusType, customBonus:t.customBonus, templateId:t.id, ...(t.start?{start:t.start}:{})}]);
    setDirty(true);
    track('template_tap', null, userId);
  };
  const doSaveTemplate = ()=>{
    const nm = tplName.trim();
    if(!nm){ toast('Give your template a name.','error'); return; }
    const clampedHours = Math.min(24,Math.max(0.1, hours||0.1));
    // add() resets bonusType/customBonus/start right after committing a shift to `list`, so in
    // the natural "configure -> + Add to this day -> Save as template" flow those fields would
    // otherwise read back as blank/none here. configDirtySinceAdd tracks explicitly whether any
    // of shiftType/hours/bonusType/customBonus/start has been touched since the last add() (set
    // there); if not, source bonus/start from the just-added entry instead of the reset draft
    // state, so the template faithfully captures what's on the day. If the user *has* reconfigured
    // since, the live control values are what they mean to save.
    const last = list[list.length-1];
    const src = (last && !configDirtySinceAdd.current)
      ? last : {bonusType, customBonus, start};
    const tpl = {name:nm.slice(0,40), shiftType, hours:clampedHours, bonusType:src.bonusType||'none', customBonus:src.customBonus||0};
    if(src.start) tpl.start = src.start;
    const ok = onSaveTemplate(tpl);
    // On a failed (capped) save, leave the input open with the typed name so freeing a slot
    // (deleting another template) lets the user retry without retyping.
    if(ok){ setSavingTpl(false); setTplName(''); toast(`Saved "${nm}" as a template.`,'success'); }
  };

  return (
    <div className="scrim" onClick={dismiss}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"></div>
        <div className="sheet-h">
          <div className="t">Add a shift</div>
          <div className="row-item" style={{margin:0,padding:'7px 12px',fontWeight:600,fontSize:12.5}}>{dateLabel}</div>
        </div>

        {templates.length>0 &&
          <div style={{marginBottom:16}}>
            <div className="sec-lab">QUICK ADD FROM TEMPLATE</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {templates.map(t=>(
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:8}}>
                  <button className="chip-sel" style={{flex:1,minHeight:44}} onClick={()=>applyTemplateTap(t)}>
                    <i style={{background:differentials[t.shiftType]?.color||'#8A93A6'}}></i>⚡ {t.name} ×{t.hours}h
                  </button>
                  <button className="back" aria-label={'Delete template '+t.name} onClick={()=>onDeleteTemplate(t)}>{Ic.x}</button>
                </div>
              ))}
            </div>
          </div>}

        {list.length>0 &&
          <div style={{marginBottom:16}}>
            <div className="sec-lab">ON THIS DAY</div>
            {list.map(s=>(
              <div className="row-item" key={s.id}>
                <span style={{display:'flex',alignItems:'center',gap:9}}>
                  <i style={{width:9,height:9,borderRadius:'50%',background:differentials[s.shiftType]?.color||'#8A93A6',display:'inline-block'}}></i>
                  <b style={{fontWeight:600,fontSize:13.5}}>{fmtTime12(s.start) ? fmtTime12(s.start)+' · ' : ''}{differentials[s.shiftType]?.name||s.shiftType} ×{s.hours}h</b>
                  {s.isOvertime && <span style={{fontSize:12,fontWeight:700,color:'#11A86B'}}>OT ×1.5</span>}
                  {s.bonusType!=='none' && <span style={{fontSize:12,color:'var(--muted)'}}>+{BONUS_LABEL[s.bonusType]}</span>}
                </span>
                <button className="danger-link" onClick={()=>remove(s.id)}>Remove</button>
              </div>
            ))}
          </div>}

        <div className="sec-lab">SHIFT TYPE</div>
        <div className="chips-grid" style={{marginBottom:16}}>
          {active.map(([k,d])=>(
            <button key={k} className={'chip-sel'+(shiftType===k?' on':'')} aria-pressed={shiftType===k} onClick={()=>{ setType(k); configDirtySinceAdd.current=true; }}>
              <i style={{background:d.color||'#8A93A6'}}></i>{d.name}
            </button>
          ))}
        </div>

        <div className="sec-lab">OVERTIME</div>
        <button className={'chip-sel'+(isOvertime?' on':'')} aria-pressed={isOvertime}
          style={{width:'100%',marginBottom:16,minHeight:44}}
          onClick={()=>{ setOvertime(v=>!v); configDirtySinceAdd.current=true; }}>
          <i style={{background:'#11A86B'}}></i>Overtime — pays 1.5× the hourly rate
        </button>

        <div className="sec-lab">HOURS</div>
        <div className="hrs" style={{marginBottom:12}}>
          {[4,8,12,16].map(h=><button key={h} className={'hc'+(hours===h?' on':'')} aria-pressed={hours===h} onClick={()=>{ setHours(h); configDirtySinceAdd.current=true; }}>{h}h</button>)}
          <div className="inp suf" style={{flex:1}}><NumInput value={hours} onCommit={v=>{ setHours(v); configDirtySinceAdd.current=true; }} step="0.5" min={0.1} max={24} ariaLabel="Hours" style={{padding:'11px 12px',textAlign:'center',fontWeight:700}}/></div>
        </div>

        <div className="sec-lab">STARTS (OPTIONAL)</div>
        <div className="inp" style={{marginBottom:16}}>
          <input type="time" value={start} onChange={e=>{ setStart(e.target.value); configDirtySinceAdd.current=true; }} aria-label="Shift start time" />
        </div>

        <div className="sec-lab">BONUS</div>
        <div className="inp" style={{marginBottom:bonusType==='custom'?10:16}}>

/* ---------- Auth Modal ---------- */
function AuthModal({mode:initialMode,onClose}){
  const [mode,setMode] = useState(initialMode||'signin');
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState('');

  const handleEmailAuth = async (e)=>{
    e.preventDefault();
    if(!supabase){ setError('Cloud sync is unavailable right now — your data is still saved on this device.'); return; }
    setLoading(true);
    setError('');
    try{
      // Call the method ON the client — detaching it (const action = supabase.auth.signUp)
      // loses `this` and throws TypeError in the strict-mode UMD bundle, hanging the button forever.
      const {error:err} = mode==='signup'
        ? await supabase.auth.signUp({email,password})
        : await supabase.auth.signInWithPassword({email,password});
      if(err) setError(err.message);
      else {
        if(mode==='signup') toast('Check your email to confirm your account!','success');
        onClose();
      }
    }catch(e2){
      setError((e2 && e2.message) || 'Something went wrong — please try again.');
    }finally{
      setLoading(false);
    }
  };

  const handleGoogleAuth = async ()=>{
    if(!supabase){ setError('Cloud sync is unavailable right now — your data is still saved on this device.'); return; }
    setLoading(true);
    setError('');
    const {error:err} = await supabase.auth.signInWithOAuth({
      provider:'google',
      // origin alone drops the /705-v1/ path on GitHub Pages — keep the full page URL
      options:{redirectTo:window.location.origin + window.location.pathname}
    });
    if(err) setError(err.message);
    setLoading(false);
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="sheet-h">
          <div className="t">{mode==='signup'?'Create account':'Sign in'}</div>
          <button className="back" onClick={onClose}>{Ic.x}</button>
        </div>

        <form onSubmit={handleEmailAuth}>
          <label className="field">
            <span className="lab">Email</span>
            <div className="inp"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="you@example.com"/></div>
          </label>
          <label className="field">
            <span className="lab">Password</span>
            <div className="inp"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" minLength={6}/></div>
          </label>
          {error && <div style={{color:'var(--danger)',fontSize:13,marginBottom:12}}>{error}</div>}
          <button type="submit" className="btn btn-primary" disabled={loading} style={{marginBottom:12}}>
            {loading ? 'Loading...' : (mode==='signup'?'Sign up':'Sign in')}
          </button>
        </form>

        <div style={{position:'relative',textAlign:'center',margin:'16px 0'}}>
          <div style={{position:'absolute',top:'50%',left:0,right:0,height:1,background:'var(--line)'}}></div>
          <span style={{position:'relative',background:'var(--paper)',padding:'0 12px',fontSize:12,color:'var(--muted-2)'}}>or</span>
        </div>

        <button className="btn btn-ghost" onClick={handleGoogleAuth} disabled={loading} style={{marginBottom:16}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div style={{textAlign:'center',fontSize:13}}>
          {mode==='signup'
            ? <span>Have an account? <button className="link" onClick={()=>{setError('');setMode('signin');}}>Sign in</button></span>
            : <span>No account? <button className="link" onClick={()=>{setError('');setMode('signup');}}>Sign up</button></span>}
