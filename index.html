<title>ScrubPay — Nursing Wage Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script crossorigin="anonymous" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-AISI5AuDG6E8DeEiFMVB3rGQxhZt24OU0avMp+GMV64+tpnA3+Z6F5MT0f96iPva" src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#16181F; --ink-2:#21242F; --paper:#F6F5F1; --card:#FFFFFF;
    --indigo:#5B4FE9; --indigo-press:#4A3FD4; --indigo-soft:#ECEAFE; --indigo-ink:#3F35B8;
    --mint:#34D399; --money:#11A86B; --money-soft:#E3F7EE; --money-ink:#0B5D3C;
    --coral:#FF6B5C; --coral-soft:#FFF3F1; --coral-ink:#7A2E26;
    --violet:#9B5BE9; --amber:#F5A524; --slate:#8A93A6;
    --muted:#6B665C; --muted-2:#9A968C; --line:#EEEDE8; --line-2:#E7E5DE;
    --danger:#C84B3C; --danger-soft:#F3D6D1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .display{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#dcdacf;border-radius:6px;border:3px solid var(--paper)}

  /* loading splash */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);z-index:9999;transition:opacity .35s}
  #splash .logo{display:flex;align-items:center;gap:10px}
  #splash .dot{width:14px;height:14px;border-radius:5px;background:var(--indigo)}
  #splash .wm{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px}
  #splash .spin{width:26px;height:26px;border:3px solid #e3e1d8;border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* layout */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(246,245,241,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px}
  .brand .b-dot{width:11px;height:11px;border-radius:4px;background:var(--indigo)}
  .topnav{display:none;gap:20px;margin-left:8px}
  .topnav span,.topnav button{font-weight:600;font-size:13.5px;color:var(--muted-2)}
  .topnav span.on,.topnav button.on{color:var(--ink)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .iconbtn::after{content:'';position:absolute;inset:-2px}
  .iconbtn:hover{background:#fbfaf7}
  /* keyboard-focusable link-styled buttons (nav, inline affordances) */
  .linklike{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 120px}
  .greet-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .greet .hi{font-size:13px;color:var(--muted-2);font-weight:500}
  .greet .name{font-family:'Bricolage Grotesque';font-weight:700;font-size:22px}
  .period{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px}
  .period button{position:relative;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:18px;line-height:1}
  .period button::after{content:'';position:absolute;inset:-10px}
  .period button:hover{background:#f1f0eb}

  .dash{display:grid;grid-template-columns:1fr;gap:16px}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:700}

  .hero{background:var(--ink);border-radius:22px;padding:22px 24px;color:#fff}
  .hero .lbl{font-size:12.5px;font-weight:600;color:#9A9DAB}
  .hero .num{font-family:'Bricolage Grotesque';font-weight:800;color:var(--mint);font-size:clamp(46px,12vw,64px);line-height:1;letter-spacing:-.03em;margin:8px 0 14px}
  .hero .chips{display:flex;flex-wrap:wrap;gap:8px}
  .hero .chip{background:rgba(255,255,255,.08);color:#D9DBE4;padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px}
  .hero .more{margin-top:14px;font-weight:600;font-size:12.5px;color:#8E92A0;display:inline-flex;align-items:center;gap:4px}
  .hero .more:hover{color:#cfd2db}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .stat .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px}
  .stat .k{font-size:12px;color:var(--muted-2);margin-top:2px;font-weight:500}

  .whatif{background:var(--indigo-soft);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px}
  .whatif .t{font-weight:600;font-size:13.5px;color:var(--indigo-ink)}
  .whatif .s{font-size:12px;color:#6A60C9;margin-top:3px}
  .whatif button{background:var(--indigo);color:#fff;padding:9px 14px;border-radius:11px;font-weight:600;font-size:12.5px;flex:0 0 auto}

  /* quick-fill banner (shift templates applied across multiple calendar days) */
  .qf-banner{background:var(--indigo-soft);border-radius:16px;padding:15px 16px;margin-bottom:14px}
  .qf-banner .t{font-weight:600;font-size:13.5px;color:var(--indigo-ink)}
  .qf-banner .s{font-size:12px;color:#6A60C9;margin-top:3px}
  .qf-banner .row{display:flex;align-items:center;gap:12px}
  .qf-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

  /* calendar */
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .cal-head .ttl{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}
  .cal-head .sub{font-size:12.5px;color:var(--muted-2)}
  .viewseg{display:flex;gap:4px;background:#EFEEE9;border-radius:12px;padding:4px;margin-bottom:14px}
  .viewseg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);background:transparent;border:0;transition:background .15s,color .15s;cursor:pointer}
  .viewseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,18,26,.1)}
  .calnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .calnav button{position:relative;width:36px;height:36px;border-radius:11px;border:1px solid var(--line-2);background:#fff;color:var(--ink);font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .calnav button::after{content:'';position:absolute;inset:-5px}
  .calnav button:hover{background:#fbfaf7}
  .calnav-t{flex:1;text-align:center;font-family:'Bricolage Grotesque';font-weight:700;font-size:15.5px}
  .yearlist{display:flex;flex-direction:column;gap:7px}
  .yrow{display:flex;align-items:center;gap:12px;width:100%;background:#fbfaf7;border:1px solid var(--line);border-radius:13px;padding:13px 15px;text-align:left;transition:background .12s}
  .yrow.has{background:#fff}
  .yrow:hover{background:var(--indigo-soft)}
  .yrow .ym{font-weight:700;font-size:14.5px;width:84px;flex:0 0 auto}
  .yrow .yd{flex:1;font-size:13px;color:var(--muted);font-weight:500}
  .yrow .ychev{color:#c9c6bc;font-size:18px;font-weight:700;flex:0 0 auto}
  .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;scrollbar-width:none}
  .cal-scroll::-webkit-scrollbar{display:none}
  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px;min-width:320px}
  .dow div{text-align:center;font-weight:700;font-size:11px;color:#A8A498}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-width:320px}
  /* min-height:0 overrides the grid item's default content-based automatic minimum size, which
     otherwise wins over aspect-ratio and stretches a cell's row taller than its siblings whenever
     that cell's content is tall — the actual cause was two stacked marker rows (shift dots + event
     rings) on days that had both; merging them into one row (below) removes that extra line so
     min-height:0 lets aspect-ratio govern every cell's height again. Deliberately no overflow:hidden
     here: that would also clip a wide $ amount (e.g. "$1,120") mid-digit against the cell's own
     horizontal padding. Width containment for the marker row is instead scoped to .dots itself. */
  .cell{position:relative;aspect-ratio:1/1;min-height:0;border-radius:11px;background:#fbfaf7;border:1px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;text-align:left;transition:transform .08s,box-shadow .12s}
  .cell:hover{box-shadow:0 4px 12px rgba(20,20,30,.08);transform:translateY(-1px)}
  .cell.empty{border-style:dashed;background:#fff;pointer-events:none}
  .cell .d{font-weight:700;font-size:13px}
  .cell .plus{margin-top:auto;color:#cfccc2;font-size:17px;font-weight:700}
  /* Single marker row: shift dots and event rings render together (not stacked rows) so a cell
     with both never needs more vertical space than a cell with just one. */
  .cell .dots{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
  .cell .dots i{flex:none;width:7px;height:7px;border-radius:50%}
  /* hollow rings for day events (PTO/education/appt/off) — distinct from solid shift dots */
  .cell .dots i.ev{background:transparent;border:1.3px solid #8A93A6;box-sizing:border-box;width:6px;height:6px}
  .cell .amt{font-weight:700;font-size:10px;color:var(--money);margin-top:1px}
  .cell .note-mark{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--indigo)}
  .cell.has{background:#fff}
  .cell.qf-on{box-shadow:0 0 0 2px var(--indigo) inset;background:var(--indigo-soft)}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
  .legend i{width:8px;height:8px;border-radius:50%}

  /* breakdown */
  .bd-row{margin-bottom:13px}
  .bd-row:last-child{margin-bottom:0}
  .bd-row .lh{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
  .bd-row .lh .nm{font-weight:600;color:var(--muted)}
  .bd-row .lh .nm.g{color:var(--ink)}
  .bd-row .lh .vv{font-weight:600;color:var(--danger)}
  .bd-row .lh .vv.g{font-family:'Bricolage Grotesque';font-weight:700;color:var(--ink)}
  .bar{height:9px;border-radius:5px;background:var(--danger-soft)}
  .bar.gross{height:10px;background:var(--indigo);width:100%}
  .takehome{background:var(--ink);border-radius:16px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;color:#fff}
  .takehome .k{font-size:12.5px;color:#9A9DAB;font-weight:600}
  .takehome .s{font-size:11.5px;color:#7E8290;margin-top:2px}
  .takehome .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;color:var(--mint);letter-spacing:-.02em}
  .disclaimer{font-size:11.5px;line-height:1.5;color:#A8A498;text-align:center;margin-top:14px}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:15px;font-weight:600;font-size:15px;width:100%;transition:transform .06s,box-shadow .12s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--indigo);color:#fff;box-shadow:0 8px 18px rgba(91,79,233,.28)}
  .btn-primary:hover{background:var(--indigo-press)}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
  .btn-ghost:hover{background:#fbfaf7}
  .btn-soft{background:var(--indigo-soft);color:var(--indigo-ink)}
  .btn-sm{padding:10px 16px;border-radius:11px;font-size:13px;width:auto}

  /* fab */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:45;background:var(--indigo);color:#fff;padding:15px 26px;border-radius:16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(91,79,233,.4)}
  .fab:active{transform:translateX(-50%) translateY(1px)}

  /* toggle */
  .tg{width:44px;height:25px;border-radius:13px;background:#D7D5CE;position:relative;flex:0 0 auto;transition:background .15s;cursor:pointer;border:0;padding:0;-webkit-appearance:none;appearance:none;display:block}
  .tg::after{content:'';position:absolute;top:-10px;bottom:-10px;left:0;right:0}
  .tg .knob{position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tg.on{background:var(--indigo)}
  .tg.on .knob{left:21.5px}

  /* inputs */
  .field{display:block;margin-bottom:14px}
  .field .lab{font-size:13px;font-weight:600;margin-bottom:7px;display:block}
  .field .hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}
  .inp{position:relative}
  .inp input,.inp select{width:100%;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:13px;font-size:16px;background:#fff;color:var(--ink);outline:none}
  .inp.pre input{padding-left:30px}
  .inp.suf input{padding-right:38px}
  .inp .pfx{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-weight:600}
  .inp .sfx{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-weight:600}
  .inp input:focus,.inp select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,79,233,.12)}
  .fb-text{width:100%;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:13px;font-size:16px;background:#fff;color:var(--ink);outline:none;font-family:inherit;resize:vertical;min-height:110px;line-height:1.45}
  .fb-text:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,79,233,.12)}

  /* diff rows */
  .drow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .drow.off{opacity:.55}
  .drow .nm{font-weight:600;font-size:14px;flex:1;min-width:0}
  .drow .amt{font-weight:700;font-size:13px;background:#F2F1EC;padding:5px 9px;border-radius:8px;white-space:nowrap}
  .drow .amt input{width:54px;border:none;background:transparent;font:inherit;text-align:right;outline:none}
  .ddash{border:1.5px dashed #D8D5CC;border-radius:13px;padding:12px;text-align:center;font-weight:600;font-size:13px;color:#7A766C;width:100%}

  /* chips */
  .chips-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip-sel{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;text-align:left}
  .chip-sel i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .chip-sel.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .chip-sel.on i{background:#fff!important}
  .hrs{display:flex;gap:8px}
  .hrs .hc{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);background:#fff}
  .hrs .hc.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* tags */
  .tag{display:inline-block;font-weight:600;font-size:10.5px;padding:3px 7px;border-radius:6px;margin-top:5px}
  .tag.est{color:#C2820A;background:#FDF3DD}
  .tag.auto{color:var(--indigo);background:var(--indigo-soft)}

  /* progress */
  .prog{flex:1;height:6px;border-radius:3px;background:#E5E3DC;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--indigo);border-radius:3px;transition:width .3s}
  .back{position:relative;width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:0 0 auto}
  .back::after{content:'';position:absolute;inset:-4px}

  /* onboarding */
  .ob{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:22px 24px calc(24px + env(safe-area-inset-bottom))}
  .ob .eyebrow{font-weight:600;font-size:12.5px;color:var(--indigo);margin-bottom:10px;letter-spacing:.02em}
  .ob .q{font-family:'Bricolage Grotesque';font-weight:700;font-size:25px;line-height:1.18}
  .ob .help{font-size:14px;line-height:1.55;color:var(--muted);margin-top:12px}
  .ob .spacer{flex:1;min-height:18px}
  .ob.dark{background:var(--ink);color:#fff}
  .pill{display:inline-flex;align-self:flex-start;background:var(--indigo-soft);color:var(--indigo);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px}

  /* modal / sheet */
  .scrim{position:fixed;inset:0;background:rgba(18,18,26,.55);z-index:80;display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{margin-top:auto;width:100%;max-width:520px;margin-left:auto;margin-right:auto;background:var(--paper);border-radius:26px 26px 0 0;max-height:92dvh;overflow-y:auto;padding:14px 22px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .grab{width:42px;height:5px;border-radius:3px;background:#D8D5CC;margin:0 auto 16px}
  .modal{margin:auto;width:100%;max-width:560px;background:var(--paper);border-radius:24px;max-height:90dvh;overflow-y:auto;padding:24px;animation:up .24s ease}
  /* toast notifications (replace native alert) */
  .toaster{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none}

<script>
/* Boot watchdog: if the app hasn't rendered within 8s, stop spinning and show what went wrong.
   Plain JS on purpose — must work even when React/Babel/Supabase fail to load. */
(function(){
  window.__bootError = null;
  /* Lightweight client error monitor: production has real-device-only failure modes
     (WebKit auth hangs, CDN failures) that are otherwise invisible. Ring buffer capped
     at 20 entries under a dedicated localStorage key; every access is try/catch-wrapped
     so a full/blocked quota can never break boot. Does not affect watchdog semantics. */
  var ERR_KEY = 'scrubpayErrors', ERR_CAP = 20;
  window.__logClientError = function(msg, src, line, stack){
    try {
      var buf = [];
      try { buf = JSON.parse(localStorage.getItem(ERR_KEY) || '[]'); } catch(_){ buf = []; }
      if(!Array.isArray(buf)) buf = [];
      buf.push({ t: Date.now(), msg: String(msg==null?'':msg).slice(0,500),
        src: String(src==null?'':src).slice(0,300), line: line==null?null:line,
        stack: stack ? String(stack).slice(0,1000) : null });
      if(buf.length > ERR_CAP) buf = buf.slice(buf.length - ERR_CAP);
      localStorage.setItem(ERR_KEY, JSON.stringify(buf));
    } catch(_){ /* quota / disabled storage — never break boot */ }
  };
  window.addEventListener('error', function(e){
    if(!window.__bootError) window.__bootError = e.message || String(e.error||'');
    window.__logClientError(e.message || String(e.error||''), e.filename, e.lineno, e.error && e.error.stack);
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var m = (e.reason && e.reason.message) || String(e.reason||'');
    if(!window.__bootError) window.__bootError = m;
    window.__logClientError('Unhandled promise rejection: ' + m, null, null, e.reason && e.reason.stack);
  });
  setTimeout(function(){
    var root = document.getElementById('root');
    var splash = document.getElementById('splash');
    if(!splash || (root && root.childElementCount > 0)) return;
    var missing = [];
    if(!window.React) missing.push('React');
    if(!window.ReactDOM) missing.push('ReactDOM');
    if(!window.Babel) missing.push('Babel');
    if(!window.supabase) missing.push('Supabase');
    var detail = missing.length ? 'Failed to load: ' + missing.join(', ') + '. Check your connection.' : (window.__bootError || 'Unknown startup error.');
    // Escape the variable part — detail can capture arbitrary error/response text (DOM-XSS sink otherwise).
    var esc = function(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; };
    splash.innerHTML =
      '<div style="max-width:320px;text-align:center;padding:24px;font-family:sans-serif">' +
      '<div style="font-size:40px;margin-bottom:12px">&#9888;&#65039;</div>' +
      '<div style="font-weight:700;font-size:18px;color:#fff;margin-bottom:8px">ScrubPay couldn\'t start</div>' +
      '<div style="font-size:13px;color:#9A9DAB;margin-bottom:20px;word-break:break-word">' + esc(detail) + '</div>' +
      '<button onclick="location.reload()" style="background:#5B4FE9;color:#fff;border:none;border-radius:12px;padding:12px 28px;font-weight:600;font-size:14px">Try again</button>' +
      '<button onclick="window.__copyErrorLog(this)" style="display:block;margin:12px auto 0;background:none;color:#9A9DAB;border:none;font-size:12px;text-decoration:underline">Copy error log</button>' +
      '</div>';
  }, 8000);
  /* Shared by the watchdog screen and the Settings panel — copy the captured error ring
     buffer to the clipboard so a user can paste it into a bug report. */
  window.__copyErrorLog = function(btn){
    var text;
    try { text = localStorage.getItem('scrubpayErrors') || '[]'; } catch(_){ text = '[]'; }
    var done = function(ok){ if(btn){ var o=btn.textContent; btn.textContent = ok?'Copied!':'Copy failed'; setTimeout(function(){ btn.textContent=o; }, 1600); } };
    try {
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){done(true);}, function(){done(false);});
        return;
      }
    } catch(_){}
    try {
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
    } catch(_){ done(false); }
  };
})();
</script>

   Returns null for a non-object; otherwise only keys that passed validation are present, so

function sanitizeData(d){

  const setNum = (key,v)=>{ const n=Number(v); if(isFinite(n)) out[key]=n; };

  if(d.stateTaxRate!=null) setNum('stateTaxRate', d.stateTaxRate);

  if(d.posttaxDeductions!=null) setNum('posttaxDeductions', d.posttaxDeductions);

  if(d.shifts && typeof d.shifts==='object' && !Array.isArray(d.shifts)){
    const s = {};
    Object.entries(d.shifts).forEach(([k,v])=>{
      if(!Array.isArray(v)) return;
      const clean = v.filter(x=> x && typeof x==='object'
          && typeof x.shiftType==='string'
          && isFinite(Number(x.hours)) && Number(x.hours)>0 && Number(x.hours)<=24)
        .map(x=>{
          const o = {...x, hours:Number(x.hours)};
          if(typeof o.start!=='string' || !TIME_RE.test(o.start)) delete o.start;
          return o;
        });
      if(clean.length) s[k] = clean;
    });
    out.shifts = s;
  }
  // dayEvents: date-key -> up to MAX_DAY_EVENTS {id,kind,hours?}; one entry per kind per day.
  if(d.dayEvents && typeof d.dayEvents==='object' && !Array.isArray(d.dayEvents)){
    const de = {};
    Object.entries(d.dayEvents).forEach(([k,v])=>{
      if(!Array.isArray(v)) return;
      const seenKinds = new Set();
      const clean = [];
      v.forEach(x=>{
        if(!x || typeof x!=='object' || typeof x.kind!=='string' || EVENT_KINDS.indexOf(x.kind)<0) return;
        if(seenKinds.has(x.kind)) return;   // dedupe: only one event per kind per day
        seenKinds.add(x.kind);
        const ev = { id:(typeof x.id==='string'||typeof x.id==='number')?x.id:(Date.now()+Math.random()), kind:x.kind };
        if(x.hours!=null){ const n=Number(x.hours); if(isFinite(n) && n>=0 && n<=24) ev.hours = n; }
        clean.push(ev);
      });
      if(clean.length) de[k] = clean.slice(0,MAX_DAY_EVENTS);
    });
    out.dayEvents = de;
  }
  // notes: date-key -> short free-text string, trimmed and capped.

    const nt = {};
    Object.entries(d.notes).forEach(([k,v])=>{

function hourlyRate(base, diff){
  if(!diff) return base;
  if(diff.type==='multiplier') return base * diff.amount;
  if(diff.type==='percent') return base * (1 + diff.amount/100);
  return base + diff.amount;
}
function shiftGross(base, diff, s){
  const perHr = s.bonusType==='custom' ? 0 : (BONUS[s.bonusType]||0);
  const flat  = s.bonusType==='custom' ? (parseFloat(s.customBonus)||0) : 0;
  return hourlyRate(base, diff) * s.hours + perHr*s.hours + flat;
}

/* Returns the ISO updated_at written on success (truthy), or null on failure — callers

async function saveToSupabase(userId, data){
  if(!supabase) return null;
  const updatedAt = new Date().toISOString();
  try{
    const {error} = await supabase
      .from('user_data')
      .upsert({user_id:userId, data, updated_at:updatedAt});
    if(error){ console.error('Save error:',error); return null; }
    return updatedAt;
  }catch(e){
    // rejected fetch (network drop) — never let this leak past the save effect
    console.error('Save threw:',e);
    return null;
  }
}

function track(name, props, userId){
  if(!supabase) return;
  try{
    supabase.from('events').insert({

      props: props || null,

async function loadCloudRow(userId){
  if(!supabase) return null;
  const {data, error} = await supabase
    .from('user_data')
    .select('data, updated_at')
    .eq('user_id',userId)
    .single();
  if(error && error.code!=='PGRST116') console.error('Load error:',error);
  return data?.data ? {data:data.data, updatedAt:data.updated_at||null} : null;
}

/* ---------- feedback sheet ---------- */
function FeedbackSheet({user, onClose}){
  const [msg,setMsg] = useState('');
  const [contact,setContact] = useState((user&&user.email)||'');
  const [sending,setSending] = useState(false);
  const submit = async ()=>{
    const text = msg.trim();
    if(text.length<2){ toast('Please add a little more detail.','error'); return; }
    setSending(true);
    const ok = await submitFeedback({message:text, contact:contact.trim()||null, userId:(user&&user.id)||null});
    setSending(false);
    if(ok){ toast('Thanks! Your feedback was sent. 💜','success'); track('feedback_submitted', null, user&&user.id); onClose(); return; }
    // offline / insert failed — stash locally so it isn't lost; flushed on next load
    try{
      const pend = JSON.parse(localStorage.getItem(FEEDBACK_PENDING_KEY)||'[]');
      pend.push({message:text, contact:contact.trim()||null});
      localStorage.setItem(FEEDBACK_PENDING_KEY, JSON.stringify(pend.slice(-20)));
    }catch(_){}
    toast("Saved on this device — we'll send it when you're back online.",'info');
    onClose();
  };
  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Send feedback">
        <div className="grab"></div>
        <div className="sheet-h"><div className="t">Send feedback</div><button className="back" onClick={onClose} aria-label="Close">{Ic.x}</button></div>
        <p style={{fontSize:13.5,color:'var(--muted)',margin:'0 0 16px',lineHeight:1.5}}>Found a bug, a wrong number, or something confusing? Tell us — it goes straight to the team.</p>
        <label className="sec-lab" htmlFor="fb-msg">WHAT'S ON YOUR MIND?</label>
        <textarea id="fb-msg" className="fb-text" value={msg} onChange={e=>setMsg(e.target.value)} maxLength={4000} rows={5} autoFocus
          placeholder="What's working, what's not, what you wish it did…" />
        <label className="sec-lab" htmlFor="fb-contact" style={{marginTop:14,display:'block'}}>EMAIL (OPTIONAL — IF YOU'D LIKE A REPLY)</label>
        <div className="inp"><input id="fb-contact" type="email" inputMode="email" autoComplete="email" value={contact} onChange={e=>setContact(e.target.value)} placeholder="you@example.com" /></div>
        <button className="btn btn-primary" style={{marginTop:18}} disabled={sending} onClick={submit}>{sending?'Sending…':'Send feedback'}</button>
        <div className="disclaimer" style={{marginTop:12}}>Please don't include passwords or sensitive personal info.</div>
      </div>
    </div>
  );
}

/* ---------- global toast + confirm (module-scoped, avoids prop-drilling) ---------- */
const _ui = { toastFns:new Set(), confirmFn:null };
function toast(msg, kind){ _ui.toastFns.forEach(fn=>fn(msg, kind||'info')); }
function confirmAsync(msg, opts){
  if(_ui.confirmFn) return _ui.confirmFn(msg, opts||{});
  return Promise.resolve(window.confirm(msg));  // fallback if host isn't mounted
}
function Toaster(){
  const [items,setItems] = useState([]);
  useEffect(()=>{
    const add=(msg,kind)=>{
      const id=Date.now()+Math.random();
      setItems(x=>[...x,{id,msg,kind}]);
      setTimeout(()=>setItems(x=>x.filter(i=>i.id!==id)), 3600);
    };
    _ui.toastFns.add(add);
    return ()=>{ _ui.toastFns.delete(add); };
  },[]);
  if(!items.length) return null;
  const icon={success:'✓',error:'⚠️',info:'•'};
  return (
    <div className="toaster" role="status" aria-live="polite">
      {items.map(t=>(
        <div key={t.id} className={'toast '+(t.kind||'info')} onClick={()=>setItems(x=>x.filter(i=>i.id!==t.id))}>
          <span className="ic" aria-hidden="true">{icon[t.kind]||'•'}</span><span>{t.msg}</span>
        </div>
      ))}
    </div>
  );
}
function ConfirmHost(){
  const [st,setSt] = useState(null); // {msg, opts, resolve}
  useEffect(()=>{
    _ui.confirmFn=(msg,opts)=>new Promise(res=>setSt({msg,opts:opts||{},resolve:res}));
    return ()=>{ _ui.confirmFn=null; };
  },[]);
  if(!st) return null;
  const done=(v)=>{ st.resolve(v); setSt(null); };
  const o=st.opts;
  return (
    <div className="scrim" style={{zIndex:210}} onClick={()=>done(false)}>
      <div className="cdlg" onClick={e=>e.stopPropagation()} role="alertdialog" aria-modal="true">
        <div className="ct">{o.title||'Are you sure?'}</div>
        <div className="cm">{st.msg}</div>
        <div className="crow">
          <button className="btn btn-ghost" onClick={()=>done(false)}>{o.cancel||'Cancel'}</button>
          <button className={'btn '+(o.danger?'btn-danger':'btn-primary')} onClick={()=>done(true)} autoFocus>{o.confirm||'Confirm'}</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- error boundary ---------- */
class ErrorBoundary extends React.Component {
  constructor(props){
    super(props);
    this.state = {hasError:false, error:null};
  }
  static getDerivedStateFromError(error){
    return {hasError:true, error};
  }
  componentDidCatch(error, errorInfo){
    console.error('ErrorBoundary caught:', error, errorInfo);
  }
  render(){
    if(this.state.hasError){
      return (
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100dvh',padding:'24px',background:'var(--bg)'}}>
          <div style={{maxWidth:'440px',background:'var(--paper)',borderRadius:'20px',padding:'28px',textAlign:'center'}}>
            <div style={{fontSize:'48px',marginBottom:'16px'}}>⚠️</div>
            <div style={{fontFamily:'Bricolage Grotesque',fontWeight:'700',fontSize:'22px',color:'var(--ink)',marginBottom:'12px'}}>Something went wrong</div>
            <div style={{fontSize:'14px',color:'var(--muted)',marginBottom:'24px',lineHeight:'1.5'}}>
              The app encountered an error. Try refreshing the page.
            </div>
            <button onClick={()=>window.location.reload()} style={{background:'var(--indigo)',color:'#fff',border:'none',borderRadius:'12px',padding:'12px 24px',fontWeight:'600',fontSize:'14px',cursor:'pointer'}}>
              Reload App
            </button>
            {this.state.error && (
              <div style={{marginTop:'20px',padding:'12px',background:'#FFF4F2',borderRadius:'10px',fontSize:'12px',color:'#C73A26',textAlign:'left',fontFamily:'monospace',overflow:'auto'}}>
                {this.state.error.toString()}
              </div>
            )}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================================================= */
function App(){
  const [ready,setReady] = useState(false);
  const [setupComplete,setSetupComplete] = useState(false);
  const [obStep,setObStep] = useState(0); // 0 welcome..4 done

  const [name,setName] = useState('there');
  const [baseRate,setBaseRate] = useState(65.15);
  const [federalTaxRate,setFederal] = useState(12);
  const [stateTaxRate,setState] = useState(2.5);
  const [pretaxDeductions,setPretax] = useState(0);
  const [posttaxDeductions,setPosttax] = useState(0);
  const [ficaType,setFicaType] = useState('standard');
  const [ficaPct,setFicaPct] = useState(7.65);
  const [payPeriodStart,setPPS] = useState(todayISO());
  const [shifts,setShifts] = useState({});
  const [customWithholdings,setCW] = useState([]);
  const [differentials,setDiff] = useState(DIFF_DEFAULTS);
  const [templates,setTemplates] = useState([]);   // saved shift presets for quick logging
  const [dayEvents,setDayEvents] = useState({});   // 'YYYY-MM-DD' -> [{id,kind,hours?}] (PTO/education/appt/off)
  const [notes,setNotes] = useState({});           // 'YYYY-MM-DD' -> short free-text note

  const [sheetDate,setSheetDate] = useState(null);   // add-shift sheet open for date
  const [showSettings,setShowSettings] = useState(false);
  const [showBreakdown,setShowBreakdown] = useState(false);
  const [showAuth,setShowAuth] = useState(false);  // auth modal
  const [authMode,setAuthMode] = useState('signin'); // 'signin' or 'signup'
  const [user,setUser] = useState(null);  // current user
  const [session,setSession] = useState(null);  // auth session
  const [syncing,setSyncing] = useState(false);  // cloud sync in progress
  const [syncError,setSyncError] = useState(false);  // last cloud save failed
  const [paystub,setPaystub] = useState(null);
  const [parsing,setParsing] = useState(false);
  const [showFeedback,setShowFeedback] = useState(false);
  const [calView,setCalView] = useState('period');   // 'period' | 'week' | 'month' | 'year'
  const [calFocus,setCalFocus] = useState(payPeriodStart); // reference date for week/month/year browsing
  const [qfMode,setQfMode] = useState(false);        // quick-fill: picking/applying a template across days
  const [qfTemplate,setQfTemplate] = useState(null); // the template being applied while qfMode is on
  const qfTouched = useRef(new Set());               // day-keys toggled this quick-fill session (for analytics)

  const fileImport = useRef(null);
  const hydratedForUser = useRef(null);   // user.id whose cloud data is loaded & safe to overwrite
  const loadingRef = useRef(null);        // user.id currently being loaded (in-flight guard)
  const prevUserId = useRef(null);         // last seen auth user id (detects real user changes)
  const snapshotRef = useRef(null);        // latest {user,data} for the pagehide flush
  const oversizeWarned = useRef(false);    // warn once if the blob outgrows the free-tier budget
  const lastSeenAt = useRef(null);         // updated_at of the cloud blob we last wrote/loaded (sync guard)
  const BACKUP_KEY = uid => STORE_KEY + '::' + uid;  // per-user local mirror (never the shared anon key)

  /* ---- single serializer (used by save effect, export, and flush) ---- */
  const serializeState = ()=>({
    name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,
    ficaWithholdingType:ficaType,ficaWithholdingPercent:ficaPct,
    payPeriodStart,shifts,customWithholdings,differentials,templates,dayEvents,notes,setupComplete
  });

  /* ---- single hydrator (used by every load path: cloud init, auth change, localStorage, import) ---- */
  /* opts.landCurrent: snap the pay period to the one containing today (phase-preserved) —
       used on initial/sign-in loads so landing always shows the current paycheck.
     opts.keepPeriod: leave the currently-displayed pay period untouched — used by the
       focus-refetch sync so pulling remote edits doesn't yank the user's view. */
  const applyData = (raw, opts={})=>{
    const d = sanitizeData(raw);
    if(!d) return;
    if(d.name) setName(d.name);
    if(d.baseRate!=null) setBaseRate(d.baseRate);
    if(d.federalTaxRate!=null) setFederal(d.federalTaxRate);
    if(d.stateTaxRate!=null) setState(d.stateTaxRate);
    if(d.pretaxDeductions!=null) setPretax(d.pretaxDeductions);
    if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);
    if(d.ficaWithholdingType) setFicaType(d.ficaWithholdingType);
    if(d.ficaWithholdingPercent!=null) setFicaPct(d.ficaWithholdingPercent);
    if(!opts.keepPeriod){
      if(opts.landCurrent) setPPS(currentPeriodStart(d.payPeriodStart||todayISO()));
      else if(d.payPeriodStart) setPPS(d.payPeriodStart);
    }
    if(d.shifts) setShifts(d.shifts);
    if(d.customWithholdings) setCW(d.customWithholdings);
    if(d.differentials){
      const m={...DIFF_DEFAULTS};
      Object.entries(d.differentials).forEach(([k,v])=>{ if(v&&typeof v==='object'&&!Array.isArray(v)) m[k]={...(DIFF_DEFAULTS[k]||{color:'#8A93A6',type:'dollar'}),...v}; });
      setDiff(m);
    }
    if(d.templates) setTemplates(d.templates);
    if(d.dayEvents) setDayEvents(d.dayEvents);
    if(d.notes) setNotes(d.notes);
    setSetupComplete(d.setupComplete!==false);
  };

  /* ---- reset every field back to first-run defaults (sign-out) ---- */
  const resetToDefaults = ()=>{
    setName('there'); setBaseRate(65.15); setFederal(12); setState(2.5);
    setPretax(0); setPosttax(0); setFicaType('standard'); setFicaPct(7.65);
    setPPS(todayISO()); setShifts({}); setCW([]); setDiff(DIFF_DEFAULTS); setTemplates([]);
    setDayEvents({}); setNotes({}); setSetupComplete(false);
  };

  /* ---- load a user's cloud blob, then mark saves safe for that user ---- */
  const hydrateFromCloud = async (userId, timeoutMs)=>{
    if(loadingRef.current===userId || hydratedForUser.current===userId) return true; // no double-load
    loadingRef.current = userId;
    try{
      const row = await withTimeout(loadCloudRow(userId), timeoutMs||6000, 'cloud load');
      if(row && row.data){ applyData(row.data,{landCurrent:true}); lastSeenAt.current = row.updatedAt; }
      else{
        // genuinely no cloud row yet — recover any local backup we mirrored for this user
        try{ const b = localStorage.getItem(BACKUP_KEY(userId)); if(b) applyData(JSON.parse(b),{landCurrent:true}); }catch(_){}
      }
      hydratedForUser.current = userId;  // ONLY now are cloud saves for this user safe
      setSyncError(false);
      return true;
    }catch(e){
      // timeout / error: leave hydratedForUser unset so we never clobber cloud with stale/default state
      console.error('Cloud load error:',e);
      return false;
    }finally{
      loadingRef.current = null;
    }
  };

  /* check auth session */
  useEffect(()=>{
    const init = async ()=>{
      try{
        if(!supabase) throw new Error('Supabase unavailable — offline mode');
        const {data:{session}} = await withTimeout(supabase.auth.getSession(), 4000, 'auth check');
        setSession(session);
        setUser(session?.user ?? null);
        if(session?.user){
          prevUserId.current = session.user.id;
          await hydrateFromCloud(session.user.id, 6000);
        }
      }catch(e){console.error('Auth session error:',e);}
      setReady(true);
      const sp = document.getElementById('splash');
      if(sp){ sp.style.opacity='0'; setTimeout(()=>sp.remove(),400); }
    };
    init();

    if(!supabase) return;
    // Keep this callback SYNCHRONOUS — supabase-js holds the auth lock here, and awaiting
    // another client call inside it can deadlock token refresh. Defer any load with setTimeout(0).
    const {data:{subscription}} = supabase.auth.onAuthStateChange((event,session)=>{
      setSession(session);
      const nextUser = session?.user ?? null;
      setUser(nextUser);
      const nextId = nextUser?.id ?? null;
      const prevId = prevUserId.current;
      if(nextId === prevId) return;   // TOKEN_REFRESHED / USER_UPDATED / repeats — no reload, no clobber
      prevUserId.current = nextId;
      if(nextId){
        if(event==='SIGNED_IN') track('signed_in', null, nextId);
        if(hydratedForUser.current === nextId) return;  // init already loaded this user
        hydratedForUser.current = null;                 // block cloud saves until loaded
        setTimeout(()=>hydrateFromCloud(nextId, 6000), 0);
      }else{
        // Signed out: wipe in-memory state so the debounced save can't leak this user's
        // wage data into the shared anonymous localStorage key, then restore pre-login anon data.
        hydratedForUser.current = null;
        setSyncError(false);
        resetToDefaults();
        lastSeenAt.current = null;
        setTimeout(()=>{ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) applyData(JSON.parse(raw),{landCurrent:true}); }catch(_){} }, 0);
      }
    });
    return ()=> subscription.unsubscribe();
  },[]);

  /* load anonymous localStorage data at mount (cloud load, if any, overwrites it) */
  useEffect(()=>{
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) applyData(JSON.parse(raw),{landCurrent:true});
    }catch(e){ console.error('load',e); }
  },[]);

  /* save (debounced) */
  useEffect(()=>{
    if(!ready) return;
    const dataToSave = serializeState();
    snapshotRef.current = {user, data:dataToSave};  // keep the flush handler current
    const id = setTimeout(async ()=>{
      if(user){
        // F2: never write until this exact user's cloud blob has hydrated, or we'd overwrite it with stale/default state
        if(hydratedForUser.current !== user.id) return;
        // Free-tier guard: a single pathological blob shouldn't balloon the DB. Well above any
        // realistic pay history (~a few KB), so this only ever trips on corruption/abuse.
        if(JSON.stringify(dataToSave).length > MAX_BLOB_BYTES){
          if(!oversizeWarned.current){ oversizeWarned.current = true; toast('Your data got unusually large — cloud sync paused. Try clearing old shifts.','error'); }
          try{ localStorage.setItem(BACKUP_KEY(user.id), JSON.stringify(dataToSave)); }catch(_){}
          setSyncError(true);
          return;
        }
        setSyncing(true);
        let ts=null;
        try{ ts = await saveToSupabase(user.id, dataToSave); }
        finally{ setSyncing(false); }
        setSyncError(!ts);
        if(ts){ lastSeenAt.current = ts; }   // remember our own write so the focus-refetch ignores it
        else{
          // network drop: mirror to a PER-USER key (not the shared anon STORE_KEY) so nothing is lost and nothing leaks
          try{ localStorage.setItem(BACKUP_KEY(user.id), JSON.stringify(dataToSave)); }catch(_){}
        }
      }else{
        try{
          localStorage.setItem(STORE_KEY, JSON.stringify(dataToSave));
        }catch(e){ if(e.name==='QuotaExceededError') toast('Storage full — export your data.','error'); }
      }
    },500);
    return ()=>clearTimeout(id);
  },[ready,user,name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,ficaType,ficaPct,payPeriodStart,shifts,customWithholdings,differentials,templates,dayEvents,notes,setupComplete]);

  /* flush the latest snapshot on backgrounding / tab close (500ms debounce would otherwise drop it) */
  useEffect(()=>{
    const flush = ()=>{
      const snap = snapshotRef.current;
      if(!snap) return;
      if(snap.user){
        // best-effort immediate cloud save; never mirror a signed-in user's data into the shared anon key
        if(hydratedForUser.current === snap.user.id){ try{ saveToSupabase(snap.user.id, snap.data).then(ts=>{ if(ts) lastSeenAt.current=ts; }); }catch(_){} }
      }else{
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(snap.data)); }catch(_){}
      }
    };
    const onVis = ()=>{ if(document.visibilityState==='hidden') flush(); };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', onVis);
    return ()=>{ window.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', onVis); };
  },[]);

  /* manual retry when a cloud save failed */
  const retrySync = async ()=>{
    if(!user || hydratedForUser.current!==user.id) return;
    setSyncing(true);
    let ts=null;
    try{ ts = await saveToSupabase(user.id, serializeState()); }
    finally{ setSyncing(false); }
    setSyncError(!ts);
    if(ts){ lastSeenAt.current = ts; }
  };

  /* WebKit-safe sign-out. supabase-js signOut() calls getSession() + a /logout network
     request and only clears the local session AFTER they resolve — both deadlock on iOS
     WebKit (same bug the getSession 4s-race guards). So we race it against a timeout and,
     no matter what, purge the persisted auth token ourselves so we always end up signed out. */
  const clearAuthStorage = ()=>{ try{ Object.keys(localStorage).filter(k=>k.indexOf('sb-')===0 && k.indexOf('auth-token')>=0).forEach(k=>localStorage.removeItem(k)); }catch(_){} };
  const signOutClient = async ()=>{
    try{ if(supabase) await withTimeout(supabase.auth.signOut({scope:'local'}), 3000, 'sign out'); }
    catch(e){ console.error('Sign out:', e); }
    clearAuthStorage();
  };
  const handleSignOut = async ()=>{
    if(!(await confirmAsync('You can sign back in anytime.',{title:'Sign out?',confirm:'Sign out'}))) return;
    await signOutClient();
    // Force signed-out state locally — never rely on onAuthStateChange, which won't fire if
    // signOut stalled. Mirrors the SIGNED_OUT branch (safe/idempotent if that also fires).
    hydratedForUser.current = null; lastSeenAt.current = null; prevUserId.current = null;
    setSyncError(false);
    setSession(null); setUser(null);
    resetToDefaults();
    setTimeout(()=>{ try{ const raw=localStorage.getItem(STORE_KEY); if(raw) applyData(JSON.parse(raw),{landCurrent:true}); }catch(_){} }, 0);
  };

  /* Cross-device sync: while the tab is visible, poll the cloud blob (every 15s) and also
     refetch on focus/visibility. If another device wrote a NEWER blob, apply it. Guarded by
     updated_at AND content-equality so we never echo our own write, re-save identical data
     (which would ping-pong between devices), or clobber unsaved local edits; keepPeriod
     leaves the user's current pay-period view alone.
     NOTE: this is poll-based near-realtime, not push. A Supabase Realtime subscription would
     make it instant — a possible future upgrade. */
  useEffect(()=>{
    if(!supabase || !user) return;
    let busy=false, stopped=false;
    const normalize = o => { try{ return JSON.stringify({...o, payPeriodStart:0}); }catch(_){ return ''; } };
    const refetch = async ()=>{
      if(busy || stopped || document.visibilityState==='hidden') return;
      if(hydratedForUser.current !== user.id) return;   // only after this user has safely hydrated
      busy=true;
      try{
        const row = await withTimeout(loadCloudRow(user.id), 6000, 'sync refetch');
        if(row && row.data && row.updatedAt && (!lastSeenAt.current || row.updatedAt > lastSeenAt.current)){
          // only apply if the remote content actually differs from what we already show
          // (ignoring the local view period) — otherwise just record that we've seen it.
          if(normalize(row.data) !== normalize(serializeState())){
            applyData(row.data,{keepPeriod:true});
          }
          lastSeenAt.current = row.updatedAt;
        }
      }catch(_){ /* offline / timeout — leave state as-is */ }
      finally{ busy=false; }
    };
    const onFocus = ()=>refetch();
    const onVis = ()=>{ if(document.visibilityState==='visible') refetch(); };
    window.addEventListener('focus', onFocus);
    document.addEventListener('visibilitychange', onVis);
    const id = setInterval(refetch, 15000);
    return ()=>{ stopped=true; clearInterval(id); window.removeEventListener('focus', onFocus); document.removeEventListener('visibilitychange', onVis); };
  },[user]);

  /* lock scroll behind overlays */
  useEffect(()=>{
    const open = sheetDate||showSettings||showBreakdown||paystub||showAuth||showFeedback;
    document.body.style.overflow = open ? 'hidden':'';
    return ()=>{ document.body.style.overflow=''; };
  },[sheetDate,showSettings,showBreakdown,paystub,showAuth,showFeedback]);

  /* Flush any feedback that was saved locally while offline. */
  useEffect(()=>{
    if(!supabase) return;
    let pend; try{ pend=JSON.parse(localStorage.getItem(FEEDBACK_PENDING_KEY)||'[]'); }catch(_){ pend=[]; }
    if(!Array.isArray(pend)||!pend.length) return;
    (async()=>{
      const remaining=[];
      for(const f of pend){
        const ok = await submitFeedback({message:f.message, contact:f.contact, userId:(user&&user.id)||null});
        if(!ok) remaining.push(f);
      }
      try{ localStorage.setItem(FEEDBACK_PENDING_KEY, JSON.stringify(remaining)); }catch(_){}
    })();
  },[user]);

  /* ---- period days ---- */
  const days = useMemo(()=>{
    const [y,m,d] = payPeriodStart.split('-').map(Number);
    return Array.from({length:14},(_,i)=> new Date(y,m-1,d+i));
  },[payPeriodStart]);
  const keyOf = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const addDaysISO = (s,n)=>{ const d=parseISO(s); return keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)); };
  /* the pay period (phase-aligned to `anchor`) that contains today — keeps the user's
     real 14-day cycle but always lands on the current paycheck. */
  const currentPeriodStart = (anchorISO)=>{
    const anchor = parseISO(anchorISO||todayISO());
    const today = new Date(); today.setHours(0,0,0,0);
    const k = Math.floor(Math.round((today - anchor)/86400000)/14);
    return keyOf(new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()+k*14));
  };
  const periodLabel = useMemo(()=>{
    const a=days[0], b=days[13];
    const o={month:'short',day:'numeric'};
    return `${a.toLocaleDateString('en-US',o)} – ${b.toLocaleDateString('en-US',o)}, ${b.getFullYear()}`;
  },[days]);

  /* PTO gross/hours for a date: hours × baseRate, taxed normally, no differentials/bonuses. */
  const ptoStatOf = (k)=>{
    const evs = dayEvents[k]||[];
    let g=0,h=0;
    evs.forEach(e=>{ if(e.kind==='pto' && e.hours>0){ g+=e.hours*baseRate; h+=e.hours; } });
    return {g,h};
  };

  /* per-day {gross,hours,count} for any date — powers every calendar view */
  const statOf = (k)=>{
    const arr = shifts[k]||[];
    let g=0,h=0; arr.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
    const pto = ptoStatOf(k);
    g += pto.g; h += pto.h;
    return {g,h,n:arr.length};
  };

  /* days shown in the current calendar view */
  const viewDays = useMemo(()=>{
    if(calView==='week'){
      // weeks align to pay-period halves: a pay period is exactly two weeks
      const anchor = parseISO(payPeriodStart), focus = parseISO(calFocus);
      const diff = Math.round((focus - anchor)/86400000);
      const wi = Math.floor(diff/7);
      const s = new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()+wi*7);
      return Array.from({length:7},(_,i)=>new Date(s.getFullYear(),s.getMonth(),s.getDate()+i));
    }
    if(calView==='month'){
      const f=parseISO(calFocus), y=f.getFullYear(), m=f.getMonth(), n=new Date(y,m+1,0).getDate();
      return Array.from({length:n},(_,i)=>new Date(y,m,i+1));
    }
    return days; // period
  },[calView,calFocus,payPeriodStart,days]);

  const viewTitle = useMemo(()=>{
    if(calView==='week'){
      const a=viewDays[0], b=viewDays[6];
      const same=a.getMonth()===b.getMonth();
      return same
        ? `${a.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${b.getDate()}, ${b.getFullYear()}`
        : `${a.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${b.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${b.getFullYear()}`;
    }
    if(calView==='month') return parseISO(calFocus).toLocaleDateString('en-US',{month:'long',year:'numeric'});
    if(calView==='year')  return String(parseISO(calFocus).getFullYear());
    return periodLabel;
  },[calView,calFocus,viewDays,periodLabel]);

  const navCal = (dir)=>{
    if(calView==='week') setCalFocus(addDaysISO(calFocus, dir*7));
    else if(calView==='month'){ const f=parseISO(calFocus); setCalFocus(keyOf(new Date(f.getFullYear(),f.getMonth()+dir,1))); }
    else if(calView==='year'){ const f=parseISO(calFocus); setCalFocus(keyOf(new Date(f.getFullYear()+dir,f.getMonth(),1))); }
  };

  /* year view: 12-month totals from all shifts in the focused year */
  const yearMonths = useMemo(()=>{
    if(calView!=='year') return [];
    const y = parseISO(calFocus).getFullYear();
    return Array.from({length:12},(_,m)=>{
      const prefix = `${y}-${String(m+1).padStart(2,'0')}-`;
      let g=0,h=0,n=0;
      Object.keys(shifts).forEach(k=>{ if(k.indexOf(prefix)===0){ (shifts[k]||[]).forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; n++; }); } });
      return {m,g,h,n};
    });
  },[calView,calFocus,shifts,baseRate,differentials]);

  /* ---- calculations ---- */
  const calc = useMemo(()=>{
    let gross=0, hours=0;
    // Scope to the active pay period — a pay period is one paycheck, so taxes on this
    // gross give a proper per-paycheck take-home estimate (and the hero matches its label).
    const periodKeys = new Set(days.map(keyOf));
    Object.keys(shifts).forEach(k=>{
      if(!periodKeys.has(k)) return;
      (shifts[k]||[]).forEach(s=>{
        gross += shiftGross(baseRate, differentials[s.shiftType], s);
        hours += s.hours;
      });
    });
    // PTO: hours × baseRate adds to gross like worked time (taxed normally), but skips
    // differentials/bonuses entirely — scoped to the active pay period same as shifts.
    Object.keys(dayEvents).forEach(k=>{
      if(!periodKeys.has(k)) return;
      (dayEvents[k]||[]).forEach(e=>{
        if(e.kind==='pto' && e.hours>0){ gross += e.hours*baseRate; hours += e.hours; }
      });
    });
    // FICA (Social Security/Medicare) is levied on gross wages; pre-tax 401k/403b
    // deferrals only reduce income-tax wages. Keep the two bases separate.
    const ficaBase = gross;
    const incomeTaxBase = Math.max(0, gross - pretaxDeductions);
    let fica = 0;
    if(ficaType==='standard') fica = ficaBase*0.0765;
    else if(ficaType==='percent') fica = ficaBase*((parseFloat(ficaPct)||0)/100);
    const fed = incomeTaxBase*(federalTaxRate/100);
    const st  = incomeTaxBase*(stateTaxRate/100);
    let cw = 0;
    customWithholdings.forEach(w=>{ cw += w.type==='percent' ? incomeTaxBase*((parseFloat(w.amount)||0)/100) : (parseFloat(w.amount)||0); });
    const ded = pretaxDeductions+fica+fed+st+posttaxDeductions+cw;
    const net = Math.max(0, gross-ded);
    // Cap displayed flat pre/post at what gross can absorb so Breakdown rows still sum.
    const flatCapTotal = Math.max(0, gross - (fica+fed+st+cw));
    const dispPre  = Math.min(pretaxDeductions, flatCapTotal);
    const dispPost = Math.min(posttaxDeductions, Math.max(0, flatCapTotal - dispPre));
    return {gross,hours,fica,fed,st,cw,ded,net,pre:dispPre,post:dispPost,
      pct: gross>0 ? Math.round(net/gross*100) : 0};
  },[shifts,dayEvents,days,baseRate,differentials,pretaxDeductions,posttaxDeductions,ficaType,ficaPct,federalTaxRate,stateTaxRate,customWithholdings]);

  const shiftCount = useMemo(()=> Object.values(shifts).reduce((a,arr)=>a+(arr?arr.length:0),0),[shifts]);
  const periodShiftCount = useMemo(()=>{
    const periodKeys = new Set(days.map(keyOf));
    return Object.keys(shifts).reduce((a,k)=> a + (periodKeys.has(k) ? (shifts[k]?.length||0) : 0), 0);
  },[shifts,days]);

  /* effective per-shift take-home ratio (for live previews) */
  const ficaForPreview = ficaType==='standard'?7.65:(ficaType==='percent'?(parseFloat(ficaPct)||0):0);
  const keepRatio = Math.max(0, 1 - (federalTaxRate+stateTaxRate+ficaForPreview)/100);

  /* ---- handlers ---- */
  const num = (v,fb=0)=>{ const n=parseFloat(v); return isNaN(n)?fb:n; };
  const movePeriod = (dir)=>{ const [y,m,d]=payPeriodStart.split('-').map(Number); const nd=new Date(y,m-1,d+dir*14); setPPS(keyOf(nd)); };

  // Shifts, day events, and a day note are all committed together from the AddShiftSheet's
  // single save/dismiss flow — one write point, all covered by the same debounced cloud save.
  const saveDayShifts = (dateKey, arr, events, note)=>{
    setShifts(prev=>{ const n={...prev}; if(arr.length) n[dateKey]=arr; else delete n[dateKey]; return n; });
    if(arr.length) track('shift_saved', {n:arr.length}, user?.id);
    setDayEvents(prev=>{
      const before = prev[dateKey]||[];
      const after = events||[];
      const beforeKinds = new Set(before.map(e=>e.kind));
      const afterKinds = new Set(after.map(e=>e.kind));
      afterKinds.forEach(k=>{ if(!beforeKinds.has(k)) track('day_event_added', {kind:k}, user?.id); });
      beforeKinds.forEach(k=>{ if(!afterKinds.has(k)) track('day_event_removed', {kind:k}, user?.id); });
      const n={...prev}; if(after.length) n[dateKey]=after; else delete n[dateKey]; return n;
    });
    setNotes(prev=>{
      const before = prev[dateKey]||'';
      const trimmed = (note||'').trim().slice(0,MAX_NOTE_LEN);
      if(trimmed && trimmed!==before) track('note_saved', null, user?.id);
      const n={...prev}; if(trimmed) n[dateKey]=trimmed; else delete n[dateKey]; return n;
    });
  };

  // Open the add-shift sheet for a day. Quick-fill mode and the sheet are mutually exclusive —
  // any entry point that can fire while quick-filling must exit qfMode first, or the two
  // overlays fight over the same taps.
  const openSheet = (k)=>{ if(qfMode){ setQfMode(false); setQfTemplate(null); } setSheetDate(k); };

  /* ---- shift templates: save / delete / quick-fill across days ---- */
  const saveTemplate = (tpl)=>{
    // Cap check runs against the current render's `templates` closure (synchronous), not inside
    // the setState updater — functional updaters run during React's commit, which happens after
    // this call returns, so a variable set inside one can't be read reliably right after calling it.
    const isOverwrite = templates.some(t=>t.name.toLowerCase()===tpl.name.toLowerCase());
    if(!isOverwrite && templates.length>=MAX_TEMPLATES){
      toast(`You can save up to ${MAX_TEMPLATES} templates — delete one to add another.`,'error');
      return false;
    }
    setTemplates(prev=>{
      const idx = prev.findIndex(t=>t.name.toLowerCase()===tpl.name.toLowerCase());
      if(idx>=0){ const next=[...prev]; next[idx]={...prev[idx], ...tpl, id:prev[idx].id}; return next; }
      if(prev.length>=MAX_TEMPLATES) return prev; // safety guard; the cap check above should already prevent this
      return [...prev, {...tpl, id: Date.now()+Math.random()}];
    });
    track('template_saved', null, user?.id);
    return true;
  };
  const deleteTemplate = async (tpl)=>{
    if(!(await confirmAsync(`Delete the "${tpl.name}" template? Shifts you've already logged won't change.`,{title:'Delete template?',confirm:'Delete',danger:true}))) return;
    setTemplates(prev=>prev.filter(t=>t.id!==tpl.id));
  };
  const startQuickFill = ()=>{ if(!templates.length) return; qfTouched.current = new Set(); setQfTemplate(null); setQfMode(true); };
  const endQuickFill = ()=>{
    const n = qfTouched.current.size;
    if(n>0) track('template_applied', {days:n}, user?.id);
    setQfMode(false); setQfTemplate(null);
  };
  const toggleQuickFillDay = (k)=>{
    if(!qfTemplate) return;
    setShifts(prev=>{
      const arr = prev[k]||[];
      const idx = arr.findIndex(s=>s.templateId===qfTemplate.id);
      const next = idx>=0
        ? arr.filter((_,i)=>i!==idx)
        : [...arr, {id:Date.now()+Math.random(), shiftType:qfTemplate.shiftType, hours:qfTemplate.hours, bonusType:qfTemplate.bonusType, customBonus:qfTemplate.customBonus, templateId:qfTemplate.id, ...(qfTemplate.start?{start:qfTemplate.start}:{})}];
      const n2={...prev}; if(next.length) n2[k]=next; else delete n2[k]; return n2;
    });
    qfTouched.current.add(k);
  };

  /* analytics: one event per app load */
  useEffect(()=>{ track('app_open', null, null); },[]);

  const exportData = ()=>{
    const blob = new Blob([JSON.stringify({...serializeState(),exportDate:new Date().toISOString()},null,2)],{type:'application/json'});
    const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=`scrubpay-${todayISO()}.json`; a.click(); URL.revokeObjectURL(u);
  };
  const importData = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{ try{
      const d=JSON.parse(ev.target.result);
      if(typeof d!=='object'||!d) throw 0;
      applyData(d);
      setSetupComplete(true);
      toast('Data imported.','success');
    }catch(err){ toast('Could not read that file.','error'); } };
    r.readAsText(f); e.target.value='';
  };
  const clearAll = async ()=>{
    const signedIn = !!user;
    const msg = signedIn
      ? 'This erases everything here and your cloud copy. It cannot be undone.'
      : 'This erases everything on this device. It cannot be undone.';
    if(!(await confirmAsync(msg,{title:'Clear all data?',confirm:'Clear everything',danger:true}))) return;
    try{
      if(signedIn && supabase){
        const uid = user.id;
        try{ await withTimeout(supabase.from('user_data').delete().eq('user_id',uid), 5000, 'clear'); }
        catch(e){ console.error('Cloud clear error:',e); }
        await signOutClient();   // WebKit-safe: won't hang before the reload below
        try{ localStorage.removeItem(BACKUP_KEY(uid)); }catch(_){}
      }
    }finally{
      try{ localStorage.removeItem(STORE_KEY); }catch(_){}
      location.reload();
    }
  };

  /* ---- paystub PDF ---- */
  const parsePDF = async (file)=>{
    const buf = await file.arrayBuffer();
    // Worker is hosted same-origin (deployed next to index.html) — no third-party CDN in the
    // paystub path. isEvalSupported:false is the documented CVE-2024-4367 hardening.
    pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text += c.items.map(x=>x.str).join(' ')+'\n'; }
    const ex={};
    let m;
    if((m=text.match(/Pay Begin Date:\s*(\d{2}\/\d{2}\/\d{4})/))){ const[mm,dd,yy]=m[1].split('/'); ex.payPeriodStart=`${yy}-${mm}-${dd}`; }
    if((m=text.match(/Pay Rate:\s*\$?([\d,]+\.?\d*)\s*Hourly/))) ex.baseRate=parseFloat(m[1].replace(/,/g,''));
    if((m=text.match(/403\(b\)[^\d]+([\d,]+\.?\d*)/))) ex.pretaxDeductions=parseFloat(m[1].replace(/,/g,''));
    const med=text.match(/Fed MED\/EE[^\d]+([\d,]+\.?\d*)/), oas=text.match(/Fed OASDI\/EE[^\d]+([\d,]+\.?\d*)/);
    if(med&&oas) ex.ficaWithholding=parseFloat(med[1].replace(/,/g,''))+parseFloat(oas[1].replace(/,/g,''));
    let stt=0; const pa=text.match(/PA W\/H[^\d]+([\d,]+\.?\d*)/), ph=text.match(/PA PHILADELPHIA W\/H[^\d]+([\d,]+\.?\d*)/), ls=text.match(/PA LS Tax[^\d]+([\d,]+\.?\d*)/);
    if(pa)stt+=parseFloat(pa[1].replace(/,/g,'')); if(ph)stt+=parseFloat(ph[1].replace(/,/g,'')); if(ls)stt+=parseFloat(ls[1].replace(/,/g,''));
    if(stt>0) ex.stateTax=stt;
    const g=text.match(/TOTAL GROSS[^\d]+([\d,]+\.?\d*)/); if(g) ex.grossPay=parseFloat(g[1].replace(/,/g,''));
    if(ex.ficaWithholding&&ex.grossPay) ex.ficaRate=ex.ficaWithholding/ex.grossPay*100;
    if(ex.stateTax&&ex.grossPay){ const stBase=ex.grossPay-(ex.pretaxDeductions||0); if(stBase>0) ex.stateTaxRate=ex.stateTax/stBase*100; }
    ex.shifts=[]; const sec=text.match(/HOURS AND EARNINGS([\s\S]*?)TAXES/);
    if(sec){ const rx=/(?:PD |Incentive - )([\w\s-]+?)\s+([\d.]+)\s+([\d.]+)\s+([\d,.]+)(?:\s+[\d.]+\s+[\d,.]+)?/g; let mm2; const seen=new Set();
      while((mm2=rx.exec(sec[1]))!==null){ const desc=mm2[1].trim(); const hrs=parseFloat(mm2[3]); const k=desc.toLowerCase();
        if(hrs>0&&hrs<200&&!seen.has(k)){ seen.add(k); ex.shifts.push({description:desc,rate:parseFloat(mm2[2]),hours:hrs,earnings:parseFloat(mm2[4].replace(/,/g,''))}); } } }
    return ex;
  };
  const onPaystub = async (e)=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>10*1024*1024){ toast('File too large (max 10MB).','error'); e.target.value=''; return; }
    if(f.type!=='application/pdf'){ toast('Please upload a PDF.','error'); e.target.value=''; return; }
    setParsing(true);
    try{ const p=await parsePDF(f); setPaystub(p); }
    catch(err){ toast('Could not parse that paystub.','error'); console.error(err); }
    finally{ setParsing(false); e.target.value=''; }
  };
  const applyPaystub = (override)=>{
    // `override` carries the (possibly user-edited) values from the review sheet.
    const p = override || paystub; if(!p) return;
    if(p.baseRate) setBaseRate(p.baseRate);
    if(p.payPeriodStart) setPPS(p.payPeriodStart);
    if(p.pretaxDeductions) setPretax(p.pretaxDeductions);
    if(p.stateTaxRate) setState(Math.round(p.stateTaxRate*100)/100);
    if(p.ficaRate){ setFicaType('percent'); setFicaPct(Math.round(p.ficaRate*100)/100); }
    if(p.shifts&&p.shifts.length&&p.baseRate){
      const nd={...differentials};
      p.shifts.forEach(s=>{
        const key=classifyPaystubRow(s.description);
        if(!key || key==='base') return;   // never mutate Day-regular; skip unrecognized rows
        const da = Math.round((s.rate-p.baseRate)*100)/100;
        nd[key]={...nd[key], amount: nd[key]&&nd[key].type==='multiplier'?nd[key].amount:da, active:true};
      });
      setDiff(nd);
    }
    setPaystub(null); setSetupComplete(true); setObStep(0);
    track('paystub_imported', {shifts: (p.shifts&&p.shifts.length)||0}, user?.id);
  };

  if(!ready) return null;

  /* ============== ONBOARDING ============== */
  if(!setupComplete){
    return <>
      <Onboarding {...{obStep,setObStep,name,setName,baseRate,setBaseRate,num,
      differentials,setDiff,federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
      pretaxDeductions,setPretax,posttaxDeductions,setPosttax,
      onPaystub,parsing,finish:()=>{setSetupComplete(true); track('setup_completed', null, user?.id);},
      sampleNet:()=>{ // illustrative typical 2wk schedule from their rates
        const sample=[ {shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},
          {shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'base',hours:12,bonusType:'none'} ];
        let g=0,h=0; sample.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
        const ficaBase=g; const incomeTaxBase=Math.max(0,g-pretaxDeductions);
        const fica=ficaType==='percent'?ficaBase*((parseFloat(ficaPct)||0)/100):ficaBase*0.0765;
        const net=Math.max(0, g-(pretaxDeductions+fica+incomeTaxBase*(federalTaxRate/100)+incomeTaxBase*(stateTaxRate/100)+posttaxDeductions));
        return {net,gross:g,hours:h}; }
    }} />
      {paystub && <PaystubReview paystub={paystub} differentials={differentials} onApply={applyPaystub} onCancel={()=>setPaystub(null)} />}
    </>;
  }

  /* ============== MAIN APP ============== */
  const sampleWeekendNet = Math.round(shiftGross(baseRate, differentials['weekend-eve'], {shiftType:'weekend-eve',hours:12,bonusType:'none'}) * keepRatio);

  return (
    <div>
      <div className="topbar">
        <div className="brand"><span className="b-dot"></span>scrubpay</div>
        <nav className="topnav"><span className="on">Planner</span><button className="linklike" onClick={()=>document.querySelector('.cal-head')?.scrollIntoView({block:'start'})}>Calendar</button><button className="linklike" onClick={()=>setShowSettings(true)}>Settings</button></nav>
        <div className="top-actions">
          {syncing && <span style={{fontSize:12,color:'var(--muted-2)',marginRight:8}}>Syncing...</span>}
          {!syncing && syncError && <span onClick={retrySync} title="Tap to retry" style={{fontSize:12,color:'var(--danger)',marginRight:8,cursor:'pointer'}}>Couldn't sync — saved on this device ⟳</span>}
          <button className="btn btn-primary btn-sm desk-only" onClick={()=>{const k=keyOf(days.find(d=>!(shifts[keyOf(d)])) || days[0]); openSheet(k);}}>+ Log a shift</button>
          <button className="iconbtn" title="Send feedback" aria-label="Send feedback" onClick={()=>setShowFeedback(true)}>{Ic.chat}</button>
          <button className="iconbtn" title="Settings" onClick={()=>setShowSettings(true)}>{Ic.gear}</button>
          {user
            ? <button className="iconbtn" title="Sign out" onClick={handleSignOut}>{Ic.logout}</button>
            : <button className="btn btn-primary btn-sm" onClick={()=>setShowAuth(true)}>Sign in</button>}
          <div className="avatar">{user ? (user.email||'?').charAt(0).toUpperCase() : (name||'?').trim().charAt(0).toUpperCase()}</div>
        </div>
      </div>

      <div className="wrap">
        <div className="greet-row">
          <div className="greet"><div className="hi">{greeting()}</div><div className="name">{name==='there'?'Welcome back':name}</div></div>
          <div className="period"><button onClick={()=>movePeriod(-1)}>‹</button><span className="num">{periodLabel}</span><button onClick={()=>movePeriod(1)}>›</button></div>
        </div>

        <div className="dash">
          {/* LEFT */}
          <div className="col">
            <div className="hero">
              <div className="lbl">Projected take-home</div>
              <div className="num num">{fmt(calc.net)}</div>
              <div className="chips">
                <span className="chip">Gross {fmt(calc.gross)}</span>
                <span className="chip">Taxes & deductions –{fmt(calc.ded)}</span>
                {calc.hours>0 && <span className="chip">{calc.hours} hrs · {periodShiftCount} shifts</span>}
              </div>
              <button className="hero more linklike" onClick={()=>setShowBreakdown(true)}>See the full breakdown ›</button>
            </div>

            <div className="stats">
              <div className="stat"><div className="v num">{calc.hours.toFixed(calc.hours%1?1:0)}</div><div className="k">hours this period</div></div>
              <div className="stat"><div className="v num">{periodShiftCount}</div><div className="k">shifts this period</div></div>
            </div>

            {shiftCount>0 && baseRate>0 &&
              <div className="whatif">
                <div style={{flex:1}}><div className="t">Pick up a weekend night?</div><div className="s">That's about <b>+{fmt(sampleWeekendNet)}</b> take-home.</div></div>
                <button onClick={()=>{ const sat=days.find(d=>d.getDay()===6 && !(shifts[keyOf(d)])) || days.find(d=>d.getDay()===6) || days[0]; openSheet(keyOf(sat)); }}>Try it</button>
              </div>}

            <div className="card">
              <div className="cal-head"><div><div className="ttl">{calView==='period'?'This pay period':'Browse calendar'}</div></div><div className="sub">{qfMode?'':'Tap a day to add or edit'}</div></div>
              {!qfMode && templates.length>0 &&
                <button className="btn btn-ghost btn-sm" style={{marginBottom:14,minHeight:44}} onClick={startQuickFill}>⚡ Quick fill</button>}
              {qfMode &&
                <div className="qf-banner">
                  {!qfTemplate ? <>
                    <div className="t">Pick a template to quick-fill</div>
                    <div className="qf-chips">
                      {templates.map(t=>
                        <button key={t.id} className="chip-sel" style={{minHeight:44}} onClick={()=>setQfTemplate(t)}>
                          <i style={{background:differentials[t.shiftType]?.color||'#8A93A6'}}></i>⚡ {t.name} ×{t.hours}h
                        </button>)}
                    </div>
                    <button className="btn btn-ghost btn-sm" style={{marginTop:12,minHeight:44}} onClick={endQuickFill}>Cancel</button>
                  </> : <div className="row">
                    <div style={{flex:1,minWidth:0}}>

/* ---------- Calendar ---------- */
function Calendar({days,keyOf,statOf,differentials,shifts,dayEvents,notes,onPick,noLead,qfActive,qfTemplateId}){
  const lead = noLead?0:days[0].getDay();
  const cells = [];
  for(let i=0;i<lead;i++) cells.push(<div key={'e'+i} className="cell empty"></div>);
  days.forEach(dt=>{
    const k=keyOf(dt); const t=statOf(k); const arr=shifts[k]||[];
    const evs=(dayEvents&&dayEvents[k])||[];
    const hasShift=arr.length>0, hasEvent=evs.length>0, has=hasShift||hasEvent;
    const hasNote=!!(notes&&notes[k]);
    const qfOn = qfActive && arr.some(s=>s.templateId===qfTemplateId);
    cells.push(
      <button key={k} className={'cell'+(has?' has':'')+(qfOn?' qf-on':'')} onClick={()=>onPick(k)} aria-label={dt.toDateString()}>
        <div className="d">{dt.getDate()}{hasNote && <span className="note-mark" aria-hidden="true"></span>}</div>
        {has
          ? <div style={{marginTop:'auto'}}>
              {/* Shift dots and event rings share one marker row (capped to 4 combined) so a day
                  with both never grows taller than a day with just one — see .cell min-height/overflow. */}
              <div className="dots">
                {arr.slice(0,4).map((s,i)=><i key={'s'+i} style={{background:differentials[s.shiftType]?.color||'#8A93A6'}}></i>)}
                {evs.slice(0,Math.max(0,4-Math.min(arr.length,4))).map((e,i)=><i key={'e'+i} className="ev" style={{borderColor:EVENT_KIND_META[e.kind]?.color||'#8A93A6'}}></i>)}
              </div>
              {t.g>0 && <div className="amt num">{fmt(t.g)}</div>}
            </div>
          : <div className="plus">+</div>}
      </button>);
  });
  return <div className="grid">{cells}</div>;
}
