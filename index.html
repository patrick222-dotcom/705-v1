<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Wage Planner</title>
    <script crossorigin="anonymous" integrity="sha384-up6qOJhCFmT1Qa2IqC0cN79GYsOD4rpLj6MqDXBpgX6aPXkqAqBjChp8FPcKXt7s" src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" integrity="sha384-EKRLGcoK6rYG3A6NJrb9QmTr4B9U7mRpH0G4ER8Ie0X6xg7N8hG4fWr4XvPbHxPp" src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script integrity="sha384-T5z8T7PPWkVXqe0f3Ihnr9X0pHMdqL4WjC+HfoYfQCHMRwzE8DLy5p5PDQzX8jzJ" src="https://cdn.tailwindcss.com@3.4.1"></script>
    <script integrity="sha384-ZMXm9+I4L8Cew3jLI6RHPr0GfHF1j8vp7XEa6vS1aFfP7+sDBMblGy5TLePZ9kEm" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        const React = window.React;
        const ReactDOM = window.ReactDOM;
        const { useState, useMemo, useEffect } = React;

        // Simple SVG Icons
        const Calendar = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' }));
        const Briefcase = () => React.createElement('svg', { className: 'w-6 h-6', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m0 10v10l8 4m8-4v-10' }));
        const DollarSign = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' }));
        const Settings = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' }), React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M15 12a3 3 0 11-6 0 3 3 0 016 0z' }));
        const MessageCircle = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z' }));
        const X = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M6 18L18 6M6 6l12 12' }));
        const Download = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4' }));
        const Upload = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12' }));
        const Save = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4' }));
        const FileText = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' }));

        function NursingWageCalculator() {
            const [baseRate, setBaseRate] = useState(65.15);
            const [federalTaxRate, setFederalTaxRate] = useState(12);
            const [stateTaxRate, setStateTaxRate] = useState(2.5);
            const [pretaxDeductions, setPretaxDeductions] = useState(0);
            const [posttaxDeductions, setPosttaxDeductions] = useState(0);
            const [ficaWithholdingType, setFicaWithholdingType] = useState('standard');
            const [ficaWithholdingAmount, setFicaWithholdingAmount] = useState(0);
            const [ficaWithholdingPercent, setFicaWithholdingPercent] = useState(7.65);
            const [payPeriodStart, setPayPeriodStart] = useState('2024-01-01');
            const [shifts, setShifts] = useState({});
            const [selectedDate, setSelectedDate] = useState(null);
            const [showShiftModal, setShowShiftModal] = useState(false);
            const [customWithholdings, setCustomWithholdings] = useState([]);
            const [showDifferentialConfig, setShowDifferentialConfig] = useState(false);
            const [differentials, setDifferentials] = useState({
                'base': { name: 'Regular Day', amount: 0, type: 'dollar', active: true },
                'night': { name: 'Night Shift', amount: 10, type: 'dollar', active: true },
                'weekday-eve': { name: 'Weekday Evening', amount: 3, type: 'dollar', active: true },
                'weekend-day': { name: 'Weekend Day', amount: 11.5, type: 'dollar', active: true },
                'weekend-eve': { name: 'Weekend Evening', amount: 16.5, type: 'dollar', active: true },
                'overtime': { name: 'Overtime (1.5×)', amount: 1.5, type: 'multiplier', active: true },
            });
            const [newDifferentialName, setNewDifferentialName] = useState('');
            const [newDifferentialAmount, setNewDifferentialAmount] = useState(0);
            const [modalData, setModalData] = useState({
                hours: 12,
                shiftType: 'base',
                bonusType: 'none',
                customBonus: 0,
            });
            const [modalShifts, setModalShifts] = useState([]);
            const [showPaystubPreview, setShowPaystubPreview] = useState(false);
            const [parsedPaystubData, setParsedPaystubData] = useState(null);

            const bonusAmounts = { 'none': 0, 'charge': 3, 'preceptor': 2, 'oncall': 5, 'custom': 0 };

            // Load data from localStorage on mount
            useEffect(() => {
                try {
                    const saved = localStorage.getItem('nursingWagePlannerData');
                    if (saved) {
                        const data = JSON.parse(saved);
                        if (data.baseRate !== undefined) setBaseRate(data.baseRate);
                        if (data.federalTaxRate !== undefined) setFederalTaxRate(data.federalTaxRate);
                        if (data.stateTaxRate !== undefined) setStateTaxRate(data.stateTaxRate);
                        if (data.pretaxDeductions !== undefined) setPretaxDeductions(data.pretaxDeductions);
                        if (data.posttaxDeductions !== undefined) setPosttaxDeductions(data.posttaxDeductions);
                        if (data.ficaWithholdingType) setFicaWithholdingType(data.ficaWithholdingType);
                        if (data.ficaWithholdingAmount !== undefined) setFicaWithholdingAmount(data.ficaWithholdingAmount);
                        if (data.ficaWithholdingPercent !== undefined) setFicaWithholdingPercent(data.ficaWithholdingPercent);
                        if (data.payPeriodStart) setPayPeriodStart(data.payPeriodStart);
                        if (data.shifts) setShifts(data.shifts);
                        if (data.customWithholdings) setCustomWithholdings(data.customWithholdings);
                        if (data.differentials) setDifferentials(data.differentials);
                    }
                } catch (e) {
                    console.error('Error loading saved data:', e);
                }
            }, []);

            // Auto-save to localStorage whenever data changes (debounced)
            useEffect(() => {
                const timeoutId = setTimeout(() => {
                    try {
                        const dataToSave = {
                            baseRate, federalTaxRate, stateTaxRate, pretaxDeductions, posttaxDeductions,
                            ficaWithholdingType, ficaWithholdingAmount, ficaWithholdingPercent,
                            payPeriodStart, shifts, customWithholdings, differentials
                        };
                        localStorage.setItem('nursingWagePlannerData', JSON.stringify(dataToSave));
                    } catch (e) {
                        if (e.name === 'QuotaExceededError') {
                            alert('Storage limit reached. Please export and clear old data.');
                        }
                        console.error('Error saving data:', e);
                    }
                }, 500);

                return () => clearTimeout(timeoutId);
            }, [baseRate, federalTaxRate, stateTaxRate, pretaxDeductions, posttaxDeductions, ficaWithholdingType,
                ficaWithholdingAmount, ficaWithholdingPercent, payPeriodStart, shifts,
                customWithholdings, differentials]);

            // Export data as JSON file
            const exportData = () => {
                const dataToExport = {
                    baseRate, federalTaxRate, stateTaxRate, pretaxDeductions, posttaxDeductions,
                    ficaWithholdingType, ficaWithholdingAmount, ficaWithholdingPercent,
                    payPeriodStart, shifts, customWithholdings, differentials,
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `nursing-wage-planner-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // Import data from JSON file
            const importData = (event) => {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (data.baseRate !== undefined) setBaseRate(data.baseRate);
                            if (data.stateTaxRate !== undefined) setStateTaxRate(data.stateTaxRate);
                            if (data.pretaxDeductions !== undefined) setPretaxDeductions(data.pretaxDeductions);
                            if (data.posttaxDeductions !== undefined) setPosttaxDeductions(data.posttaxDeductions);
                            if (data.ficaWithholdingType) setFicaWithholdingType(data.ficaWithholdingType);
                            if (data.ficaWithholdingAmount !== undefined) setFicaWithholdingAmount(data.ficaWithholdingAmount);
                            if (data.ficaWithholdingPercent !== undefined) setFicaWithholdingPercent(data.ficaWithholdingPercent);
                            if (data.payPeriodStart) setPayPeriodStart(data.payPeriodStart);
                            if (data.shifts) setShifts(data.shifts);
                            if (data.customWithholdings) setCustomWithholdings(data.customWithholdings);
                            if (data.differentials) setDifferentials(data.differentials);
                            alert('Data imported successfully!');
                        } catch (error) {
                            alert('Error importing data. Please check the file format.');
                            console.error('Import error:', error);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            // Clear all data
            const clearAllData = () => {
                if (confirm('Are you sure you want to clear ALL data? This cannot be undone.')) {
                    localStorage.removeItem('nursingWagePlannerData');
                    window.location.reload();
                }
            };

            // Parse paystub PDF
            const parsePaystubPDF = async (file) => {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += pageText + '\n';
                    }

                    // Extract data using pattern matching
                    const extracted = {};

                    // Pay period dates
                    const payBeginMatch = fullText.match(/Pay Begin Date:\s*(\d{2}\/\d{2}\/\d{4})/);
                    const payEndMatch = fullText.match(/Pay End Date:\s*(\d{2}\/\d{2}\/\d{4})/);
                    if (payBeginMatch) {
                        const [month, day, year] = payBeginMatch[1].split('/');
                        extracted.payPeriodStart = `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
                    }

                    // Base hourly rate
                    const rateMatch = fullText.match(/Pay Rate:\s*\$?([\d,]+\.?\d*)\s*Hourly/);
                    if (rateMatch) {
                        extracted.baseRate = parseFloat(rateMatch[1].replace(/,/g, ''));
                    }

                    // Pre-tax deductions (403b, 401k, etc.)
                    const pretaxMatch = fullText.match(/403\(b\)[^\d]+([\d,]+\.?\d*)/);
                    if (pretaxMatch) {
                        extracted.pretaxDeductions = parseFloat(pretaxMatch[1].replace(/,/g, ''));
                    }

                    // FICA taxes
                    const ficaMedMatch = fullText.match(/Fed MED\/EE[^\d]+([\d,]+\.?\d*)/);
                    const ficaOasdiMatch = fullText.match(/Fed OASDI\/EE[^\d]+([\d,]+\.?\d*)/);
                    if (ficaMedMatch && ficaOasdiMatch) {
                        const ficaTotal = parseFloat(ficaMedMatch[1].replace(/,/g, '')) +
                                        parseFloat(ficaOasdiMatch[1].replace(/,/g, ''));
                        extracted.ficaWithholding = ficaTotal;
                    }

                    // State taxes
                    const stateMatch = fullText.match(/PA W\/H[^\d]+([\d,]+\.?\d*)/);
                    const philaMatch = fullText.match(/PA PHILADELPHIA W\/H[^\d]+([\d,]+\.?\d*)/);
                    const lsMatch = fullText.match(/PA LS Tax[^\d]+([\d,]+\.?\d*)/);
                    let stateTaxTotal = 0;
                    if (stateMatch) stateTaxTotal += parseFloat(stateMatch[1].replace(/,/g, ''));
                    if (philaMatch) stateTaxTotal += parseFloat(philaMatch[1].replace(/,/g, ''));
                    if (lsMatch) stateTaxTotal += parseFloat(lsMatch[1].replace(/,/g, ''));
                    if (stateTaxTotal > 0) {
                        extracted.stateTax = stateTaxTotal;
                    }

                    // Post-tax deductions (after TAXES section, before TOTAL NET)
                    const deductionsSection = fullText.match(/DEDUCTIONS([\s\S]*?)(?:TOTAL NET|$)/);
                    if (deductionsSection) {
                        let posttaxTotal = 0;
                        // Common post-tax patterns: Union dues, parking, FSA, garnishments, etc.
                        const deductionPatterns = [
                            /Union[^\d]+([\d,]+\.?\d*)/i,
                            /Parking[^\d]+([\d,]+\.?\d*)/i,
                            /Dues[^\d]+([\d,]+\.?\d*)/i,
                            /Garnish[^\d]+([\d,]+\.?\d*)/i,
                            /Post.*Tax[^\d]+([\d,]+\.?\d*)/i
                        ];

                        deductionPatterns.forEach(pattern => {
                            const match = deductionsSection[1].match(pattern);
                            if (match) {
                                posttaxTotal += parseFloat(match[1].replace(/,/g, ''));
                            }
                        });

                        if (posttaxTotal > 0) {
                            extracted.posttaxDeductions = posttaxTotal;
                        }
                    }

                    // Gross pay for rate calculations
                    const grossMatch = fullText.match(/TOTAL GROSS[^\d]+([\d,]+\.?\d*)/);
                    if (grossMatch) {
                        extracted.grossPay = parseFloat(grossMatch[1].replace(/,/g, ''));
                    }

                    // Calculate tax rates
                    if (extracted.ficaWithholding && extracted.grossPay) {
                        extracted.ficaRate = (extracted.ficaWithholding / extracted.grossPay) * 100;
                    }
                    if (extracted.stateTax && extracted.grossPay) {
                        extracted.stateTaxRate = (extracted.stateTax / extracted.grossPay) * 100;
                    }

                    // Extract hours and shift types (current period only, not YTD)
                    extracted.shifts = [];
                    const shiftsSection = fullText.match(/HOURS AND EARNINGS([\s\S]*?)TAXES/);
                    if (shiftsSection) {
                        // Match patterns like "PD Weekday Day 65.150000 39.25 2,557.16"
                        // Captures current period hours only (3rd number), ignoring YTD columns
                        const shiftRegex = /(?:PD |Incentive - )([\w\s-]+?)\s+([\d.]+)\s+([\d.]+)\s+([\d,.]+)(?:\s+[\d.]+\s+[\d,.]+)?/g;
                        let match;
                        const seenShifts = new Set(); // Track to avoid duplicates from YTD rows

                        while ((match = shiftRegex.exec(shiftsSection[1])) !== null) {
                            const description = match[1].trim();
                            const hours = parseFloat(match[3]);

                            // Skip if hours seem like YTD (typically much larger, e.g., >100)
                            // or if we've already seen this shift type
                            const shiftKey = description.toLowerCase();
                            if (hours > 0 && hours < 200 && !seenShifts.has(shiftKey)) {
                                seenShifts.add(shiftKey);
                                extracted.shifts.push({
                                    description: description,
                                    rate: parseFloat(match[2]),
                                    hours: hours,
                                    earnings: parseFloat(match[4].replace(/,/g, ''))
                                });
                            }
                        }
                    }

                    return extracted;
                } catch (error) {
                    console.error('Error parsing PDF:', error);
                    throw new Error('Failed to parse paystub. Please ensure it is a valid PDF file.');
                }
            };

            // Handle paystub file upload
            const handlePaystubUpload = async (event) => {
                const file = event.target.files[0];
                const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB limit

                if (!file) return;

                if (file.size > MAX_FILE_SIZE) {
                    alert('File too large. Maximum size is 10MB.');
                    event.target.value = '';
                    return;
                }

                if (file.type !== 'application/pdf') {
                    alert('Please upload a PDF file.');
                    event.target.value = '';
                    return;
                }

                try {
                    const parsed = await parsePaystubPDF(file);
                    setParsedPaystubData(parsed);
                    setShowPaystubPreview(true);
                } catch (error) {
                    alert(error.message || 'Error parsing paystub. Please try again.');
                }
                event.target.value = ''; // Reset input
            };

            // Apply parsed paystub data to configure calculator
            const applyPaystubData = () => {
                if (!parsedPaystubData) return;

                if (parsedPaystubData.baseRate) setBaseRate(parsedPaystubData.baseRate);
                if (parsedPaystubData.payPeriodStart) setPayPeriodStart(parsedPaystubData.payPeriodStart);
                if (parsedPaystubData.pretaxDeductions) setPretaxDeductions(parsedPaystubData.pretaxDeductions);
                if (parsedPaystubData.posttaxDeductions) setPosttaxDeductions(parsedPaystubData.posttaxDeductions);
                if (parsedPaystubData.stateTaxRate) setStateTaxRate(parsedPaystubData.stateTaxRate);

                // Set FICA as percentage if found
                if (parsedPaystubData.ficaRate) {
                    setFicaWithholdingType('percent');
                    setFicaWithholdingPercent(parsedPaystubData.ficaRate);
                }

                // Update shift differentials based on paystub data
                if (parsedPaystubData.shifts && parsedPaystubData.shifts.length > 0 && parsedPaystubData.baseRate) {
                    const newDifferentials = { ...differentials };

                    parsedPaystubData.shifts.forEach(shift => {
                        // Calculate differential amount: shift rate - base rate
                        const differentialAmount = shift.rate - parsedPaystubData.baseRate;

                        // Map shift description to differential key
                        const desc = shift.description.toLowerCase();
                        let shiftKey = 'base';
                        let shiftName = shift.description;

                        if (desc.includes('weekday') && (desc.includes('eve') || desc.includes('evening'))) {
                            shiftKey = 'weekday-eve';
                            shiftName = 'Weekday Evening';
                        } else if (desc.includes('weekend') && desc.includes('day') && !desc.includes('eve')) {
                            shiftKey = 'weekend-day';
                            shiftName = 'Weekend Day';
                        } else if (desc.includes('weekend') && (desc.includes('eve') || desc.includes('evening'))) {
                            shiftKey = 'weekend-eve';
                            shiftName = 'Weekend Evening';
                        } else if (desc.includes('overtime')) {
                            shiftKey = 'overtime';
                            shiftName = 'Overtime';
                        } else if (desc.includes('weekday') && desc.includes('day')) {
                            shiftKey = 'base';
                            shiftName = 'Regular Day';
                        }

                        // Update the differential with actual paystub values
                        newDifferentials[shiftKey] = {
                            name: shiftName,
                            amount: Math.round(differentialAmount * 100) / 100, // Round to 2 decimal places
                            active: true
                        };
                    });

                    setDifferentials(newDifferentials);
                }

                setShowPaystubPreview(false);
                setParsedPaystubData(null);
                alert('Calculator configured successfully with your paystub rates and deductions! Now add your shifts to the calendar.');
            };

            const getPayPeriodDays = () => {
                const [year, month, day] = payPeriodStart.split('-').map(Number);
                const days = [];
                for (let i = 0; i < 14; i++) {
                    const date = new Date(year, month - 1, day + i);
                    days.push(date);
                }
                return days;
            };

            const payPeriodDays = getPayPeriodDays();

            const formatDateKey = (date) => date.toISOString().split('T')[0];

            const getShiftsForDate = (date) => {
                const dateKey = formatDateKey(date);
                return shifts[dateKey] || [];
            };

            const handleDateClick = (date) => {
                setSelectedDate(date);
                const dateKey = formatDateKey(date);
                const existingShifts = shifts[dateKey] || [];
                setModalShifts([...existingShifts]);
                setModalData({ hours: 12, shiftType: 'base', bonusType: 'none', customBonus: 0 });
                setShowShiftModal(true);
            };

            const addShiftToModal = () => {
                if (modalData.hours > 0 && modalData.hours <= 24) {
                    const newShift = { id: Date.now(), ...modalData };
                    setModalShifts([...modalShifts, newShift]);
                    setModalData({ hours: 12, shiftType: 'base', bonusType: 'none', customBonus: 0 });
                } else {
                    alert('Hours must be between 0.1 and 24');
                }
            };

            const removeShiftFromModal = (shiftId) => {
                setModalShifts(modalShifts.filter(s => s.id !== shiftId));
            };

            const saveShift = () => {
                if (selectedDate && modalShifts.length > 0) {
                    const dateKey = formatDateKey(selectedDate);
                    setShifts({ ...shifts, [dateKey]: modalShifts });
                    setShowShiftModal(false);
                    setSelectedDate(null);
                    setModalShifts([]);
                }
            };

            const deleteAllShiftsForDay = () => {
                if (selectedDate) {
                    const dateKey = formatDateKey(selectedDate);
                    const newShifts = { ...shifts };
                    delete newShifts[dateKey];
                    setShifts(newShifts);
                    setShowShiftModal(false);
                    setSelectedDate(null);
