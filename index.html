<body>
    <div id="root"></div>
    <script type="module">
        const React = window.React;
        const ReactDOM = window.ReactDOM;
        const { useState, useMemo } = React;

        // Simple SVG Icons
        const Calendar = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z' }));
        const Briefcase = () => React.createElement('svg', { className: 'w-6 h-6', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m0 10v10l8 4m8-4v-10' }));
        const DollarSign = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z' }));
        const Settings = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' }), React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M15 12a3 3 0 11-6 0 3 3 0 016 0z' }));
        const MessageCircle = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z' }));
        const X = () => React.createElement('svg', { className: 'w-5 h-5', fill: 'none', stroke: 'currentColor', viewBox: '0 0 24 24' }, React.createElement('path', { strokeLinecap: 'round', strokeLinejoin: 'round', strokeWidth: 2, d: 'M6 18L18 6M6 6l12 12' }));

        function NursingWageCalculator() {
            const [baseRate, setBaseRate] = useState(65.15);
            const [stateTaxRate, setStateTaxRate] = useState(2.5);
            const [pretaxDeductions, setPretaxDeductions] = useState(0);
            const [posttaxDeductions, setPosttaxDeductions] = useState(0);
            const [ficaWithholdingType, setFicaWithholdingType] = useState('standard');
            const [ficaWithholdingAmount, setFicaWithholdingAmount] = useState(0);
            const [ficaWithholdingPercent, setFicaWithholdingPercent] = useState(7.65);
            const [payPeriodStart, setPayPeriodStart] = useState('2024-01-01');
            const [shifts, setShifts] = useState({});
            const [selectedDate, setSelectedDate] = useState(null);
            const [showShiftModal, setShowShiftModal] = useState(false);
            const [customWithholdings, setCustomWithholdings] = useState([]);
            const [showDifferentialConfig, setShowDifferentialConfig] = useState(false);
            const [differentials, setDifferentials] = useState({
                'base': { name: 'Regular Day', amount: 0, active: true },
                'weekday-eve': { name: 'Weekday Evening', amount: 30, active: true },
                'weekend-day': { name: 'Weekend Day', amount: 11.5, active: true },
                'weekend-eve': { name: 'Weekend Evening', amount: 16.5, active: true },
                'overtime': { name: 'Overtime', amount: 1.25, active: true },
            });
            const [newDifferentialName, setNewDifferentialName] = useState('');
            const [newDifferentialAmount, setNewDifferentialAmount] = useState(0);
            const [modalData, setModalData] = useState({
                hours: 8,
                shiftType: 'base',
                bonusType: 'none',
                customBonus: 0,
            });
            const [modalShifts, setModalShifts] = useState([]);

            const bonusAmounts = { 'none': 0, 'c1': 12, 'c2': 10, 'c3': 15 };

            const getPayPeriodDays = () => {
                const [year, month, day] = payPeriodStart.split('-').map(Number);
                const days = [];
                for (let i = 0; i < 14; i++) {
                    const date = new Date(year, month - 1, day + i);
                    days.push(date);
                }
                return days;
            };

            const payPeriodDays = getPayPeriodDays();

            const formatDateKey = (date) => date.toISOString().split('T')[0];

            const getShiftsForDate = (date) => {
                const dateKey = formatDateKey(date);
                return shifts[dateKey] || [];
            };

            const handleDateClick = (date) => {
                setSelectedDate(date);
                const dateKey = formatDateKey(date);
                const existingShifts = shifts[dateKey] || [];
                setModalShifts([...existingShifts]);
                setModalData({ hours: 8, shiftType: 'base', bonusType: 'none', customBonus: 0 });
                setShowShiftModal(true);
            };

            const addShiftToModal = () => {
                if (modalData.hours > 0) {
                    const newShift = { id: Date.now(), ...modalData };
                    setModalShifts([...modalShifts, newShift]);
                    setModalData({ hours: 8, shiftType: 'base', bonusType: 'none', customBonus: 0 });
                }
            };

            const removeShiftFromModal = (shiftId) => {
                setModalShifts(modalShifts.filter(s => s.id !== shiftId));
            };

            const saveShift = () => {
                if (selectedDate && modalShifts.length > 0) {
                    const dateKey = formatDateKey(selectedDate);
                    setShifts({ ...shifts, [dateKey]: modalShifts });
                    setShowShiftModal(false);
                    setSelectedDate(null);
                    setModalShifts([]);
                }
            };

            const deleteAllShiftsForDay = () => {
                if (selectedDate) {
                    const dateKey = formatDateKey(selectedDate);
                    const newShifts = { ...shifts };
                    delete newShifts[dateKey];
                    setShifts(newShifts);
                    setShowShiftModal(false);
                    setSelectedDate(null);
                    setModalShifts([]);
                }
            };

            const addCustomWithholding = () => {
                setCustomWithholdings([...customWithholdings, { id: Date.now(), name: '', amount: 0, type: 'dollar' }]);
            };

            const updateCustomWithholding = (id, field, value) => {
                setCustomWithholdings(customWithholdings.map(w => w.id === id ? { ...w, [field]: value } : w));
            };

            const removeCustomWithholding = (id) => {
                setCustomWithholdings(customWithholdings.filter(w => w.id !== id));
            };

            const updateDifferential = (key, field, value) => {
                setDifferentials({
                    ...differentials,
                    [key]: { ...differentials[key], [field]: field === 'amount' ? parseFloat(value) : value }
                });
            };

            const toggleDifferentialActive = (key) => {
                setDifferentials({
                    ...differentials,
                    [key]: { ...differentials[key], active: !differentials[key].active }
                });
            };

            const addNewDifferential = () => {
                if (newDifferentialName.trim()) {
                    const newKey = `custom-${Date.now()}`;
                    setDifferentials({
                        ...differentials,
                        [newKey]: { name: newDifferentialName, amount: parseFloat(newDifferentialAmount) || 0, active: true }
                    });
                    setNewDifferentialName('');
                    setNewDifferentialAmount(0);
                }
            };

            const deleteDifferential = (key) => {
                const newDifferentials = { ...differentials };
                delete newDifferentials[key];
                setDifferentials(newDifferentials);
            };

            const periodCalculations = useMemo(() => {
                let totalGross = 0, totalHours = 0;
                Object.values(shifts).forEach((dayShifts) => {
                    dayShifts.forEach((shift) => {
                        const differentialRate = differentials[shift.shiftType]?.amount || 0;
                        const hourlyRate = baseRate + differentialRate;
                        const bonusAmount = shift.bonusType === 'custom' ? parseFloat(shift.customBonus) : bonusAmounts[shift.bonusType];
                        const shiftGross = (hourlyRate * shift.hours) + bonusAmount;
                        totalGross += shiftGross;
                        totalHours += shift.hours;
                    });
                });

                const taxableGross = totalGross - pretaxDeductions;
                let ficaWithholding = 0;
                if (ficaWithholdingType === 'standard') {
                    ficaWithholding = taxableGross * 0.0765;
                } else if (ficaWithholdingType === 'dollar') {
                    ficaWithholding = parseFloat(ficaWithholdingAmount) || 0;
                } else if (ficaWithholdingType === 'percent') {
                    ficaWithholding = taxableGross * (parseFloat(ficaWithholdingPercent) / 100) || 0;
                }

                const stateTax = taxableGross * (stateTaxRate / 100);
                let customWithholdingsTotal = 0;
                customWithholdings.forEach(withholding => {
                    if (withholding.type === 'dollar') {
                        customWithholdingsTotal += parseFloat(withholding.amount) || 0;
                    } else if (withholding.type === 'percent') {
                        customWithholdingsTotal += taxableGross * (parseFloat(withholding.amount) / 100) || 0;
                    }
                });

                const totalDeductions = pretaxDeductions + ficaWithholding + stateTax + posttaxDeductions + customWithholdingsTotal;
                const netPay = totalGross - totalDeductions;

                return {
                    totalGross: totalGross.toFixed(2),
                    totalHours: totalHours.toFixed(1),
                    ficaWithholding: ficaWithholding.toFixed(2),
                    stateTax: stateTax.toFixed(2),
                    customWithholdingsTotal: customWithholdingsTotal.toFixed(2),
                    totalDeductions: totalDeductions.toFixed(2),
                    netPay: netPay.toFixed(2),
                };
            }, [shifts, baseRate, stateTaxRate, pretaxDeductions, posttaxDeductions, customWithholdings, differentials, ficaWithholdingType, ficaWithholdingAmount, ficaWithholdingPercent]);

            const getDayShiftGross = (date) => {
                const dayShifts = getShiftsForDate(date);
                let dayGross = 0;
                dayShifts.forEach((shift) => {
                    const differentialRate = differentials[shift.shiftType]?.amount || 0;
                    const hourlyRate = baseRate + differentialRate;
                    const bonusAmount = shift.bonusType === 'custom' ? parseFloat(shift.customBonus) : bonusAmounts[shift.bonusType];
                    dayGross += (hourlyRate * shift.hours) + bonusAmount;
                });
                return dayGross;
            };

            const getDayHours = (date) => {
                const dayShifts = getShiftsForDate(date);
                return dayShifts.reduce((sum, shift) => sum + shift.hours, 0);
            };

            const payPeriodLabel = `${payPeriodStart} to ${formatDateKey(new Date(new Date(payPeriodStart).getTime() + 13 * 24 * 60 * 60 * 1000))}`;

            return React.createElement('div', { className: 'w-full min-h-screen bg-gradient-to-b from-emerald-50 via-white to-green-50 p-4 md:p-6' },
                React.createElement('div', { className: 'max-w-5xl mx-auto' },
                    React.createElement('div', { className: 'mb-8 flex items-start justify-between gap-4' },
                        React.createElement('div', null,
                            React.createElement('div', { className: 'flex items-center gap-3 mb-3' },
                                React.createElement('div', { className: 'p-2 bg-gradient-to-br from-emerald-100 to-green-100 rounded-lg' },
                                    React.createElement(Briefcase)
                                ),
                                React.createElement('h1', { className: 'text-3xl md:text-4xl font-bold text-gray-800' }, 'Nursing Wage Planner')
                            ),
                            React.createElement('p', { className: 'text-gray-600 text-base md:text-lg ml-11' }, 'Plan your schedule and forecast your take-home pay')
                        ),
                        React.createElement('div', { className: 'flex gap-2 flex-shrink-0' },
                            React.createElement('button', { onClick: () => setShowDifferentialConfig(true), className: 'p-2 md:p-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 hover:shadow-lg transition' },
                                React.createElement(Settings)
                            ),
                            React.createElement('button', { onClick: () => window.open('https://docs.google.com/forms/d/e/1FAIpQLSd0sOLUD76uvXsGrLvmd90LFHTcXrT-6he-GhrELaCEW3r-Fg/viewform?usp=pp_url', '_blank'), className: 'p-2 md:p-3 bg-gradient-to-r from-green-500 to-emerald-500 text-white rounded-xl hover:shadow-lg transition' },
                                React.createElement(MessageCircle)
                            )
                        )
                    ),
                    React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8' },
                        React.createElement('div', { className: 'lg:col-span-2' },
                            React.createElement('div', { className: 'bg-white rounded-2xl shadow-sm p-4 md:p-6 border border-gray-100' },
                                React.createElement('div', { className: 'mb-6 p-3 bg-gradient-to-r from-emerald-50 to-green-50 rounded-xl border border-emerald-100' },
                                    React.createElement('label', { className: 'flex items-center gap-2 font-semibold text-gray-700 mb-2' },
                                        React.createElement(Calendar),
                                        'Pay Period Start Date'
                                    ),
                                    React.createElement('input', {
                                        type: 'date',
                                        value: payPeriodStart,
                                        onChange: (e) => setPayPeriodStart(e.target.value),
                                        className: 'px-3 py-1 text-sm border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent w-full'
                                    }),
                                    React.createElement('p', { className: 'text-xs text-gray-600 mt-1' }, `📅 ${payPeriodLabel}`)
                                ),
                                React.createElement('div', { className: 'overflow-x-auto' },
                                    React.createElement('div', { className: 'grid grid-cols-7 gap-1 mb-2' },
                                        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((day) =>
                                            React.createElement('div', { key: day, className: 'text-center font-bold text-xs text-gray-600 h-6 flex items-center justify-center' }, day)
                                        )
                                    ),
                                    React.createElement('div', { className: 'grid grid-cols-7 gap-1' },
                                        payPeriodDays.map((date) => {
                                            const dayShifts = getShiftsForDate(date);
                                            const dayGross = getDayShiftGross(date);
                                            const dayHours = getDayHours(date);
                                            const isWeekend = date.getDay() === 0 || date.getDay() === 6;
                                            const dateKey = formatDateKey(date);

                                            return React.createElement('button', {
                                                key: dateKey,
                                                onClick: () => handleDateClick(date),
                                                className: `rounded p-2 text-center cursor-pointer transition min-h-20 flex flex-col justify-center text-xs ${dayShifts.length > 0 ? 'bg-gradient-to-b from-green-100 to-emerald-100 border-2 border-green-400 hover:shadow-md' : isWeekend ? 'bg-gray-100 border border-gray-300 hover:border-emerald-300' : 'bg-white border border-gray-200 hover:border-emerald-300'}`,
                                                style: { padding: '8px', cursor: 'pointer' }
                                            },
                                                React.createElement('div', { className: 'font-bold text-gray-800' }, date.getDate()),
                                                dayShifts.length > 0 ? React.createElement('div', { className: 'space-y-1 mt-1' },
                                                    React.createElement('div', { className: 'text-emerald-700 font-semibold' }, `${dayHours}h`),
                                                    React.createElement('div', { className: 'text-green-600 font-bold' }, `$${dayGross.toFixed(0)}`)
                                                ) : React.createElement('div', { className: 'text-gray-400 hover:text-emerald-500 transition text-lg leading-none mt-1' }, '+')
                                            );
                                        })
                                    )
                                ),
                                React.createElement('p', { className: 'text-xs text-gray-500 text-center mt-4' }, '💡 Click a day to add or view shifts')
                            )
                        ),
                        React.createElement('div', { className: 'space-y-6' },
                            React.createElement('div', { className: 'bg-white rounded-2xl shadow-sm p-6 border border-gray-100' },
                                React.createElement('h3', { className: 'text-lg font-bold text-gray-800 mb-5 flex items-center gap-2' },
                                    React.createElement(DollarSign),
                                    'Your Details'
                                ),
                                React.createElement('div', { className: 'space-y-4' },
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'Base Hourly Rate'),
                                        React.createElement('div', { className: 'relative' },
                                            React.createElement('span', { className: 'absolute left-3 top-3 text-gray-500' }, '$'),
                                            React.createElement('input', {
                                                type: 'number',
                                                value: baseRate,
                                                onChange: (e) => setBaseRate(parseFloat(e.target.value)),
                                                step: '0.01',
                                                className: 'w-full pl-7 pr-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent'
                                            })
                                        )
                                    ),
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'FICA Tax Withholding'),
                                        React.createElement('select', {
                                            value: ficaWithholdingType,
                                            onChange: (e) => setFicaWithholdingType(e.target.value),
                                            className: 'w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent mb-2'
                                        },
                                            React.createElement('option', { value: 'standard' }, 'Standard (7.65%)'),
                                            React.createElement('option', { value: 'dollar' }, 'Custom Amount ($)'),
                                            React.createElement('option', { value: 'percent' }, 'Custom Percent (%)')
                                        ),
                                        ficaWithholdingType === 'dollar' && React.createElement('div', { className: 'relative' },
                                            React.createElement('span', { className: 'absolute left-3 top-3 text-gray-500' }, '$'),
                                            React.createElement('input', {
                                                type: 'number',
                                                value: ficaWithholdingAmount,
                                                onChange: (e) => setFicaWithholdingAmount(parseFloat(e.target.value) || 0),
                                                step: '0.01',
                                                placeholder: '0.00',
                                                className: 'w-full pl-7 pr-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent'
                                            })
                                        ),
                                        ficaWithholdingType === 'percent' && React.createElement('div', { className: 'relative' },
                                            React.createElement('input', {
                                                type: 'number',
                                                value: ficaWithholdingPercent,
                                                onChange: (e) => setFicaWithholdingPercent(parseFloat(e.target.value) || 0),
                                                step: '0.01',
                                                placeholder: '7.65',
                                                className: 'w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent'
                                            }),
                                            React.createElement('span', { className: 'absolute right-3 top-3 text-gray-500' }, '%')
                                        )
                                    ),
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-semibold text-gray-700 mb-2' }, 'State Tax Rate'),
                                        React.createElement('div', { className: 'relative' },
                                            React.createElement('input', {
                                                type: 'number',
                                                value: stateTaxRate,
                                                onChange: (e) => setStateTaxRate(parseFloat(e.target.value)),
                                                step: '0.1',
                                                className: 'w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-transparent'
                                            }),
                                            React.createElement('span', { className: 'absolute right-3 top-3 text-gray-500' }, '%')
                                        ),
                                        React.createElement('p', { className: 'text-xs text-gray-500 mt-1' }, 'PA example: ~2.5%')
                                    )
                                )
                            ),
                            React.createElement('div', { className: 'bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl shadow-sm p-6 border-2 border-green-200' },
                                React.createElement('h3', { className: 'text-lg font-bold text-gray-800 mb-5' }, '14-Day Earnings'),
                                React.createElement('div', { className: 'space-y-3 text-sm mb-5' },
                                    React.createElement('div', { className: 'flex justify-between items-center' },
                                        React.createElement('span', { className: 'text-gray-700' }, 'Total Hours'),
                                        React.createElement('span', { className: 'font-mono font-bold text-lg text-gray-800' }, periodCalculations.totalHours)
                                    ),
                                    React.createElement('div', { className: 'flex justify-between items-center pb-4 border-b-2 border-green-200' },
                                        React.createElement('span', { className: 'text-gray-700 font-semibold' }, 'Gross Pay'),
                                        React.createElement('span', { className: 'font-mono font-bold text-lg text-gray-800' }, `$${periodCalculations.totalGross}`)
                                    ),
                                    React.createElement('div', { className: 'space-y-2 pt-2' },
                                        React.createElement('div', { className: 'text-xs text-gray-600' }, 'Deductions:'),
                                        React.createElement('div', { className: 'flex justify-between text-xs' },
                                            React.createElement('span', { className: 'text-gray-600' }, 'FICA Tax'),
                                            React.createElement('span', { className: 'font-mono text-gray-700' }, `-$${periodCalculations.ficaWithholding}`)
                                        ),
                                        React.createElement('div', { className: 'flex justify-between text-xs' },
                                            React.createElement('span', { className: 'text-gray-600' }, 'State Tax'),
                                            React.createElement('span', { className: 'font-mono text-gray-700' }, `-$${periodCalculations.stateTax}`)
                                        )
                                    )
                                ),
                                React.createElement('div', { className: 'bg-white rounded-xl p-4 border border-green-200' },
                                    React.createElement('p', { className: 'text-gray-600 text-xs mb-2 font-medium' }, '💰 Your Take-Home Pay'),
                                    React.createElement('p', { className: 'text-3xl md:text-4xl font-bold text-green-600' }, `$${periodCalculations.netPay}`)
                                )
                            )
                        )
                    ),

                    // Shift Modal
                    showShiftModal && React.createElement('div', { className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50', onClick: () => setShowShiftModal(false) },
                        React.createElement('div', { className: 'bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto', onClick: (e) => e.stopPropagation() },
                            React.createElement('div', { className: 'flex justify-between items-center mb-4' },
                                React.createElement('h2', { className: 'text-2xl font-bold text-gray-800' },
                                    `Shifts for ${selectedDate ? selectedDate.toLocaleDateString() : ''}`
                                ),
                                React.createElement('button', { onClick: () => setShowShiftModal(false), className: 'p-2 hover:bg-gray-100 rounded-lg' },
                                    React.createElement(X)
                                )
                            ),

                            // Existing shifts
                            modalShifts.length > 0 && React.createElement('div', { className: 'mb-6' },
                                React.createElement('h3', { className: 'font-semibold text-gray-700 mb-3' }, 'Current Shifts:'),
                                React.createElement('div', { className: 'space-y-2' },
                                    modalShifts.map(shift =>
                                        React.createElement('div', { key: shift.id, className: 'flex justify-between items-center p-3 bg-green-50 rounded-lg' },
                                            React.createElement('div', null,
                                                React.createElement('span', { className: 'font-semibold' }, `${shift.hours}h - ${differentials[shift.shiftType]?.name || shift.shiftType}`),
                                                shift.bonusType !== 'none' && React.createElement('span', { className: 'text-sm text-gray-600 ml-2' },
                                                    `+$${shift.bonusType === 'custom' ? shift.customBonus : bonusAmounts[shift.bonusType]} bonus`
                                                )
                                            ),
                                            React.createElement('button', {
                                                onClick: () => removeShiftFromModal(shift.id),
                                                className: 'text-red-600 hover:bg-red-100 p-2 rounded'
                                            }, 'Remove')
                                        )
                                    )
                                )
                            ),

                            // Add new shift
                            React.createElement('div', { className: 'border-t pt-4' },
                                React.createElement('h3', { className: 'font-semibold text-gray-700 mb-3' }, 'Add Shift:'),
                                React.createElement('div', { className: 'grid grid-cols-2 gap-4 mb-4' },
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Hours'),
                                        React.createElement('input', {
                                            type: 'number',
                                            value: modalData.hours,
                                            onChange: (e) => setModalData({...modalData, hours: parseFloat(e.target.value) || 0}),
                                            step: '0.5',
                                            className: 'w-full px-3 py-2 border border-gray-200 rounded-lg'
                                        })
                                    ),
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Shift Type'),
                                        React.createElement('select', {
                                            value: modalData.shiftType,
                                            onChange: (e) => setModalData({...modalData, shiftType: e.target.value}),
                                            className: 'w-full px-3 py-2 border border-gray-200 rounded-lg'
                                        },
                                            Object.entries(differentials).filter(([_, diff]) => diff.active).map(([key, diff]) =>
                                                React.createElement('option', { key: key, value: key }, diff.name)
                                            )
                                        )
                                    ),
                                    React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Bonus'),
                                        React.createElement('select', {
                                            value: modalData.bonusType,
                                            onChange: (e) => setModalData({...modalData, bonusType: e.target.value}),
                                            className: 'w-full px-3 py-2 border border-gray-200 rounded-lg'
                                        },
                                            React.createElement('option', { value: 'none' }, 'None'),
                                            React.createElement('option', { value: 'c1' }, 'C1 ($12)'),
                                            React.createElement('option', { value: 'c2' }, 'C2 ($10)'),
                                            React.createElement('option', { value: 'c3' }, 'C3 ($15)'),
                                            React.createElement('option', { value: 'custom' }, 'Custom')
                                        )
                                    ),
                                    modalData.bonusType === 'custom' && React.createElement('div', null,
                                        React.createElement('label', { className: 'block text-sm font-medium text-gray-700 mb-1' }, 'Custom Bonus $'),
                                        React.createElement('input', {
                                            type: 'number',
                                            value: modalData.customBonus,
                                            onChange: (e) => setModalData({...modalData, customBonus: parseFloat(e.target.value) || 0}),
                                            step: '0.01',
                                            className: 'w-full px-3 py-2 border border-gray-200 rounded-lg'
                                        })
                                    )
                                ),
                                React.createElement('button', {
                                    onClick: addShiftToModal,
                                    className: 'w-full bg-emerald-500 text-white py-2 rounded-lg hover:bg-emerald-600 mb-4'
                                }, '+ Add Shift')
                            ),

                            // Actions
                            React.createElement('div', { className: 'flex gap-3 mt-6' },
                                React.createElement('button', {
                                    onClick: saveShift,
                                    disabled: modalShifts.length === 0,
                                    className: 'flex-1 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed font-semibold'
                                }, 'Save All Shifts'),
                                modalShifts.length > 0 && React.createElement('button', {
                                    onClick: deleteAllShiftsForDay,
                                    className: 'px-4 bg-red-100 text-red-600 py-3 rounded-lg hover:bg-red-200 font-semibold'
                                }, 'Delete All')
                            )
                        )
                    ),

                    // Differential Config Modal
                    showDifferentialConfig && React.createElement('div', { className: 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50', onClick: () => setShowDifferentialConfig(false) },
                        React.createElement('div', { className: 'bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto', onClick: (e) => e.stopPropagation() },
                            React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                                React.createElement('h2', { className: 'text-2xl font-bold text-gray-800' }, 'Configure Shift Differentials'),
                                React.createElement('button', { onClick: () => setShowDifferentialConfig(false), className: 'p-2 hover:bg-gray-100 rounded-lg' },
                                    React.createElement(X)
                                )
                            ),

                            React.createElement('div', { className: 'space-y-4 mb-6' },
                                Object.entries(differentials).map(([key, diff]) =>
                                    React.createElement('div', { key: key, className: 'flex items-center gap-4 p-4 bg-gray-50 rounded-lg' },
                                        React.createElement('input', {
                                            type: 'checkbox',
                                            checked: diff.active,
                                            onChange: () => toggleDifferentialActive(key),
                                            className: 'w-5 h-5'
                                        }),
                                        React.createElement('div', { className: 'flex-1' },
                                            React.createElement('input', {
                                                type: 'text',
                                                value: diff.name,
                                                onChange: (e) => updateDifferential(key, 'name', e.target.value),
                                                className: 'w-full px-3 py-2 border border-gray-200 rounded-lg mb-2 font-semibold',
                                                disabled: key === 'base'
                                            }),
                                            React.createElement('div', { className: 'flex items-center gap-2' },
                                                React.createElement('span', { className: 'text-sm text-gray-600' }, 'Differential: $'),
                                                React.createElement('input', {
                                                    type: 'number',
                                                    value: diff.amount,
                                                    onChange: (e) => updateDifferential(key, 'amount', e.target.value),
                                                    step: '0.01',
                                                    className: 'w-24 px-2 py-1 border border-gray-200 rounded'
                                                }),
                                                React.createElement('span', { className: 'text-sm text-gray-600' }, '/hr')
                                            )
                                        ),
                                        !key.includes('base') && React.createElement('button', {
                                            onClick: () => deleteDifferential(key),
                                            className: 'text-red-600 hover:bg-red-100 p-2 rounded'
                                        }, 'Delete')
                                    )
                                )
                            ),

                            React.createElement('div', { className: 'border-t pt-4' },
                                React.createElement('h3', { className: 'font-semibold text-gray-700 mb-3' }, 'Add New Differential:'),
                                React.createElement('div', { className: 'flex gap-3' },
                                    React.createElement('input', {
                                        type: 'text',
                                        value: newDifferentialName,
                                        onChange: (e) => setNewDifferentialName(e.target.value),
                                        placeholder: 'Name (e.g., Night Shift)',
                                        className: 'flex-1 px-3 py-2 border border-gray-200 rounded-lg'
                                    }),
                                    React.createElement('input', {
                                        type: 'number',
                                        value: newDifferentialAmount,
                                        onChange: (e) => setNewDifferentialAmount(parseFloat(e.target.value) || 0),
                                        placeholder: '0.00',
                                        step: '0.01',
                                        className: 'w-32 px-3 py-2 border border-gray-200 rounded-lg'
                                    }),
                                    React.createElement('button', {
                                        onClick: addNewDifferential,
                                        className: 'bg-emerald-500 text-white px-4 py-2 rounded-lg hover:bg-emerald-600'
                                    }, 'Add')
                                )
                            ),

                            React.createElement('button', {
                                onClick: () => setShowDifferentialConfig(false),
                                className: 'w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 mt-6 font-semibold'
                            }, 'Done')
                        )
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(NursingWageCalculator));
    </script>
</body>
</html>
