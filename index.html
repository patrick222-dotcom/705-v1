/* ---------- Swap board (Phase 1: anonymous groups + posting/browsing; matching is Phase 2) ---------- */
function SwapsSheet({user, shifts, dayEvents, notes, saveDayShifts, differentials, onClose, onOpenAuth, onPendingCount}){
  const [loading,setLoading] = useState(true);
  const [loadError,setLoadError] = useState(false);
  const [tablesMissing,setTablesMissing] = useState(false);
  const [profile,setProfile] = useState(null);
  const [dnDraft,setDnDraft] = useState('');
  const [savingProfile,setSavingProfile] = useState(false);

  const [groups,setGroups] = useState([]);
  const [activeGroupId,setActiveGroupId] = useState(null);
  const [justCreated,setJustCreated] = useState(null);   // {id,name,invite_code} — one-time share screen
  const [createName,setCreateName] = useState('');
  const [creating,setCreating] = useState(false);
  const [joinCode,setJoinCode] = useState('');
  const [joining,setJoining] = useState(false);

  const [posts,setPosts] = useState([]);
  const [boardLoading,setBoardLoading] = useState(false);

  const [composerOpen,setComposerOpen] = useState(false);
  const [composerKind,setComposerKind] = useState('give');
  const [selectedGive,setSelectedGive] = useState(null);   // {dateKey, shift}
  const [wantDate,setWantDate] = useState('');
  const [availDates,setAvailDates] = useState([]);
  const [composerNote,setComposerNote] = useState('');
  const [posting,setPosting] = useState(false);

  // ---- Phase 2: matching ----
  const [matches,setMatches] = useState([]);           // [{id,status,legs:[...]}] — matches I'm a party to
  const [proposingKey,setProposingKey] = useState(null);   // suggestion.key currently being proposed
  const [legBusyId,setLegBusyId] = useState(null);         // match.id currently accepting/declining
  // Which match ids *I* proposed, and the suggestion that created them — session memory only.
  // The DB deliberately doesn't grant SELECT on swap_matches.proposed_by (same anonymity model
  // as posts' author column), so "You proposed this" and the precise cycle3 give-flow can only
  // be known for matches proposed in this browser session; anything else recomputes best-effort
  // (resolveIncomingGive) or degrades gracefully (plan shown without the "You proposed" label).
  const [proposedByMe,setProposedByMe] = useState(()=>new Set());
  const [matchPlans,setMatchPlans] = useState({});         // matchId -> {kind,outgoing,middle,incoming}
  const [revealData,setRevealData] = useState({});         // matchId -> [{post_id,display_name}]
  const [revealing,setRevealing] = useState({});            // matchId -> true while reveal_match is in flight
  const [appliedMatchIds,setAppliedMatchIds] = useState(()=>new Set());  // Apply-to-calendar already used
  // matchId -> Date.now() of the last 'match_stale' failure. doReveal's caller (the auto-reveal
  // effect) re-fires on every `matches` change, and reveal's own error handling below refetches
  // matches -- without this cooldown a persistently-stale match (legs still read all-accepted
  // but reveal keeps refusing) would hammer the reveal_match RPC in a tight loop instead of
  // retrying at the same ~15s pace as everything else that polls.
  const staleRevealAtRef = useRef({});

  const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  /* ---- initial load: profile, then (if it exists) group memberships ---- */
  const loadInitial = async (uid)=>{
    setLoading(true); setLoadError(false); setTablesMissing(false);
    const {profile:p, missing, error} = await fetchSwapProfile(uid);
    if(missing){ setTablesMissing(true); setLoading(false); return; }
    if(error){ setLoadError(true); setLoading(false); return; }
    setProfile(p);
    if(p){
      const {groups:g, missing:gMissing, error:gErr} = await fetchSwapGroups();
      if(gMissing){ setTablesMissing(true); setLoading(false); return; }
      if(gErr){ setLoadError(true); setLoading(false); return; }
      setGroups(g);
      if(g.length>=1) setActiveGroupId(prev=> prev || g[0].id);
    }
    setLoading(false);
  };
  useEffect(()=>{
    if(!user){ setLoading(false); return; }
    (async()=>{ await loadInitial(user.id); })();
    // eslint-disable-next-line
  },[user && user.id]);

  /* ---- board + my matches: fetch on group switch/open, then poll every 15s while the sheet
     is open (mirrors the app's cross-device sync poll). Match counts (the entry-point badge)
     ride along on this same cycle — no separate/background polling, per spec: the badge just
     shows the last count learned while the sheet was open. ---- */
  const refreshBoardAndMatches = async ()=>{
    // Run independently (not gated behind Promise.all before either commits) so a slow/failing
    // matches fetch never delays the board feed showing up — each half updates state as soon
    // as ITS OWN request resolves.
    const boardP = fetchSwapBoard(activeGroupId).then(({posts:p, missing})=>{
      if(missing){ setTablesMissing(true); return; }
      setPosts(p);
    });
    const matchesP = fetchMyMatchesWithLegs(activeGroupId).then(({matches:m, missing})=>{
      if(missing){ setTablesMissing(true); return; }
      setMatches(m);
      if(onPendingCount){
        const pending = m.filter(mm=> mm.status==='proposed' && (mm.legs||[]).some(l=>l.is_my_leg && !l.accepted)).length;
        onPendingCount(pending);
      }
    });
    await Promise.all([boardP, matchesP]);
  };
  useEffect(()=>{
    if(!activeGroupId) return;
    let stopped=false;
    const load = async ()=>{ if(!stopped && document.visibilityState!=='hidden') await refreshBoardAndMatches(); };
    setBoardLoading(true);
    load().finally(()=>{ if(!stopped) setBoardLoading(false); });
    const id = setInterval(load, 15000);
    return ()=>{ stopped=true; clearInterval(id); };
    // eslint-disable-next-line
  },[activeGroupId]);

  const saveDisplayName = async ()=>{
    const nm = dnDraft.trim();
    if(nm.length<1 || nm.length>40){ toast('Enter a name between 1 and 40 characters.','error'); return; }
    setSavingProfile(true);
    const ok = await saveSwapProfile(user.id, nm);
    setSavingProfile(false);
    if(!ok){ toast("Couldn't save your name — try again.",'error'); return; }
    setProfile({display_name:nm});
    const {groups:g, missing, error} = await fetchSwapGroups();
    if(missing){ setTablesMissing(true); return; }
    if(error){ setLoadError(true); return; }
    setGroups(g);
    if(g.length>=1) setActiveGroupId(prev=> prev || g[0].id);
  };

  const doCreateGroup = async ()=>{
    const nm = createName.trim();
    if(nm.length<1 || nm.length>60){ toast("Give your board a name.",'error'); return; }
    setCreating(true);
    const {group, error} = await createSwapGroup(user.id, nm);
    setCreating(false);
    if(!group){ toast("Couldn't create the board — try again.",'error'); return; }
    setGroups(prev=>[...prev, group]);
    setActiveGroupId(group.id);
    setJustCreated(group);
    setCreateName('');
    track('swap_group_created', null, user.id);
  };
  const doJoinGroup = async ()=>{
    const code = joinCode.trim().toUpperCase();
    if(!/^[A-Z0-9]{6}$/.test(code)){ toast('Enter the 6-character code.','error'); return; }
    setJoining(true);
    const {group, error} = await joinSwapGroupByCode(code);
    setJoining(false);
    if(!group){
      const msg = String((error&&error.message)||error||'');
      toast(msg.indexOf('invalid_code')>=0 ? "That code didn't match a board." : "Couldn't join that board — try again.", 'error');
      return;
    }
    setGroups(prev=> prev.some(g=>g.id===group.id) ? prev : [...prev, group]);
    setActiveGroupId(group.id);
    setJoinCode('');
    track('swap_group_joined', null, user.id);
  };

  const copyCode = (code)=>{
    const done = ok => toast(ok?'Code copied!':'Could not copy — write it down.', ok?'success':'error');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(()=>done(true), ()=>done(false));
        return;
      }
    }catch(_){}
    try{
      const ta=document.createElement('textarea'); ta.value=code; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
    }catch(_){ done(false); }
  };

  /* ---- composer ---- */
  const upcomingShifts = useMemo(()=>{
    const today = todayISO();
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()+60);
    const cutoffKey = isoOf(cutoff);
    const out = [];
    Object.keys(shifts||{}).sort().forEach(dateKey=>{
      if(dateKey < today || dateKey > cutoffKey) return;
      (shifts[dateKey]||[]).forEach(s=> out.push({dateKey, shift:s}));
    });
    return out;
  },[shifts]);
  const next14Days = useMemo(()=>{
    const out = []; const d = new Date();
    for(let i=0;i<14;i++){ out.push(isoOf(d)); d.setDate(d.getDate()+1); }
    return out;
  },[]);
  const toggleAvailDate = (dk)=> setAvailDates(prev=> prev.indexOf(dk)>=0 ? prev.filter(x=>x!==dk) : [...prev, dk].sort());

  const openComposer = ()=>{
    setComposerKind('give'); setSelectedGive(null); setWantDate(''); setAvailDates([]); setComposerNote('');
    setComposerOpen(true);
  };
  const closeComposer = ()=> setComposerOpen(false);

  const submitPost = async ()=>{
    if(!activeGroupId){ toast('Pick a board first.','error'); return; }
    const payload = { group_id: activeGroupId, kind: composerKind, note: composerNote.trim().slice(0,200) || null };
    if(composerKind==='give'){
      if(!selectedGive){ toast('Pick a shift to give up.','error'); return; }
      payload.shift_date = selectedGive.dateKey;
      payload.shift_meta = { shiftType: selectedGive.shift.shiftType, hours: selectedGive.shift.hours,
        ...(selectedGive.shift.start ? {start:selectedGive.shift.start} : {}) };
    } else if(composerKind==='want'){
      if(!wantDate){ toast('Pick a date.','error'); return; }
      payload.shift_date = wantDate;
    } else {
      if(!availDates.length){ toast('Pick at least one date.','error'); return; }
      payload.avail_dates = availDates;
    }
    setPosting(true);
    const {error} = await insertSwapPost(user.id, payload);
    setPosting(false);
    if(error){ toast("Couldn't post — try again.",'error'); return; }
    toast('Posted — your unit sees it anonymously.','success');
    track('swap_posted', {kind:composerKind}, user.id);
    setComposerOpen(false);
    await refreshBoardAndMatches();
  };

  const doWithdraw = async (post)=>{
    if(!(await confirmAsync("Take this post down? Your unit will no longer see it.",{title:'Withdraw post?',confirm:'Withdraw'}))) return;
    const ok = await withdrawSwapPost(post.id);
    if(!ok){ toast("Couldn't withdraw — try again.",'error'); return; }
    track('swap_withdrawn', null, user.id);
    setPosts(prev=> prev.map(p=> p.id===post.id ? {...p, status:'withdrawn'} : p));
  };

  /* ---- suggested matches: pure computation over the current board snapshot ---- */
  const suggestions = useMemo(()=> computeSwapSuggestions(posts), [posts]);

  const doPropose = async (sugg)=>{
    if(!activeGroupId || proposingKey) return;
    setProposingKey(sugg.key);
    const {matchId, error} = await proposeSwapMatch(activeGroupId, sugg.legPostIds);
    setProposingKey(null);
    if(error){
      const msg = String((error&&error.message)||error||'');
      if(msg.indexOf('post_unavailable')>=0){
        toast('That post was just taken — refreshing.','error');
      } else {
        toast("Couldn't propose that swap — try again.",'error');
      }
      await refreshBoardAndMatches();
      return;
    }
    toast('Proposed — waiting on the others.','success');
    track('swap_match_proposed', {legs:sugg.legPostIds.length, kind:sugg.kind}, user.id);
    setProposedByMe(prev=> new Set(prev).add(matchId));
    setMatchPlans(prev=>({...prev, [matchId]:{kind:sugg.kind, outgoing:sugg.outgoing, middle:sugg.middle, incoming:sugg.incoming}}));
    await refreshBoardAndMatches();
  };

  /* After every leg accepts, pull the names + retire the traded posts. reveal_match is safe to
     call more than once for the same match (idempotent server-side), so any caller that just
     observed allAccepted can call it without extra bookkeeping.
     'match_stale' is a real backend rejection (not a bug): the RPC can now detect that this
     match's legs' posts are no longer reserved -- e.g. a concurrent decline elsewhere raced the
     accept -- and refuses to reveal. Surface it as a friendly toast and refetch so the match
     list reflects reality, never a raw error string. */
  const doReveal = async (matchId)=>{
    if(revealData[matchId] || revealing[matchId]) return;
    const lastStale = staleRevealAtRef.current[matchId];
    if(lastStale && (Date.now()-lastStale) < 15000) return;  // cooldown, see staleRevealAtRef
    setRevealing(prev=>({...prev, [matchId]:true}));
    const {reveals, error} = await revealSwapMatch(matchId);
    setRevealing(prev=>{ const n={...prev}; delete n[matchId]; return n; });
    if(error || !reveals){
      if(error){
        const msg = String((error&&error.message)||error||'');
        if(msg.indexOf('match_stale')>=0){
          staleRevealAtRef.current = {...staleRevealAtRef.current, [matchId]:Date.now()};
          toast('This match changed — refreshing.','info');
          await refreshBoardAndMatches();
        }
      }
      return;
    }
    delete staleRevealAtRef.current[matchId];
    setRevealData(prev=>({...prev, [matchId]:reveals}));
    track('swap_match_confirmed', null, user.id);
  };

  const doAccept = async (match)=>{
    const myLeg = (match.legs||[]).find(l=>l.is_my_leg);
    if(!myLeg || legBusyId) return;
    setLegBusyId(match.id);
    const ok = await acceptMatchLeg(match.id, myLeg.post_id);
    if(!ok){
      // acceptMatchLeg also returns false when RLS silently matched 0 rows (e.g. the match was
      // just declined -- "accept own leg" now requires status='proposed') -- refetch so the UI
      // reflects reality instead of leaving a stale "waiting on accept" card.
      setLegBusyId(null);
      toast("Couldn't accept — try again.",'error');
      await refreshBoardAndMatches();
      return;
    }
    track('swap_match_accepted', null, user.id);
    const {legs} = await fetchMatchDetails(match.id);
    const declined = legs && legs.some(l=>l.match_status==='declined');
    if(legs && legs.length>0 && legs.every(l=>l.accepted) && !declined) await doReveal(match.id);
    setLegBusyId(null);
    await refreshBoardAndMatches();
  };

  const doDecline = async (match)=>{
    if(legBusyId) return;
    if(!(await confirmAsync("Decline this proposed swap? The others involved will see it fell through.",{title:'Decline swap?',confirm:'Decline',danger:true}))) return;
    setLegBusyId(match.id);
    const ok = await declineSwapMatch(match.id);
    setLegBusyId(null);
    if(!ok){ toast("Couldn't decline — try again.",'error'); return; }
    track('swap_match_declined', null, user.id);
    await refreshBoardAndMatches();
  };

  // Catches matches that became fully-accepted from someone ELSE's accept, discovered on the
  // next 15s poll rather than through my own doAccept — reveal as soon as we notice, same as
  // the explicit path. doReveal no-ops if already revealed/in-flight, so this is safe to run
  // on every matches update. Gated on the server-reported match status (not just leg
  // acceptance) — "all legs accepted" can be stale/raced against a decline that landed
  // elsewhere, and reveal_match itself now refuses anything that isn't proposed/confirmed, so
  // this check is defense-in-depth against calling (and toasting an error for) a doomed reveal.
  useEffect(()=>{
    matches.forEach(m=>{
      const legs = m.legs||[];
      if(m.status==='declined') return;
      if(legs.length>0 && legs.every(l=>l.accepted)) doReveal(m.id);
    });
    // eslint-disable-next-line
  },[matches]);

  /* Shared by the leg-list render, buildSwapPlanText, and doApplyPlan: which give leg is MY
     incoming shift, which is my outgoing one, and the match's shape (see classifyMatchShape).
     handoff/pickup/trade are derived straight from the legs -- unambiguous by construction, no
     resolution needed. Only cycle3 (and any unrecognized shape) needs resolveIncomingGive, and
     that's the ONLY case where an unresolved incoming should block the destructive half of a
     plan -- for handoff there IS no incoming (nothing to add), for pickup there IS no outgoing
     (nothing to remove), and neither of those is ambiguity. */
  const resolveApplyPlan = (match)=>{
    const legs = match.legs||[];
    const myLeg = legs.find(l=>l.is_my_leg);
    const shape = classifyMatchShape(legs);
    if(shape==='handoff') return {shape, outgoing: myLeg, incoming: null};
    if(shape==='pickup') return {shape, outgoing: null, incoming: legs.find(l=>l.kind==='give' && !l.is_my_leg) || null};
    if(shape==='trade'){
      const outgoing = myLeg && myLeg.kind==='give' ? myLeg : null;
      const incoming = legs.find(l=>l.kind==='give' && !l.is_my_leg) || null;
      return {shape, outgoing, incoming};
    }
    // cycle3 / unknown: resolve via the in-session suggestion when we proposed it, else recompute.
    const outgoing = myLeg && myLeg.kind==='give' ? myLeg : null;
    const plan = matchPlans[match.id];
    let incoming = null;
    if(plan && plan.incoming){
      incoming = legs.find(l=>l.post_id===plan.incoming.id) || plan.incoming;
    } else {
      incoming = resolveIncomingGive(legs, posts.filter(p=>p.is_mine));
    }
    return {shape, outgoing, incoming};
  };

  /* Builds the plain-text swap plan for copy/paste into a text or the unit's official swap
     process. Wage-free by construction — dates, shift labels, hours only.
     Trade/3-way-shuffle matches are ALL give-kind legs -- without extra work every leg reads as
     a flat, unrelated "X gives up ..." with no statement of what I actually get back. Resolve
     my incoming leg (same logic as "Apply to my calendar") and fold "→ you get ..." onto my own
     give line, plus a closing "Net result" summary, so the plan is unambiguous when read cold
     by a manager who wasn't looking at the app. */
  const buildSwapPlanText = (match, names)=>{
    const nameOf = (postId)=>{
      const row = (names||[]).find(n=>n.post_id===postId);
      return (row && row.display_name) || 'A colleague';
    };
    const describeGive = post => post ? `${fmtDateShort(post.shift_date)} — ${giveMetaLine(post.shift_meta, differentials)}` : '';
    const {outgoing, incoming} = resolveApplyPlan(match);
    const lines = ['Shift swap plan:'];
    (match.legs||[]).forEach(l=>{
      const who = l.is_my_leg ? 'You' : nameOf(l.post_id);
      if(l.kind==='give'){
        if(l.is_my_leg && incoming){
          lines.push(`${who} give up ${fmtDateShort(l.shift_date)} — ${giveMetaLine(l.shift_meta, differentials)} → you get ${nameOf(incoming.post_id)}'s ${describeGive(incoming)}.`);
        } else {
          lines.push(`${who} give${l.is_my_leg?'':'s'} up ${fmtDateShort(l.shift_date)} — ${giveMetaLine(l.shift_meta, differentials)}.`);
        }
      } else if(l.kind==='want'){
        lines.push(`${who} ${l.is_my_leg?'get':'gets'} a shift on ${fmtDateShort(l.shift_date)}.`);
      } else {
        lines.push(`${who} ${l.is_my_leg?'pick up':'picks up'} a shift from the dates offered.`);
      }
    });
    if(outgoing && incoming){
      lines.push(`Net result: you swap your ${fmtDateShort(outgoing.shift_date)} shift for ${nameOf(incoming.post_id)}'s ${fmtDateShort(incoming.shift_date)} shift.`);
    }
    lines.push('Please confirm through your unit\'s normal swap process.');
    return lines.join('\n');
  };

  const copyPlan = (text)=>{
    const done = ok => toast(ok?'Swap plan copied!':'Could not copy — write it down.', ok?'success':'error');
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(false));
        return;
      }
    }catch(_){}
    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);
    }catch(_){ done(false); }
  };

  /* "Apply to my calendar": removes the shift I gave (matched by date + shift_meta) and/or adds
     the shift I'm receiving, resolved either from the in-session suggestion (matchPlans) or —
     if that's gone (reload / someone else proposed it) — recomputed via resolveIncomingGive.
     handoff is remove-only (no incoming leg exists), pickup is add-only (no outgoing leg
     exists) -- both are unambiguous by shape, see classifyMatchShape. Only trade/cycle3 need
     BOTH halves resolved; the button that calls this is hidden whenever resolveApplyPlan can't
     resolve what a given shape requires (canApply, below) -- this guard is defense-in-depth
     against calling it anyway. Idempotent either way: an identical shift already present on the
     target date is never duplicated, and removing an already-absent shift is a no-op with a
     gentle "already" toast instead of silently doing nothing. */
  const doApplyPlan = (match)=>{
    if(appliedMatchIds.has(match.id)) return;
    const {shape, outgoing, incoming} = resolveApplyPlan(match);
    if(shape==='handoff' && !outgoing){ toast('Nothing to apply to your calendar.','info'); return; }
    if(shape==='pickup' && !incoming){ toast('Nothing to apply to your calendar.','info'); return; }
    if((shape==='trade' || shape==='cycle3' || shape==='unknown') && (!outgoing || !incoming)){
      toast("Can't tell which shift you're receiving — copy the plan instead.",'info');
      return;
    }

    const updates = {};   // dateKey -> next shift array for that day
    const sameMeta = (s,meta)=> s.shiftType===meta.shiftType && Number(s.hours)===Number(meta.hours) && (s.start||'')===((meta&&meta.start)||'');
    let removed = false, added = false;
    if(outgoing && outgoing.shift_meta){
      const dk = outgoing.shift_date;
      const arr = (updates[dk] || shifts[dk] || []).slice();
      const idx = arr.findIndex(s=>sameMeta(s, outgoing.shift_meta));
      if(idx>=0){ arr.splice(idx,1); removed = true; }
      updates[dk] = arr;
    }
    if(incoming && incoming.shift_meta){
      const dk = incoming.shift_date;
      const arr = (updates[dk] || shifts[dk] || []).slice();
      if(!arr.some(s=>sameMeta(s, incoming.shift_meta))){
        const meta = incoming.shift_meta;
        arr.push({id:Date.now()+Math.random(), shiftType:meta.shiftType, hours:meta.hours, bonusType:'none', customBonus:0, ...(meta.start?{start:meta.start}:{})});
        added = true;
      }
      updates[dk] = arr;
    }
    Object.keys(updates).forEach(dk=> saveDayShifts(dk, updates[dk], dayEvents[dk]||[], notes[dk]||''));
    setAppliedMatchIds(prev=> new Set(prev).add(match.id));
    let msg;
    if(shape==='handoff') msg = removed ? 'Removed from your calendar.' : 'Already off your calendar.';
    else if(shape==='pickup') msg = added ? 'Added to your calendar.' : 'Already on your calendar.';
    else msg = 'Applied to your calendar.';
    toast(msg,'success');
    track('swap_plan_applied', null, user.id);
  };

  const activeGroup = groups.find(g=>g.id===activeGroupId);
  const groupName = activeGroup ? activeGroup.name : 'your unit';
  const openPosts = useMemo(()=> posts.filter(p=>p.status==='open')
    .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at)), [posts]);

  const Header = <div className="sheet-h"><div className="t">Shift swaps</div><button className="back" onClick={onClose} aria-label="Close">{Ic.x}</button></div>;

  /* ---- gate: signed out ---- */
  if(!user){
    return (
      <div className="scrim" onClick={onClose}>
        <div className="sheet" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Shift swaps">
          <div className="grab"></div>
          {Header}
          <div style={{textAlign:'center',padding:'32px 12px'}}>
            <div style={{fontSize:36,marginBottom:12}} aria-hidden="true">🔄</div>
            <div className="display" style={{fontWeight:700,fontSize:18,marginBottom:8}}>Trade shifts with your unit</div>
            <div style={{fontSize:13.5,color:'var(--muted)',lineHeight:1.5,marginBottom:20}}>Post shifts you want to give up or pick up — anonymously, until everyone accepts a swap.</div>
            <button className="btn btn-primary" onClick={onOpenAuth}>Sign in to use swaps</button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Shift swaps">
        <div className="grab"></div>
        {Header}

        {loading && <div style={{textAlign:'center',padding:'40px 12px',color:'var(--muted-2)',fontSize:13.5}}>Loading…</div>}

        {!loading && loadError &&
          <div style={{textAlign:'center',padding:'32px 12px'}}>
            <div className="display" style={{fontWeight:700,fontSize:17,marginBottom:8}}>Couldn't load swaps</div>
            <div style={{fontSize:13.5,color:'var(--muted)',marginBottom:18}}>Check your connection and try again.</div>
            <button className="btn btn-ghost" onClick={()=>loadInitial(user.id)}>Retry</button>
          </div>}

        {!loading && !loadError && tablesMissing &&
          <div style={{textAlign:'center',padding:'32px 12px'}}>
            <div style={{fontSize:36,marginBottom:12}} aria-hidden="true">🛠️</div>
            <div className="display" style={{fontWeight:700,fontSize:17,marginBottom:8}}>The swap board isn't set up yet</div>
            <div style={{fontSize:13.5,color:'var(--muted)',lineHeight:1.5,marginBottom:18}}>Check back soon — we're still setting this up.</div>
            <button className="btn btn-ghost" onClick={onClose}>Close</button>
          </div>}

        {!loading && !loadError && !tablesMissing && !profile &&
          <div>
            <div className="display" style={{fontWeight:700,fontSize:18,lineHeight:1.3,marginBottom:8}}>What should colleagues call you when a swap is confirmed?</div>
            <div style={{fontSize:13,color:'var(--muted)',lineHeight:1.5,marginBottom:16}}>Only shown AFTER everyone accepts a swap. Posts are anonymous until then.</div>
            <div className="inp" style={{marginBottom:14}}>
              <input value={dnDraft} onChange={e=>setDnDraft(e.target.value.slice(0,40))} placeholder="e.g. Sam R." maxLength={40} autoFocus
                aria-label="Display name" onKeyDown={e=>{ if(e.key==='Enter') saveDisplayName(); }}/>
            </div>
            <button className="btn btn-primary" disabled={savingProfile} onClick={saveDisplayName}>{savingProfile?'Saving…':'Continue'}</button>
          </div>}

        {!loading && !loadError && !tablesMissing && profile && justCreated &&
          <div style={{textAlign:'center',padding:'8px 4px 4px'}}>
            <div className="display" style={{fontWeight:700,fontSize:19,marginBottom:8}}>Board created!</div>
            <div style={{fontSize:13.5,color:'var(--muted)',marginBottom:18}}>Share this code with your unit so they can join.</div>
            <div className="display num" style={{fontWeight:800,fontSize:34,letterSpacing:'4px',background:'var(--indigo-soft)',color:'var(--indigo-ink)',borderRadius:16,padding:'18px 12px',marginBottom:14}}>{justCreated.invite_code}</div>
            <button className="btn btn-ghost" style={{marginBottom:10}} onClick={()=>copyCode(justCreated.invite_code)}>Copy code</button>
            <button className="btn btn-primary" onClick={()=>setJustCreated(null)}>Continue to board</button>
          </div>}

        {!loading && !loadError && !tablesMissing && profile && !justCreated && groups.length===0 &&
          <div>
            <div className="card" style={{marginBottom:14}}>
              <h3>Create your unit's board</h3>
              <div className="inp" style={{marginBottom:10}}>
                <input value={createName} onChange={e=>setCreateName(e.target.value.slice(0,60))} placeholder="e.g. 4 North Nights" aria-label="Board name"/>
              </div>
              <button className="btn btn-primary" disabled={creating} onClick={doCreateGroup}>{creating?'Creating…':'Create board'}</button>
            </div>
            <div className="card">
              <h3>Join with a code</h3>
              <div className="inp" style={{marginBottom:10}}>
                <input value={joinCode} onChange={e=>setJoinCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6))}
                  placeholder="ABC123" maxLength={6} style={{textTransform:'uppercase',letterSpacing:'2px',fontWeight:700,textAlign:'center'}} aria-label="Invite code"/>
              </div>
              <button className="btn btn-ghost" disabled={joining} onClick={doJoinGroup}>{joining?'Joining…':'Join board'}</button>
            </div>
          </div>}

        {!loading && !loadError && !tablesMissing && profile && !justCreated && groups.length>0 && !composerOpen &&
          <div>
            {groups.length>1 &&
              <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
                {groups.map(g=>
                  <button key={g.id} className={'chip-sel'+(g.id===activeGroupId?' on':'')} aria-pressed={g.id===activeGroupId} style={{minHeight:44}} onClick={()=>setActiveGroupId(g.id)}>{g.name}</button>)}
              </div>}
            {!activeGroupId &&
              <div className="card" style={{textAlign:'center',padding:'26px 18px'}}>
                <div style={{fontWeight:700,fontSize:15}}>Choose a board above</div>
              </div>}
            {activeGroupId && <React.Fragment>
              <div style={{display:'flex',justifyContent:'flex-end',marginBottom:12}}>
                <button className="btn btn-soft btn-sm" style={{minHeight:44}} onClick={openComposer}>+ Post to the board</button>
              </div>

              {matches.length>0 && <div style={{marginBottom:18}}>
                <div className="sec-lab">YOUR MATCHES</div>
                {matches.map(m=>{
                  const legs = m.legs||[];
                  const myLeg = legs.find(l=>l.is_my_leg);
                  const total = legs.length;
                  const acceptedN = legs.filter(l=>l.accepted).length;
                  const declined = m.status==='declined';
                  // "every leg accepted" can be a stale/raced read against a decline that just
                  // landed elsewhere -- never treat a declined match as confirmed even if its
                  // last-known legs all read accepted.
                  const allAccepted = !declined && total>0 && acceptedN===total;
                  const confirmed = !declined && (m.status==='confirmed' || allAccepted);
                  const reveal = revealData[m.id];
                  const busy = legBusyId===m.id;
                  const nameFor = (postId)=>{
                    const row = (reveal||[]).find(r=>r.post_id===postId);
                    return row ? row.display_name : null;
                  };
                  const planText = confirmed && reveal ? buildSwapPlanText(m, reveal) : null;
                  const applyPlan = resolveApplyPlan(m);
                  // handoff needs only its outgoing leg (nothing to add); pickup needs only its
                  // incoming leg (nothing to remove) -- neither of those is ambiguity, it's the
                  // shape of the match. trade/cycle3 need BOTH halves resolved before the
                  // destructive "remove my given shift" half is ever allowed without also adding
                  // the shift I was promised -- copy-the-plan still works either way.
                  const canApply = applyPlan.shape==='handoff' ? !!applyPlan.outgoing
                    : applyPlan.shape==='pickup' ? !!applyPlan.incoming
                    : !!(applyPlan.outgoing && applyPlan.incoming);
                  const applyLabel = applyPlan.shape==='handoff' ? 'Remove from my calendar'
                    : applyPlan.shape==='pickup' ? 'Add to my calendar'
                    : 'Apply to my calendar';
                  const appliedLabel = applyPlan.shape==='handoff' ? 'Removed from calendar ✓'
                    : applyPlan.shape==='pickup' ? 'Added to calendar ✓'
                    : 'Applied to calendar ✓';
                  return (
                    <div className="swap-card" key={m.id}>
                      <div className="kicker">
                        {declined ? 'DECLINED' : confirmed ? 'CONFIRMED' : `WAITING ON ${total-acceptedN} OF ${total} TO ACCEPT`}
                        {proposedByMe.has(m.id) && !declined && ' · YOU PROPOSED THIS'}
                      </div>
                      {legs.map(l=>{
                        // Trade/3-way-shuffle legs are all "give" kind -- annotate MY give leg
                        // with what I get back so this reads as a swap, not an unrelated give-up,
                        // before names are revealed (dates/meta only, no identities pre-reveal).
                        const showsIncoming = l.is_my_leg && l.kind==='give' && !confirmed && applyPlan.incoming;
                        return (
                          <div key={l.post_id} className="swap-step" style={{padding:'4px 0', fontWeight:l.is_my_leg?700:400, opacity: l.accepted?1:.75}}>
                            {l.is_my_leg ? 'You' : (nameFor(l.post_id) || 'A colleague')}
                            {' '}
                            {l.kind==='give' && `${l.is_my_leg?'give':'gives'} up ${fmtDateShort(l.shift_date)} · ${giveMetaLine(l.shift_meta, differentials)}`}
                            {l.kind==='want' && `${l.is_my_leg?'want':'wants'} a shift ${fmtDateShort(l.shift_date)}`}
                            {l.kind==='avail' && `${l.is_my_leg?'could':'could'} work ${fmtAvailDates(l.avail_dates)}`}
                            {showsIncoming && ` → you get ${fmtDateShort(applyPlan.incoming.shift_date)} · ${giveMetaLine(applyPlan.incoming.shift_meta, differentials)}`}
                            {l.accepted ? ' ✓' : ' (not yet accepted)'}
                          </div>
                        );
                      })}
                      {!declined && !confirmed && <div style={{display:'flex',gap:10,marginTop:12}}>
                        {myLeg && !myLeg.accepted &&
                          <button className="btn btn-primary btn-sm" style={{minHeight:44}} disabled={busy} onClick={()=>doAccept(m)}>{busy?'Accepting…':'Accept'}</button>}
                        <button className="btn btn-ghost btn-sm" style={{minHeight:44}} disabled={busy} onClick={()=>doDecline(m)}>Decline</button>
                      </div>}
                      {confirmed && !reveal && <div style={{fontSize:12.5,color:'var(--muted-2)',marginTop:8}}>Revealing names…</div>}
                      {confirmed && reveal && <React.Fragment>
                        <div className="swap-plan-text">{planText}</div>
                        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                          <button className="btn btn-soft btn-sm" style={{minHeight:44}} onClick={()=>copyPlan(planText)}>Copy swap plan</button>
                          {canApply &&
                            <button className="btn btn-ghost btn-sm" style={{minHeight:44}} disabled={appliedMatchIds.has(m.id)} onClick={()=>doApplyPlan(m)}>
                              {appliedMatchIds.has(m.id) ? appliedLabel : applyLabel}
                            </button>}
                          {!canApply &&
                            <div style={{fontSize:12,color:'var(--muted-2)'}}>Copy the plan above to update your calendar manually.</div>}
                        </div>
                      </React.Fragment>}
                    </div>
                  );
                })}
              </div>}

              {suggestions.length>0 && <div style={{marginBottom:18}}>
                <div className="sec-lab">SUGGESTED FOR YOU</div>
                {suggestions.map(s=>{
                  const describeLeg = post => `${fmtDateShort(post.shift_date)} · ${giveMetaLine(post.shift_meta, differentials)}`;
                  const busy = proposingKey===s.key;
                  return (
                    <div className="swap-card" key={s.key}>
                      <div className="kicker">
                        {s.kind==='pickup' && 'PICK UP'}
                        {s.kind==='handoff' && 'HAND OFF'}
                        {s.kind==='trade' && 'TRADE'}
                        {s.kind==='cycle3' && '3-WAY SHUFFLE'}
                      </div>
                      {s.kind==='pickup' && <div className="swap-step">Pick up {describeLeg(s.incoming)}</div>}
                      {s.kind==='handoff' && <div className="swap-step">Hand off {describeLeg(s.outgoing)}</div>}
                      {s.kind==='trade' && <div className="swap-step">You give <b>{describeLeg(s.outgoing)}</b> → you get <b>{describeLeg(s.incoming)}</b></div>}
                      {s.kind==='cycle3' && <React.Fragment>
                        <div className="swap-step">1. You give {describeLeg(s.outgoing)}</div>
                        <div className="swap-step">2. A colleague gives {describeLeg(s.middle)}</div>
                        <div className="swap-step">3. You get {describeLeg(s.incoming)}</div>
                      </React.Fragment>}
                      <button className="btn btn-primary btn-sm" style={{marginTop:10,minHeight:44}} disabled={busy} onClick={()=>doPropose(s)}>{busy?'Proposing…':'Propose'}</button>
                    </div>
                  );
                })}
              </div>}
              {suggestions.length===0 && matches.length===0 && !boardLoading &&
                <div style={{fontSize:12.5,color:'var(--muted-2)',marginBottom:14}}>No matches yet — more posts, more trades.</div>}

              {boardLoading && posts.length===0 &&
                <div style={{textAlign:'center',padding:'20px',color:'var(--muted-2)',fontSize:13}}>Loading board…</div>}
              {!boardLoading && openPosts.length===0 &&
                <div className="card" style={{textAlign:'center',padding:'26px 18px'}}>
                  <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>Nothing posted yet</div>
                  <div style={{fontSize:13,color:'var(--muted)',marginBottom:14}}>Be the first to post to your unit's board.</div>
                  <button className="btn btn-soft btn-sm" onClick={openComposer}>+ Post to the board</button>
                </div>}
              {openPosts.map(p=>(
                <div className="row-item" key={p.id} style={{flexDirection:'column',alignItems:'stretch',gap:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:14}}>
                        {p.kind==='give' && `Giving up · ${fmtDateShort(p.shift_date)}`}
                        {p.kind==='want' && `Wants a shift · ${fmtDateShort(p.shift_date)}`}
                        {p.kind==='avail' && `Could work · ${fmtAvailDates(p.avail_dates)}`}
                      </div>
                      {p.kind==='give' && p.shift_meta &&
                        <div style={{fontSize:12.5,color:'var(--muted)',marginTop:2}}>{giveMetaLine(p.shift_meta, differentials)}</div>}
                      {!p.is_mine && <div style={{fontSize:12,color:'var(--muted-2)',marginTop:4}}>Someone on {groupName}</div>}
                      {p.note && <div style={{fontSize:13,color:'var(--ink)',marginTop:6}}>"{p.note}"</div>}
                    </div>
                    {p.is_mine && <span className="tag auto" style={{flex:'0 0 auto'}}>You</span>}
                  </div>
                  {p.is_mine && <button className="danger-link" style={{alignSelf:'flex-start',minHeight:44,display:'inline-flex',alignItems:'center'}} onClick={()=>doWithdraw(p)}>Withdraw</button>}
                </div>
              ))}
            </React.Fragment>}
          </div>}

        {!loading && !loadError && !tablesMissing && profile && !justCreated && groups.length>0 && composerOpen &&
          <div>
            <div className="sec-lab">WHAT DO YOU NEED?</div>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16}}>
              {[['give','Give up a shift'],['want','Want a shift'],['avail','Available to work']].map(([k,l])=>
                <button key={k} className={'chip-sel'+(composerKind===k?' on':'')} aria-pressed={composerKind===k} style={{minHeight:44,justifyContent:'flex-start'}} onClick={()=>setComposerKind(k)}>{l}</button>)}
            </div>

            {composerKind==='give' &&
              (upcomingShifts.length===0
                ? <div className="hint" style={{fontSize:13,color:'var(--muted-2)',marginBottom:16}}>No upcoming shifts in the next 60 days — log one on the Planner first.</div>
                : <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:16,maxHeight:260,overflowY:'auto'}}>
                    {upcomingShifts.map(({dateKey,shift})=>{
                      const sel = selectedGive && selectedGive.dateKey===dateKey && selectedGive.shift.id===shift.id;
                      return (
                        <button key={dateKey+'-'+shift.id} className={'chip-sel'+(sel?' on':'')} aria-pressed={sel} style={{minHeight:44,justifyContent:'flex-start',textAlign:'left'}}
                          onClick={()=>setSelectedGive({dateKey,shift})}>
                          <span><b>{fmtDateShort(dateKey)}</b> — {giveMetaLine({shiftType:shift.shiftType,hours:shift.hours,start:shift.start}, differentials)}</span>
                        </button>
                      );
                    })}
                  </div>)}

            {composerKind==='want' &&
              <label className="field">
                <span className="lab">Date you want a shift</span>
                <div className="inp"><input type="date" value={wantDate} min={todayISO()} onChange={e=>setWantDate(e.target.value)} aria-label="Wanted date"/></div>
              </label>}

            {composerKind==='avail' &&
              <div style={{marginBottom:16}}>
                <div className="sec-lab">TAP THE DAYS YOU COULD WORK</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                  {next14Days.map(dk=>
                    <button key={dk} className={'chip-sel'+(availDates.indexOf(dk)>=0?' on':'')} aria-pressed={availDates.indexOf(dk)>=0} style={{minHeight:44,padding:'8px 10px',fontSize:12}}
                      onClick={()=>toggleAvailDate(dk)}>{fmtDateShort(dk)}</button>)}
                </div>
              </div>}

            <div className="sec-lab">NOTE (OPTIONAL)</div>
            <div className="inp" style={{marginBottom:18}}>
              <input value={composerNote} onChange={e=>setComposerNote(e.target.value.slice(0,200))} placeholder="e.g. 'need Tue off for an appointment'" maxLength={200} aria-label="Note"/>
            </div>

            <div style={{display:'flex',gap:10}}>
              <button className="back" style={{width:44,height:44}} onClick={closeComposer} aria-label="Back to board">‹</button>
              <button className="btn btn-primary" style={{flex:1}} disabled={posting} onClick={submitPost}>{posting?'Posting…':'Post to the board'}</button>
            </div>
          </div>}
      </div>
    </div>
  );
}

/* ============== ONBOARDING ============== */
function Onboarding(props){
  const {obStep,setObStep,name,setName,baseRate,setBaseRate,num,differentials,setDiff,
    federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
    pretaxDeductions,setPretax,posttaxDeductions,setPosttax,onPaystub,parsing,finish,sampleNet}=props;

  const upd=(k,f,v)=>setDiff({...differentials,[k]:{...differentials[k],[f]: f==='amount'?(parseFloat(v)||0):v}});
  const tog=k=>setDiff({...differentials,[k]:{...differentials[k],active:!differentials[k].active}});

  /* 0 — welcome */
  if(obStep===0) return (
    <div className="ob">
      <div className="brand"><span className="b-dot"></span>scrubpay</div>
      <div className="spacer"></div>
      <span className="pill" style={{marginBottom:16}}>For bedside nurses</span>
      <div className="display" style={{fontWeight:700,fontSize:28,lineHeight:1.18}}>Know your real take-home before you pick up the shift.</div>
      <div className="help">Nights, weekends, holidays, that charge bonus — we do the messy math so the number's never a surprise.</div>
      <div className="hero" style={{marginTop:22}}>
        <div className="lbl">Sample · 72 hrs this period</div>
        <div className="num" style={{fontSize:38,margin:'6px 0 4px'}}>$3,951</div>
        <div style={{fontSize:12,color:'#7E8290',fontWeight:500}}>estimated take-home</div>
      </div>
      <div className="spacer"></div>
      <label className="btn btn-primary" style={{marginBottom:10,position:'relative'}}>{parsing?'Reading paystub…':'Scan a paystub'}<input type="file" accept=".pdf" onChange={onPaystub} disabled={parsing} style={{display:'none'}}/></label>
      <button className="btn btn-ghost" onClick={()=>setObStep(1)}>Set it up myself</button>
      <div style={{textAlign:'center',fontSize:12,color:'var(--muted-2)',marginTop:14,fontWeight:500}}>Takes about 2 minutes</div>
    </div>
  );

  const Head = ({step,label})=>(
    <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:20}}>
      <button className="back" onClick={()=>setObStep(obStep-1)}>‹</button>
      <div className="prog"><i style={{width:(step*25)+'%'}}></i></div>
    </div>
  );

  /* 1 — base rate */
  if(obStep===1) return (
    <div className="ob">
      <Head step={1}/>
      <div className="eyebrow">STEP 1 OF 4 · YOUR PAY</div>
      <div className="q">What's your base hourly rate?</div>
      <div className="help">The rate before any differentials or bonuses. On your paystub it's usually listed as "Pay Rate."</div>
      <div className="inp pre" style={{marginTop:28}}>
        <span className="pfx" style={{fontSize:22}}>$</span>
        <NumInput value={baseRate} onCommit={setBaseRate} min={0} ariaLabel="Base hourly rate" style={{fontSize:32,fontWeight:700,padding:'18px 14px 18px 34px',fontFamily:"'Bricolage Grotesque'"}}/>
        <span className="sfx">/ hr</span>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" onClick={()=>setObStep(2)}>Continue</button>
    </div>
  );

  /* 2 — differentials */
  if(obStep===2) return (
    <div className="ob">
      <Head step={2}/>
      <div className="eyebrow">STEP 2 OF 4 · DIFFERENTIALS</div>
      <div className="q">How does your pay change by shift?</div>
      <div className="help">We pre-filled common amounts. Toggle what applies and tweak to your contract.</div>
      <div style={{marginTop:18}}>
        {Object.entries(differentials).filter(([k])=>k!=='overtime').map(([k,d])=>(
          <div className={'drow'+(d.active?'':' off')} key={k}>
            <i style={{width:10,height:10,borderRadius:'50%',background:d.color||'#8A93A6',flex:'0 0 auto'}}></i>
            <span className="nm">{d.name}</span>
            <span className="amt num">{d.type==='multiplier'? d.amount+'× rate' : '+$'+d.amount.toFixed(2)+'/hr'}</span>
            <button type="button" role="switch" aria-checked={d.active} aria-label={d.name} className={'tg'+(d.active?' on':'')} onClick={()=>tog(k)}><div className="knob"></div></button>
          </div>
        ))}
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" onClick={()=>setObStep(3)}>Continue</button>
    </div>
  );

  /* 3 — taxes */
  if(obStep===3) return (
    <div className="ob">
      <Head step={3}/>
      <div className="eyebrow">STEP 3 OF 4 · TAXES & DEDUCTIONS</div>
      <div className="q">Last thing — taxes & take-outs.</div>
      <div className="help">We estimated these from typical nurse withholdings. Adjust anything you know.</div>
      <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:10}}>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Federal income tax</div><span className="tag est">ESTIMATED</span></div>
          <div className="inp suf" style={{width:90}}><NumInput value={federalTaxRate} onCommit={setFederal} min={0} step="0.1" ariaLabel="Federal income tax percent" style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>State tax</div><span className="tag est">ESTIMATED</span></div>
          <div className="inp suf" style={{width:90}}><NumInput value={stateTaxRate} onCommit={setState} min={0} step="0.1" ariaLabel="State tax percent" style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>FICA</div><span className="tag auto">AUTO 7.65%</span></div>
          <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:18}}>7.65%</div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Pre-tax · 401k, health</div><div style={{fontSize:11.5,color:'var(--muted-2)'}}>per pay period</div></div>
          <div className="inp pre" style={{width:110}}><span className="pfx">$</span><NumInput value={pretaxDeductions} onCommit={setPretax} min={0} step="1" ariaLabel="Pre-tax deductions per pay period" style={{textAlign:'right',fontWeight:700}}/></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Post-tax · union dues</div><div style={{fontSize:11.5,color:'var(--muted-2)'}}>per pay period</div></div>
          <div className="inp pre" style={{width:110}}><span className="pfx">$</span><NumInput value={posttaxDeductions} onCommit={setPosttax} min={0} step="1" ariaLabel="Post-tax deductions per pay period" style={{textAlign:'right',fontWeight:700}}/></div></div>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" onClick={()=>setObStep(4)}>See my estimate</button>
    </div>
  );

  /* 4 — done */
  const sample = sampleNet();
  return (
    <div className="ob dark" style={{alignItems:'center',textAlign:'center'}}>
      <div className="spacer"></div>
      <div style={{width:74,height:74,borderRadius:'50%',background:'var(--mint)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 0 12px rgba(52,211,153,.14)'}}>{Ic.check}</div>
      <div className="display" style={{fontWeight:700,fontSize:27,marginTop:26}}>{name&&name!=='there'?`You're all set, ${name}.`:"You're all set."}</div>
      <div className="help" style={{color:'#9A9DAB'}}>Based on a typical two-week schedule, here's what you'd take home:</div>
      <div style={{width:'100%',background:'var(--ink-2)',borderRadius:22,padding:24,marginTop:24}}>
        <div style={{fontSize:12,fontWeight:600,color:'#9A9DAB'}}>Projected take-home</div>
        <div className="num" style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:54,color:'var(--mint)',letterSpacing:'-.03em',margin:'8px 0',lineHeight:1}}>{fmt(sample.net)}</div>
        <div style={{fontSize:13,color:'#7E8290',fontWeight:500}}>{sample.hours} hrs · 6 shifts · gross {fmt(sample.gross)}</div>
      </div>
      <div style={{width:'100%',marginTop:14}}>
        <div className="field" style={{margin:0,textAlign:'left'}}>
          <div className="inp"><input placeholder="What should we call you?" value={name==='there'?'':name} onChange={e=>setName(e.target.value||'there')} style={{background:'#21242F',border:'1.5px solid #2E3140',color:'#fff'}}/></div>
        </div>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={finish}>Go to my planner</button>
      <button className="btn" style={{width:'100%',color:'#9A9DAB'}} onClick={()=>setObStep(1)}>Edit my setup</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/><Toaster/><ConfirmHost/></ErrorBoundary>);
</script>
</body>
</html>
