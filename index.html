/* ---------- Numeric input ----------
   Keeps a raw string while focused so select-all-then-clear (the normal mobile edit
   gesture) doesn't snap the value to 0 mid-edit. Commits a parsed + clamped number on
   blur/Enter. inputMode='decimal' surfaces the 10-key pad on iOS. */
function NumInput({value,onCommit,min,max,step='0.01',placeholder,style,className,ariaLabel,id}){
  const [focused,setFocused] = useState(false);
  const [raw,setRaw] = useState('');
  const display = focused ? raw : (value===''||value==null ? '' : String(value));
  const commit = (r)=>{
    const t = (r==null?'':String(r)).trim();
    if(t===''){ onCommit(min!=null?min:0); return; }
    let n = parseFloat(t);
    if(!isFinite(n)){ onCommit(value); return; }   // garbage -> revert to last good value
    if(min!=null && n<min) n=min;
    if(max!=null && n>max) n=max;
    onCommit(n);
  };
  return <input type="number" inputMode="decimal" step={step} min={min} max={max}
    id={id} aria-label={ariaLabel} className={className} style={style} placeholder={placeholder}
    value={display}
    onFocus={()=>{ setRaw(value===''||value==null?'':String(value)); setFocused(true); }}
    onChange={e=>setRaw(e.target.value)}
    onBlur={()=>{ setFocused(false); commit(raw); }}
    onKeyDown={e=>{ if(e.key==='Enter') e.currentTarget.blur(); }} />;
}

/* Formats a "HH:MM" 24h string to a short 12h label, e.g. "19:00" -> "7:00 PM". */
function fmtTime12(t){
  if(!t || !TIME_RE.test(t)) return null;
  const [h,m] = t.split(':').map(Number);
  const ap = h>=12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${ap}`;
}

/* ---------- Add Shift Sheet ---------- */
function AddShiftSheet({dateKey,days,keyOf,differentials,existing,existingEvents,existingNote,baseRate,keepRatio,templates,onSaveTemplate,onDeleteTemplate,userId,onClose,onSave}){
  const [list,setList] = useState(existing.map(s=>({...s})));
  const [shiftType,setType] = useState('night');
  const [hours,setHours] = useState(12);
  const [bonusType,setBonus] = useState('none');
  const [customBonus,setCustomBonus] = useState(0);
  const [start,setStart] = useState('');   // optional "HH:MM" start time for the shift being configured
  const [events,setEvents] = useState((existingEvents||[]).map(e=>({...e})));   // "also on this day" life events
  const [note,setNote] = useState(existingNote||'');
  const [dirty,setDirty] = useState(false);   // list/events/note changed vs incoming props — used to save-on-dismiss
  const [savingTpl,setSavingTpl] = useState(false);   // inline "save as template" name input open
  const [tplName,setTplName] = useState('');
  // True whenever shiftType/hours/bonusType/customBonus/start have been touched since the last
  // add() — reset to false there. Starts true: until add() actually runs, `list` may only hold
  // pre-existing entries the user hasn't touched, so there's no "just-added" entry to trust yet.
  // Lets doSaveTemplate() tell "just-added, controls still reflect it" apart from "reconfigured
  // after adding", instead of guessing from shiftType/hours equality (which missed bonus/start-only
  // edits and silently captured stale values).
  const configDirtySinceAdd = useRef(true);

  const active = Object.entries(differentials).filter(([_,d])=>d.active);
  const dt = days.find(d=>keyOf(d)===dateKey) || new Date(dateKey);
  const dateLabel = dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const draft = {shiftType,hours,bonusType,customBonus};
  const previewGross = shiftGross(baseRate, differentials[shiftType], draft);
  const previewNet = Math.round(previewGross*keepRatio);
  const ptoEvent = events.find(e=>e.kind==='pto');

  // A configured-but-not-yet-added shift, clamped to a legal hours range (no blocking alert).
  const draftShift = ()=>{ const o={id:Date.now(), shiftType, hours:Math.min(24,Math.max(0.1, hours||0.1)), bonusType, customBonus}; if(start) o.start=start; return o; };
  const add = ()=>{ setList([...list, draftShift()]); setBonus('none'); setStart(''); setDirty(true); configDirtySinceAdd.current=false; };
  const remove = id=>{ setList(list.filter(s=>s.id!==id)); setDirty(true); };
  // Day events (PTO/education/appt/off) toggle: one entry per kind, tap again to remove.
  const toggleEvent = (kind)=>{
    setEvents(prev=>{
      const idx = prev.findIndex(e=>e.kind===kind);
      if(idx>=0) return prev.filter((_,i)=>i!==idx);
      const ev = {id:Date.now()+Math.random(), kind};
      if(kind==='pto') ev.hours = 12;
      return [...prev, ev];
    });
    setDirty(true);
  };
  const setPtoHours = (v)=>{ setEvents(prev=>prev.map(e=> e.kind==='pto' ? {...e, hours:v} : e)); setDirty(true); };
  // Whether the day already has something to save besides the shift being configured —
  // when true, the primary button won't silently auto-add an unconfirmed draft shift
  // (e.g. a PTO-only day should never gain a phantom "Night ×12h" entry).
  const hasOtherContent = events.length>0 || note.trim().length>0;
  // Primary button: if no rows were explicitly added and there's nothing else to save,
  // commit the pending draft rather than saving nothing.
  const save = ()=> onSave(list.length ? list : (hasOtherContent ? [] : [draftShift()]), events, note.trim());
  // Scrim dismiss: never silently drop rows/events/note the user already set; a clean sheet just closes.
  const dismiss = ()=> dirty ? onSave(list, events, note.trim()) : onClose();

  // One-tap template apply: adds that template's shift to this day instantly.
  const applyTemplateTap = (t)=>{
    setList(l=>[...l, {id:Date.now()+Math.random(), shiftType:t.shiftType, hours:t.hours, bonusType:t.bonusType, customBonus:t.customBonus, templateId:t.id, ...(t.start?{start:t.start}:{})}]);
    setDirty(true);
    track('template_tap', null, userId);
  };
  const doSaveTemplate = ()=>{
    const nm = tplName.trim();
    if(!nm){ toast('Give your template a name.','error'); return; }
    const clampedHours = Math.min(24,Math.max(0.1, hours||0.1));
    // add() resets bonusType/customBonus/start right after committing a shift to `list`, so in
    // the natural "configure -> + Add to this day -> Save as template" flow those fields would
    // otherwise read back as blank/none here. configDirtySinceAdd tracks explicitly whether any
    // of shiftType/hours/bonusType/customBonus/start has been touched since the last add() (set
    // there); if not, source bonus/start from the just-added entry instead of the reset draft
    // state, so the template faithfully captures what's on the day. If the user *has* reconfigured
    // since, the live control values are what they mean to save.
    const last = list[list.length-1];
    const src = (last && !configDirtySinceAdd.current)
      ? last : {bonusType, customBonus, start};
    const tpl = {name:nm.slice(0,40), shiftType, hours:clampedHours, bonusType:src.bonusType||'none', customBonus:src.customBonus||0};
    if(src.start) tpl.start = src.start;
    const ok = onSaveTemplate(tpl);
    // On a failed (capped) save, leave the input open with the typed name so freeing a slot
    // (deleting another template) lets the user retry without retyping.
    if(ok){ setSavingTpl(false); setTplName(''); toast(`Saved "${nm}" as a template.`,'success'); }
  };

  return (
    <div className="scrim" onClick={dismiss}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"></div>
        <div className="sheet-h">
          <div className="t">Add a shift</div>
          <div className="row-item" style={{margin:0,padding:'7px 12px',fontWeight:600,fontSize:12.5}}>{dateLabel}</div>
        </div>

        {templates.length>0 &&
          <div style={{marginBottom:16}}>
            <div className="sec-lab">QUICK ADD FROM TEMPLATE</div>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {templates.map(t=>(
                <div key={t.id} style={{display:'flex',alignItems:'center',gap:8}}>
                  <button className="chip-sel" style={{flex:1,minHeight:44}} onClick={()=>applyTemplateTap(t)}>

              <button className="back" aria-label="Cancel save template" onClick={()=>setSavingTpl(false)}>{Ic.x}</button>
            </div>}

        <button className="btn btn-ghost" style={{marginBottom:10}} onClick={add}>+ Add to this day</button>
        <button className="btn btn-primary" onClick={save}>{(list.length || hasOtherContent) ? 'Save day':'Add shift'}</button>
      </div>
    </div>
  );
}

/* ---------- Auth Modal ---------- */
function AuthModal({mode:initialMode,onClose}){
  const [mode,setMode] = useState(initialMode||'signin');
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState('');

  const handleEmailAuth = async (e)=>{
    e.preventDefault();
    if(!supabase){ setError('Cloud sync is unavailable right now — your data is still saved on this device.'); return; }
    setLoading(true);
    setError('');
    try{
      // Call the method ON the client — detaching it (const action = supabase.auth.signUp)
      // loses `this` and throws TypeError in the strict-mode UMD bundle, hanging the button forever.
      const {error:err} = mode==='signup'
        ? await supabase.auth.signUp({email,password})
        : await supabase.auth.signInWithPassword({email,password});
      if(err) setError(err.message);
      else {
        if(mode==='signup') toast('Check your email to confirm your account!','success');
        onClose();
      }
    }catch(e2){
      setError((e2 && e2.message) || 'Something went wrong — please try again.');
    }finally{
      setLoading(false);
    }
  };

  const handleGoogleAuth = async ()=>{
    if(!supabase){ setError('Cloud sync is unavailable right now — your data is still saved on this device.'); return; }
    setLoading(true);
    setError('');
    const {error:err} = await supabase.auth.signInWithOAuth({
      provider:'google',
      // origin alone drops the /705-v1/ path on GitHub Pages — keep the full page URL
      options:{redirectTo:window.location.origin + window.location.pathname}
    });
    if(err) setError(err.message);
    setLoading(false);
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="sheet-h">
          <div className="t">{mode==='signup'?'Create account':'Sign in'}</div>
          <button className="back" onClick={onClose}>{Ic.x}</button>
        </div>

        <form onSubmit={handleEmailAuth}>
          <label className="field">
            <span className="lab">Email</span>
            <div className="inp"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="you@example.com"/></div>
          </label>
          <label className="field">
            <span className="lab">Password</span>
            <div className="inp"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" minLength={6}/></div>
          </label>
          {error && <div style={{color:'var(--danger)',fontSize:13,marginBottom:12}}>{error}</div>}
          <button type="submit" className="btn btn-primary" disabled={loading} style={{marginBottom:12}}>
            {loading ? 'Loading...' : (mode==='signup'?'Sign up':'Sign in')}
          </button>
        </form>

        <div style={{position:'relative',textAlign:'center',margin:'16px 0'}}>
          <div style={{position:'absolute',top:'50%',left:0,right:0,height:1,background:'var(--line)'}}></div>
          <span style={{position:'relative',background:'var(--paper)',padding:'0 12px',fontSize:12,color:'var(--muted-2)'}}>or</span>
        </div>

        <button className="btn btn-ghost" onClick={handleGoogleAuth} disabled={loading} style={{marginBottom:16}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div style={{textAlign:'center',fontSize:13}}>
          {mode==='signup'
            ? <span>Have an account? <button className="link" onClick={()=>{setError('');setMode('signin');}}>Sign in</button></span>
            : <span>No account? <button className="link" onClick={()=>{setError('');setMode('signup');}}>Sign up</button></span>}
        </div>
      </div>
    </div>
  );
}

          <label className="field" style={{margin:0}}><span className="lab">Post-tax</span><div className="inp pre"><span className="pfx">$</span><NumInput value={posttaxDeductions} onCommit={setPosttax} min={0} ariaLabel="Post-tax deductions"/></div></label>

      <button className="btn btn-primary" onClick={()=>setObStep(4)}>See my estimate</button>
    </div>
  );

  /* 4 — done */
  const sample = sampleNet();
  return (
    <div className="ob dark" style={{alignItems:'center',textAlign:'center'}}>
      <div className="spacer"></div>
      <div style={{width:74,height:74,borderRadius:'50%',background:'var(--mint)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 0 12px rgba(52,211,153,.14)'}}>{Ic.check}</div>
      <div className="display" style={{fontWeight:700,fontSize:27,marginTop:26}}>{name&&name!=='there'?`You're all set, ${name}.`:"You're all set."}</div>
      <div className="help" style={{color:'#9A9DAB'}}>Based on a typical two-week schedule, here's what you'd take home:</div>
      <div style={{width:'100%',background:'var(--ink-2)',borderRadius:22,padding:24,marginTop:24}}>
        <div style={{fontSize:12,fontWeight:600,color:'#9A9DAB'}}>Projected take-home</div>
        <div className="num" style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:54,color:'var(--mint)',letterSpacing:'-.03em',margin:'8px 0',lineHeight:1}}>{fmt(sample.net)}</div>
        <div style={{fontSize:13,color:'#7E8290',fontWeight:500}}>{sample.hours} hrs · 6 shifts · gross {fmt(sample.gross)}</div>
      </div>
      <div style={{width:'100%',marginTop:14}}>
        <div className="field" style={{margin:0,textAlign:'left'}}>
          <div className="inp"><input placeholder="What should we call you?" value={name==='there'?'':name} onChange={e=>setName(e.target.value||'there')} style={{background:'#21242F',border:'1.5px solid #2E3140',color:'#fff'}}/></div>
        </div>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={finish}>Go to my planner</button>
      <button className="btn" style={{width:'100%',color:'#9A9DAB'}} onClick={()=>setObStep(1)}>Edit my setup</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/><Toaster/><ConfirmHost/></ErrorBoundary>);
</script>
</body>
</html>
