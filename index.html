<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ScrubPay — Nursing Wage Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#16181F; --ink-2:#21242F; --paper:#F6F5F1; --card:#FFFFFF;
    --indigo:#5B4FE9; --indigo-press:#4A3FD4; --indigo-soft:#ECEAFE; --indigo-ink:#3F35B8;
    --mint:#34D399; --money:#11A86B; --money-soft:#E3F7EE; --money-ink:#0B5D3C;
    --coral:#FF6B5C; --coral-soft:#FFF3F1; --coral-ink:#7A2E26;
    --violet:#9B5BE9; --amber:#F5A524; --slate:#8A93A6;
    --muted:#6B665C; --muted-2:#9A968C; --line:#EEEDE8; --line-2:#E7E5DE;
    --danger:#C84B3C; --danger-soft:#F3D6D1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .display{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#dcdacf;border-radius:6px;border:3px solid var(--paper)}

  /* loading splash */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--paper);z-index:9999;transition:opacity .35s}
  #splash .logo{display:flex;align-items:center;gap:10px}
  #splash .dot{width:14px;height:14px;border-radius:5px;background:var(--indigo)}
  #splash .wm{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px}
  #splash .spin{width:26px;height:26px;border:3px solid #e3e1d8;border-top-color:var(--indigo);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* layout */
  .topbar{position:sticky;top:0;z-index:40;background:rgba(246,245,241,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px}
  .brand .b-dot{width:11px;height:11px;border-radius:4px;background:var(--indigo)}
  .topnav{display:none;gap:20px;margin-left:8px}
  .topnav span{font-weight:600;font-size:13.5px;color:var(--muted-2)}
  .topnav span.on{color:var(--ink)}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .iconbtn:hover{background:#fbfaf7}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 120px}
  .greet-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .greet .hi{font-size:13px;color:var(--muted-2);font-weight:500}
  .greet .name{font-family:'Bricolage Grotesque';font-weight:700;font-size:22px}
  .period{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13.5px}
  .period button{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:18px;line-height:1}
  .period button:hover{background:#f1f0eb}

  .dash{display:grid;grid-template-columns:1fr;gap:16px}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:700}

  .hero{background:var(--ink);border-radius:22px;padding:22px 24px;color:#fff}
  .hero .lbl{font-size:12.5px;font-weight:600;color:#9A9DAB}
  .hero .num{font-family:'Bricolage Grotesque';font-weight:800;color:var(--mint);font-size:clamp(46px,12vw,64px);line-height:1;letter-spacing:-.03em;margin:8px 0 14px}
  .hero .chips{display:flex;flex-wrap:wrap;gap:8px}
  .hero .chip{background:rgba(255,255,255,.08);color:#D9DBE4;padding:7px 12px;border-radius:9px;font-weight:600;font-size:12.5px}
  .hero .more{margin-top:14px;font-weight:600;font-size:12.5px;color:#8E92A0;display:inline-flex;align-items:center;gap:4px}
  .hero .more:hover{color:#cfd2db}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .stat .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px}
  .stat .k{font-size:12px;color:var(--muted-2);margin-top:2px;font-weight:500}

  .whatif{background:var(--indigo-soft);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px}
  .whatif .t{font-weight:600;font-size:13.5px;color:var(--indigo-ink)}
  .whatif .s{font-size:12px;color:#6A60C9;margin-top:3px}
  .whatif button{background:var(--indigo);color:#fff;padding:9px 14px;border-radius:11px;font-weight:600;font-size:12.5px;flex:0 0 auto}

  /* calendar */
  .cal-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .cal-head .ttl{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}
  .cal-head .sub{font-size:12.5px;color:var(--muted-2)}
  .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px;scrollbar-width:none}
  .cal-scroll::-webkit-scrollbar{display:none}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;min-width:600px}
  .dow div{text-align:center;font-weight:700;font-size:11px;color:#A8A498}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:600px}
  .cell{aspect-ratio:1/1;border-radius:11px;background:#fbfaf7;border:1px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;text-align:left;transition:transform .08s,box-shadow .12s}
  .cell:hover{box-shadow:0 4px 12px rgba(20,20,30,.08);transform:translateY(-1px)}
  .cell.empty{border-style:dashed;background:#fff;pointer-events:none}
  .cell .d{font-weight:700;font-size:13px}
  .cell .plus{margin-top:auto;color:#cfccc2;font-size:17px;font-weight:700}
  .cell .dots{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap}
  .cell .dots i{width:7px;height:7px;border-radius:50%}
  .cell .amt{font-weight:700;font-size:10px;color:var(--money);margin-top:2px}
  .cell.has{background:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
  .legend i{width:8px;height:8px;border-radius:50%}

  /* breakdown */
  .bd-row{margin-bottom:13px}
  .bd-row:last-child{margin-bottom:0}
  .bd-row .lh{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
  .bd-row .lh .nm{font-weight:600;color:var(--muted)}
  .bd-row .lh .nm.g{color:var(--ink)}
  .bd-row .lh .vv{font-weight:600;color:var(--danger)}
  .bd-row .lh .vv.g{font-family:'Bricolage Grotesque';font-weight:700;color:var(--ink)}
  .bar{height:9px;border-radius:5px;background:var(--danger-soft)}
  .bar.gross{height:10px;background:var(--indigo);width:100%}
  .takehome{background:var(--ink);border-radius:16px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;color:#fff}
  .takehome .k{font-size:12.5px;color:#9A9DAB;font-weight:600}
  .takehome .s{font-size:11.5px;color:#7E8290;margin-top:2px}
  .takehome .v{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;color:var(--mint);letter-spacing:-.02em}
  .disclaimer{font-size:11.5px;line-height:1.5;color:#A8A498;text-align:center;margin-top:14px}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:15px;font-weight:600;font-size:15px;width:100%;transition:transform .06s,box-shadow .12s}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--indigo);color:#fff;box-shadow:0 8px 18px rgba(91,79,233,.28)}
  .btn-primary:hover{background:var(--indigo-press)}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-2)}
  .btn-ghost:hover{background:#fbfaf7}
  .btn-soft{background:var(--indigo-soft);color:var(--indigo-ink)}
  .btn-sm{padding:10px 16px;border-radius:11px;font-size:13px;width:auto}

  /* fab */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:45;background:var(--indigo);color:#fff;padding:15px 26px;border-radius:16px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 26px rgba(91,79,233,.4)}
  .fab:active{transform:translateX(-50%) translateY(1px)}

  /* toggle */
  .tg{width:44px;height:25px;border-radius:13px;background:#D7D5CE;position:relative;flex:0 0 auto;transition:background .15s;cursor:pointer}
  .tg .knob{position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .tg.on{background:var(--indigo)}
  .tg.on .knob{left:21.5px}

  /* inputs */
  .field{display:block;margin-bottom:14px}
  .field .lab{font-size:13px;font-weight:600;margin-bottom:7px;display:block}
  .field .hint{font-size:11.5px;color:var(--muted-2);margin-top:6px}
  .inp{position:relative}
  .inp input,.inp select{width:100%;padding:13px 14px;border:1.5px solid var(--line-2);border-radius:13px;font-size:15px;background:#fff;color:var(--ink);outline:none}
  .inp.pre input{padding-left:30px}
  .inp.suf input{padding-right:38px}
  .inp .pfx{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-weight:600}
  .inp .sfx{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-weight:600}
  .inp input:focus,.inp select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,79,233,.12)}

  /* diff rows */
  .drow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:11px;margin-bottom:9px}
  .drow.off{opacity:.55}
  .drow .nm{font-weight:600;font-size:14px;flex:1;min-width:0}
  .drow .amt{font-weight:700;font-size:13px;background:#F2F1EC;padding:5px 9px;border-radius:8px;white-space:nowrap}
  .drow .amt input{width:54px;border:none;background:transparent;font:inherit;text-align:right;outline:none}
  .ddash{border:1.5px dashed #D8D5CC;border-radius:13px;padding:12px;text-align:center;font-weight:600;font-size:13px;color:#7A766C;width:100%}

  /* chips */
  .chips-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chip-sel{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;text-align:left}
  .chip-sel i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .chip-sel.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
  .chip-sel.on i{background:#fff!important}
  .hrs{display:flex;gap:8px}
  .hrs .hc{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px;text-align:center;font-weight:700;font-size:14px;color:var(--muted);background:#fff}
  .hrs .hc.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* tags */
  .tag{display:inline-block;font-weight:600;font-size:10.5px;padding:3px 7px;border-radius:6px;margin-top:5px}
  .tag.est{color:#C2820A;background:#FDF3DD}
  .tag.auto{color:var(--indigo);background:var(--indigo-soft)}

  /* progress */
  .prog{flex:1;height:6px;border-radius:3px;background:#E5E3DC;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--indigo);border-radius:3px;transition:width .3s}
  .back{width:36px;height:36px;border-radius:11px;border:1.5px solid var(--line-2);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:0 0 auto}

  /* onboarding */
  .ob{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:22px 24px calc(24px + env(safe-area-inset-bottom))}
  .ob .eyebrow{font-weight:600;font-size:12.5px;color:var(--indigo);margin-bottom:10px;letter-spacing:.02em}
  .ob .q{font-family:'Bricolage Grotesque';font-weight:700;font-size:25px;line-height:1.18}
  .ob .help{font-size:14px;line-height:1.55;color:var(--muted);margin-top:12px}
  .ob .spacer{flex:1;min-height:18px}
  .ob.dark{background:var(--ink);color:#fff}
  .pill{display:inline-flex;align-self:flex-start;background:var(--indigo-soft);color:var(--indigo);padding:6px 12px;border-radius:999px;font-weight:600;font-size:12px}

  /* modal / sheet */
  .scrim{position:fixed;inset:0;background:rgba(18,18,26,.55);z-index:80;display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{margin-top:auto;width:100%;max-width:520px;margin-left:auto;margin-right:auto;background:var(--paper);border-radius:26px 26px 0 0;max-height:92dvh;overflow-y:auto;padding:14px 22px calc(24px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .grab{width:42px;height:5px;border-radius:3px;background:#D8D5CC;margin:0 auto 16px}
  .modal{margin:auto;width:100%;max-width:560px;background:var(--paper);border-radius:24px;max-height:90dvh;overflow-y:auto;padding:24px;animation:up .24s ease}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .sheet-h .t{font-family:'Bricolage Grotesque';font-weight:700;font-size:21px}
  .sec-lab{font-weight:600;font-size:12px;color:var(--muted-2);margin:4px 0 9px;letter-spacing:.02em}
  .preview{background:var(--money-soft);border:1px solid #BCE9D4;border-radius:14px;padding:14px 16px;margin:16px 0}
  .preview .k{font-weight:600;font-size:12px;color:var(--money-ink)}
  .preview .v{font-weight:700;font-size:14px;color:var(--money-ink);margin-top:2px}
  .row-item{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:9px}
  .link{color:var(--indigo);font-weight:600;font-size:13px}
  .danger-link{color:var(--danger);font-weight:600;font-size:12.5px}

  @media (min-width:920px){
    .topnav{display:flex}
    .dash{grid-template-columns:1.6fr 1fr;align-items:start}
    .fab{display:none}
    .wrap{padding-bottom:40px}
    .hero .num{font-size:60px}
  }
  @media (max-width:919px){ .desk-only{display:none!important} }
</style>
</head>
<body>

  'holiday':      { name:'Holiday',          amount:1.5,  type:'multiplier', active:true,  color:'#F5A524' },
  'overtime':     { name:'Overtime (1.5×)',  amount:1.5,  type:'multiplier', active:true,  color:'#11A86B' },
  'bonus-incentive':{ name:'Bonus incentive',amount:15,   type:'dollar',     active:true,  color:'#11A86B' },
};
const BONUS = { none:0, charge:3, preceptor:2, oncall:5, custom:0 };
const BONUS_LABEL = { none:'None', charge:'Charge +$3/hr', preceptor:'Preceptor +$2/hr', oncall:'On-call +$5/hr', custom:'Custom' };

const fmt = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmt2 = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function hourlyRate(base, diff){
  if(!diff) return base;
  if(diff.type==='multiplier') return base * diff.amount;
  if(diff.type==='percent') return base * (1 + diff.amount/100);
  return base + diff.amount;
}
function shiftGross(base, diff, s){
  const bonus = s.bonusType==='custom' ? (parseFloat(s.customBonus)||0) : (BONUS[s.bonusType]||0);
  return hourlyRate(base, diff) * s.hours + bonus;
}

/* ---------- supabase helpers ---------- */
async function saveToSupabase(userId, data){
  const {error} = await supabase
    .from('user_data')
    .upsert({user_id:userId, data, updated_at:new Date().toISOString()});
  if(error) console.error('Save error:',error);
  return !error;
}

async function loadFromSupabase(userId){
  const {data, error} = await supabase
    .from('user_data')
    .select('data')
    .eq('user_id',userId)
    .single();
  if(error && error.code!=='PGRST116') console.error('Load error:',error);
  return data?.data || null;
}

          if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);

            setDiff(m);
          }
          setSetupComplete(d.setupComplete!==false);
        }
        setReady(true);
      });
    });
    const {data:{subscription}} = supabase.auth.onAuthStateChange((_event,session)=>{
      setSession(session);
      setUser(session?.user ?? null);
      if(session) loadFromSupabase(session.user.id).then(d=>{
        if(d){
          if(d.name) setName(d.name);
          if(d.baseRate!=null) setBaseRate(d.baseRate);
          if(d.federalTaxRate!=null) setFederal(d.federalTaxRate);
          if(d.stateTaxRate!=null) setState(d.stateTaxRate);
          if(d.pretaxDeductions!=null) setPretax(d.pretaxDeductions);
          if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);
          if(d.ficaWithholdingType) setFicaType(d.ficaWithholdingType);
          if(d.ficaWithholdingPercent!=null) setFicaPct(d.ficaWithholdingPercent);
          if(d.payPeriodStart) setPPS(d.payPeriodStart);
          if(d.shifts) setShifts(d.shifts);
          if(d.customWithholdings) setCW(d.customWithholdings);
          if(d.differentials){
            const m={...DIFF_DEFAULTS};
            Object.entries(d.differentials).forEach(([k,v])=>{m[k]={...(DIFF_DEFAULTS[k]||{color:'#8A93A6',type:'dollar'}),...v};});
            setDiff(m);
          }
          setSetupComplete(d.setupComplete!==false);
        }
      });
    });
    return ()=> subscription.unsubscribe();
  },[]);

  /* load */
  useEffect(()=>{
    if(user) return; // skip localStorage if user is logged in
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const d = JSON.parse(raw);
        if(d.name) setName(d.name);
        if(d.baseRate!=null) setBaseRate(d.baseRate);
        if(d.federalTaxRate!=null) setFederal(d.federalTaxRate);
        if(d.stateTaxRate!=null) setState(d.stateTaxRate);
        if(d.pretaxDeductions!=null) setPretax(d.pretaxDeductions);
        if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);
        if(d.ficaWithholdingType) setFicaType(d.ficaWithholdingType);
        if(d.ficaWithholdingPercent!=null) setFicaPct(d.ficaWithholdingPercent);
        if(d.payPeriodStart) setPPS(d.payPeriodStart);
        if(d.shifts) setShifts(d.shifts);
        if(d.customWithholdings) setCW(d.customWithholdings);
        if(d.differentials){
          const merged = {...DIFF_DEFAULTS};
          Object.entries(d.differentials).forEach(([k,v])=>{ merged[k] = {...(DIFF_DEFAULTS[k]||{color:'#8A93A6',type:'dollar'}), ...v}; });
          setDiff(merged);
        }
        setSetupComplete(d.setupComplete!==false);
      }
    }catch(e){ console.error('load',e); }
    setReady(true);
    const sp = document.getElementById('splash');
    if(sp){ sp.style.opacity='0'; setTimeout(()=>sp.remove(),400); }
  },[]);

  /* save (debounced) */
  useEffect(()=>{
    if(!ready) return;
    const id = setTimeout(async ()=>{
      const dataToSave = {
        name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,
        ficaWithholdingType:ficaType,ficaWithholdingPercent:ficaPct,
        payPeriodStart,shifts,customWithholdings,differentials,setupComplete
      };
      if(user){
        // Save to Supabase if logged in
        setSyncing(true);

      }else{
        // Fall back to localStorage
        try{
          localStorage.setItem(STORE_KEY, JSON.stringify(dataToSave));
        }catch(e){ if(e.name==='QuotaExceededError') alert('Storage full — export your data.'); }
      }
    },500);
    return ()=>clearTimeout(id);
  },[ready,user,name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,ficaType,ficaPct,payPeriodStart,shifts,customWithholdings,differentials,setupComplete]);

  /* lock scroll behind overlays */
  useEffect(()=>{
    const open = sheetDate||showSettings||showBreakdown||paystub||showAuth;
    document.body.style.overflow = open ? 'hidden':'';
    return ()=>{ document.body.style.overflow=''; };
  },[sheetDate,showSettings,showBreakdown,paystub]);

  /* ---- period days ---- */
  const days = useMemo(()=>{
    const [y,m,d] = payPeriodStart.split('-').map(Number);
    return Array.from({length:14},(_,i)=> new Date(y,m-1,d+i));
  },[payPeriodStart]);
  const keyOf = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const periodLabel = useMemo(()=>{
    const a=days[0], b=days[13];
    const o={month:'short',day:'numeric'};
    return `${a.toLocaleDateString('en-US',o)} – ${b.toLocaleDateString('en-US',o)}`;
  },[days]);

  /* ---- calculations ---- */
  const calc = useMemo(()=>{
    let gross=0, hours=0;
    Object.values(shifts).forEach(arr => (arr||[]).forEach(s=>{
      gross += shiftGross(baseRate, differentials[s.shiftType], s);
      hours += s.hours;
    }));
    const taxable = gross - pretaxDeductions;
    let fica = 0;
    if(ficaType==='standard') fica = taxable*0.0765;
    else if(ficaType==='percent') fica = taxable*((parseFloat(ficaPct)||0)/100);
    const fed = taxable*(federalTaxRate/100);
    const st  = taxable*(stateTaxRate/100);
    let cw = 0;
    customWithholdings.forEach(w=>{ cw += w.type==='percent' ? taxable*((parseFloat(w.amount)||0)/100) : (parseFloat(w.amount)||0); });
    const ded = pretaxDeductions+fica+fed+st+posttaxDeductions+cw;
    const net = gross-ded;
    return {gross,hours,fica,fed,st,cw,ded,net,pre:pretaxDeductions,post:posttaxDeductions,
      pct: gross>0 ? Math.round(net/gross*100) : 0};
  },[shifts,baseRate,differentials,pretaxDeductions,posttaxDeductions,ficaType,ficaPct,federalTaxRate,stateTaxRate,customWithholdings]);

  const dayTotals = useMemo(()=>{
    const o={};
    days.forEach(dt=>{
      const arr = shifts[keyOf(dt)]||[];
      let g=0,h=0; arr.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
      o[keyOf(dt)] = {g,h,n:arr.length};
    });
    return o;
  },[days,shifts,baseRate,differentials]);

  const shiftCount = useMemo(()=> Object.values(shifts).reduce((a,arr)=>a+(arr?arr.length:0),0),[shifts]);

  /* effective per-shift take-home ratio (for live previews) */
  const ficaForPreview = ficaType==='standard'?7.65:(ficaType==='percent'?(parseFloat(ficaPct)||0):0);
  const keepRatio = Math.max(0, 1 - (federalTaxRate+stateTaxRate+ficaForPreview)/100);

  /* ---- handlers ---- */
  const num = (v,fb=0)=>{ const n=parseFloat(v); return isNaN(n)?fb:n; };
  const movePeriod = (dir)=>{ const [y,m,d]=payPeriodStart.split('-').map(Number); const nd=new Date(y,m-1,d+dir*14); setPPS(keyOf(nd)); };

  const saveDayShifts = (dateKey, arr)=>{
    setShifts(prev=>{ const n={...prev}; if(arr.length) n[dateKey]=arr; else delete n[dateKey]; return n; });
  };

  const exportData = ()=>{
    const blob = new Blob([JSON.stringify({name,baseRate,federalTaxRate,stateTaxRate,pretaxDeductions,posttaxDeductions,ficaWithholdingType:ficaType,ficaWithholdingPercent:ficaPct,payPeriodStart,shifts,customWithholdings,differentials,setupComplete,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});
    const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=`scrubpay-${todayISO()}.json`; a.click(); URL.revokeObjectURL(u);
  };
  const importData = (e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{ try{
      const d=JSON.parse(ev.target.result);
      if(typeof d!=='object'||!d) throw 0;
      if(d.name) setName(d.name);
      if(d.baseRate!=null) setBaseRate(d.baseRate);
      if(d.federalTaxRate!=null) setFederal(d.federalTaxRate);
      if(d.stateTaxRate!=null) setState(d.stateTaxRate);
      if(d.pretaxDeductions!=null) setPretax(d.pretaxDeductions);
      if(d.posttaxDeductions!=null) setPosttax(d.posttaxDeductions);
      if(d.ficaWithholdingType) setFicaType(d.ficaWithholdingType);
      if(d.ficaWithholdingPercent!=null) setFicaPct(d.ficaWithholdingPercent);
      if(d.payPeriodStart) setPPS(d.payPeriodStart);
      if(d.shifts) setShifts(d.shifts);
      if(d.customWithholdings) setCW(d.customWithholdings);
      if(d.differentials){ const m={...DIFF_DEFAULTS}; Object.entries(d.differentials).forEach(([k,v])=>{m[k]={...(DIFF_DEFAULTS[k]||{color:'#8A93A6',type:'dollar'}),...v};}); setDiff(m); }
      setSetupComplete(true);
      alert('Data imported.');
    }catch(err){ alert('Could not read that file.'); } };
    r.readAsText(f); e.target.value='';
  };
  const clearAll = ()=>{ if(confirm('Clear ALL data? This cannot be undone.')){ localStorage.removeItem(STORE_KEY); location.reload(); } };

  /* ---- paystub PDF ---- */
  const parsePDF = async (file)=>{
    const buf = await file.arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){ const p=await pdf.getPage(i); const c=await p.getTextContent(); text += c.items.map(x=>x.str).join(' ')+'\n'; }
    const ex={};
    let m;
    if((m=text.match(/Pay Begin Date:\s*(\d{2}\/\d{2}\/\d{4})/))){ const[mm,dd,yy]=m[1].split('/'); ex.payPeriodStart=`${yy}-${mm}-${dd}`; }
    if((m=text.match(/Pay Rate:\s*\$?([\d,]+\.?\d*)\s*Hourly/))) ex.baseRate=parseFloat(m[1].replace(/,/g,''));
    if((m=text.match(/403\(b\)[^\d]+([\d,]+\.?\d*)/))) ex.pretaxDeductions=parseFloat(m[1].replace(/,/g,''));
    const med=text.match(/Fed MED\/EE[^\d]+([\d,]+\.?\d*)/), oas=text.match(/Fed OASDI\/EE[^\d]+([\d,]+\.?\d*)/);
    if(med&&oas) ex.ficaWithholding=parseFloat(med[1].replace(/,/g,''))+parseFloat(oas[1].replace(/,/g,''));
    let stt=0; const pa=text.match(/PA W\/H[^\d]+([\d,]+\.?\d*)/), ph=text.match(/PA PHILADELPHIA W\/H[^\d]+([\d,]+\.?\d*)/), ls=text.match(/PA LS Tax[^\d]+([\d,]+\.?\d*)/);
    if(pa)stt+=parseFloat(pa[1].replace(/,/g,'')); if(ph)stt+=parseFloat(ph[1].replace(/,/g,'')); if(ls)stt+=parseFloat(ls[1].replace(/,/g,''));
    if(stt>0) ex.stateTax=stt;
    const g=text.match(/TOTAL GROSS[^\d]+([\d,]+\.?\d*)/); if(g) ex.grossPay=parseFloat(g[1].replace(/,/g,''));
    if(ex.ficaWithholding&&ex.grossPay) ex.ficaRate=ex.ficaWithholding/ex.grossPay*100;
    if(ex.stateTax&&ex.grossPay) ex.stateTaxRate=ex.stateTax/ex.grossPay*100;
    ex.shifts=[]; const sec=text.match(/HOURS AND EARNINGS([\s\S]*?)TAXES/);
    if(sec){ const rx=/(?:PD |Incentive - )([\w\s-]+?)\s+([\d.]+)\s+([\d.]+)\s+([\d,.]+)(?:\s+[\d.]+\s+[\d,.]+)?/g; let mm2; const seen=new Set();
      while((mm2=rx.exec(sec[1]))!==null){ const desc=mm2[1].trim(); const hrs=parseFloat(mm2[3]); const k=desc.toLowerCase();
        if(hrs>0&&hrs<200&&!seen.has(k)){ seen.add(k); ex.shifts.push({description:desc,rate:parseFloat(mm2[2]),hours:hrs,earnings:parseFloat(mm2[4].replace(/,/g,''))}); } } }
    return ex;
  };
  const onPaystub = async (e)=>{
    const f=e.target.files[0]; if(!f) return;
    if(f.size>10*1024*1024){ alert('File too large (max 10MB).'); e.target.value=''; return; }

    setParsing(true);

  const applyPaystub = ()=>{

        else if(d.includes('overtime')) key='overtime';
        else if(d.includes('holiday')) key='holiday';
        if(key!=='base'||da!==0) nd[key]={...nd[key],amount: nd[key]&&nd[key].type==='multiplier'?nd[key].amount:da, active:true};
      });
      setDiff(nd);
    }
    setPaystub(null); setSetupComplete(true); setObStep(0);
  };

  if(!ready) return null;

  /* ============== ONBOARDING ============== */
  if(!setupComplete){
    return <Onboarding {...{obStep,setObStep,name,setName,baseRate,setBaseRate,num,
      differentials,setDiff,federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
      pretaxDeductions,setPretax,posttaxDeductions,setPosttax,
      onPaystub,parsing,finish:()=>{setSetupComplete(true);},
      sampleNet:()=>{ // illustrative typical 2wk schedule from their rates
        const sample=[ {shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},{shiftType:'night',hours:12,bonusType:'none'},
          {shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'weekend-day',hours:12,bonusType:'none'},{shiftType:'base',hours:12,bonusType:'none'} ];
        let g=0,h=0; sample.forEach(s=>{ g+=shiftGross(baseRate,differentials[s.shiftType],s); h+=s.hours; });
        const t=g-pretaxDeductions; const fica=ficaType==='percent'?t*((parseFloat(ficaPct)||0)/100):t*0.0765;
        const net=g-(pretaxDeductions+fica+t*(federalTaxRate/100)+t*(stateTaxRate/100)+posttaxDeductions);
        return {net,gross:g,hours:h}; }
    }} />;
  }

  /* ============== MAIN APP ============== */
  const sampleWeekendNet = Math.round(shiftGross(baseRate, differentials['weekend-eve'], {shiftType:'weekend-eve',hours:12,bonusType:'none'}) * keepRatio);

  return (
    <div>
      <div className="topbar">
        <div className="brand"><span className="b-dot"></span>scrubpay</div>
        <nav className="topnav"><span className="on">Planner</span><span onClick={()=>document.querySelector('.cal-head')?.scrollIntoView({block:'start'})} style={{cursor:'pointer'}}>Calendar</span><span onClick={()=>setShowSettings(true)} style={{cursor:'pointer'}}>Settings</span></nav>
        <div className="top-actions">
          {syncing && <span style={{fontSize:12,color:'var(--muted-2)',marginRight:8}}>Syncing...</span>}
          <button className="btn btn-primary btn-sm desk-only" onClick={()=>{const k=keyOf(days.find(d=>!(shifts[keyOf(d)])) || days[0]); setSheetDate(k);}}>+ Log a shift</button>
          <button className="iconbtn" title="Settings" onClick={()=>setShowSettings(true)}>{Ic.gear}</button>
          {user
            ? <button className="iconbtn" title="Sign out" onClick={async()=>{if(confirm('Sign out?'))await supabase.auth.signOut();}}>{Ic.logout}</button>
            : <button className="btn btn-primary btn-sm" onClick={()=>setShowAuth(true)}>Sign in</button>}
          <div className="avatar">{user ? (user.email||'?').charAt(0).toUpperCase() : (name||'?').trim().charAt(0).toUpperCase()}</div>
        </div>
      </div>

      <div className="wrap">
        <div className="greet-row">
          <div className="greet"><div className="hi">{greeting()}</div><div className="name">{name==='there'?'Welcome back':name}</div></div>
          <div className="period"><button onClick={()=>movePeriod(-1)}>‹</button><span className="num">{periodLabel}</span><button onClick={()=>movePeriod(1)}>›</button></div>
        </div>

              <div className="lbl">Projected take-home</div>
              <div className="num num">{fmt(calc.net)}</div>
              <div className="chips">
                <span className="chip">Gross {fmt(calc.gross)}</span>
                <span className="chip">Taxes & deductions –{fmt(calc.ded)}</span>
                {calc.hours>0 && <span className="chip">{calc.hours} hrs · {shiftCount} shifts</span>}
              </div>
              <div className="hero more" style={{cursor:'pointer'}} onClick={()=>setShowBreakdown(true)}>See the full breakdown ›</div>
            </div>

            <div className="stats">
              <div className="stat"><div className="v num">{calc.hours.toFixed(calc.hours%1?1:0)}</div><div className="k">hours this period</div></div>
              <div className="stat"><div className="v num">{shiftCount}</div><div className="k">shifts scheduled</div></div>
            </div>

            {shiftCount>0 && baseRate>0 &&
              <div className="whatif">
                <div style={{flex:1}}><div className="t">Pick up a weekend night?</div><div className="s">That's about <b>+{fmt(sampleWeekendNet)}</b> take-home.</div></div>
                <button onClick={()=>{ const sat=days.find(d=>d.getDay()===6 && !(shifts[keyOf(d)])) || days.find(d=>d.getDay()===6) || days[0]; setSheetDate(keyOf(sat)); }}>Try it</button>
              </div>}

            <div className="card">
              <div className="cal-head"><div><div className="ttl">This pay period</div></div><div className="sub">Tap a day to add or edit</div></div>
              <div className="cal-scroll">
                <div className="dow">{['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=><div key={d}>{d[0]}</div>)}</div>

                  <span key={k}><i style={{background:differentials[k]?.color||'#8A93A6'}}></i>{l}</span>)}

              </div>}
            <div className="card desk-only">

              <div style={{display:'flex',alignItems:'baseline',gap:8}}>

                <span style={{fontSize:13,color:'var(--muted-2)',fontWeight:500}}>of gross kept</span>
              </div>
            </div>
          </div>

      </div>

      <button className="fab" onClick={()=>setSheetDate(keyOf(days[0]))}>+ Log a shift</button>

      {sheetDate &&
        <AddShiftSheet dateKey={sheetDate} days={days} keyOf={keyOf} differentials={differentials}
          existing={shifts[sheetDate]||[]} baseRate={baseRate} keepRatio={keepRatio}
          onClose={()=>setSheetDate(null)} onSave={arr=>{ saveDayShifts(sheetDate,arr); setSheetDate(null); }} />}

      {showBreakdown &&
        <div className="scrim" onClick={()=>setShowBreakdown(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="sheet-h"><div className="t">Your paycheck math</div><button className="back" onClick={()=>setShowBreakdown(false)}>{Ic.x}</button></div>
            <div className="sub" style={{fontSize:13,color:'var(--muted-2)',marginBottom:16}}>{periodLabel} · here's where it goes</div>
            <Breakdown calc={calc} />
            <div className="disclaimer">Estimates for planning. Always verify against your real paystub.</div>
          </div>
        </div>}

      {showSettings &&
        <Settings onClose={()=>setShowSettings(false)}
          {...{name,setName,baseRate,setBaseRate,federalTaxRate,setFederal,stateTaxRate,setState,ficaType,setFicaType,ficaPct,setFicaPct,
            pretaxDeductions,setPretax,posttaxDeductions,setPosttax,differentials,setDiff,customWithholdings,setCW,num,
            exportData,onImport:()=>fileImport.current?.click(),onPaystub,parsing,clearAll}} />}

      {showAuth && <AuthModal mode={authMode} onClose={()=>setShowAuth(false)} />}

      <input ref={fileImport} type="file" accept=".json" onChange={importData} style={{display:'none'}} />
    </div>
  );
}

function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<18?'Good afternoon':'Good evening'; }

/* ---------- Calendar ---------- */
function Calendar({days,keyOf,dayTotals,differentials,shifts,onPick}){
  const lead = days[0].getDay();
  const cells = [];
  for(let i=0;i<lead;i++) cells.push(<div key={'e'+i} className="cell empty"></div>);
  days.forEach(dt=>{
    const k=keyOf(dt); const t=dayTotals[k]; const arr=shifts[k]||[]; const has=arr.length>0;
    cells.push(
      <button key={k} className={'cell'+(has?' has':'')} onClick={()=>onPick(k)} aria-label={dt.toDateString()}>
        <div className="d">{dt.getDate()}</div>
        {has
          ? <><div className="dots">{arr.slice(0,4).map((s,i)=><i key={i} style={{background:differentials[s.shiftType]?.color||'#8A93A6'}}></i>)}</div><div className="amt num">{fmt(t.g)}</div></>
          : <div className="plus">+</div>}
      </button>);
  });
  return <div className="grid">{cells}</div>;
}

/* ---------- Breakdown ---------- */
function Breakdown({calc,embedded}){
  const g=calc.gross||0;
  const rows=[
    ['Pre-tax · 401k, health', calc.pre],
    ['Federal income tax', calc.fed],
    ['FICA', calc.fica],
    ['State tax', calc.st],
    ['Post-tax · union dues', calc.post],
    ['Other withholdings', calc.cw],
  ].filter(r=>r[1]>0.005);
  const maxDed = Math.max(...rows.map(r=>r[1]),1);
  return (
    <div className={embedded?'card':''}>
      {embedded && <h3>Where it goes</h3>}
      <div className="bd-row">
        <div className="lh"><span className="nm g">Gross pay</span><span className="vv g num">{fmt(g)}</span></div>
        <div className="bar gross"></div>
      </div>
      {rows.map(([nm,v])=>(
        <div className="bd-row" key={nm}>
          <div className="lh"><span className="nm">{nm}</span><span className="vv num">–{fmt(v)}</span></div>
          <div className="bar" style={{width:Math.max(6, v/maxDed*100)+'%'}}></div>
        </div>
      ))}
      {rows.length===0 && <div style={{fontSize:13,color:'var(--muted-2)',padding:'4px 0 8px'}}>Add shifts to see your deductions.</div>}
      <div className="takehome">
        <div><div className="k">Take-home</div><div className="s">{calc.pct}% of gross</div></div>
        <div className="v num">{fmt(calc.net)}</div>
      </div>
    </div>
  );
}

/* ---------- Add Shift Sheet ---------- */
function AddShiftSheet({dateKey,days,keyOf,differentials,existing,baseRate,keepRatio,onClose,onSave}){
  const [list,setList] = useState(existing.map(s=>({...s})));
  const [shiftType,setType] = useState('night');
  const [hours,setHours] = useState(12);
  const [bonusType,setBonus] = useState('none');
  const [customBonus,setCustomBonus] = useState(0);

  const active = Object.entries(differentials).filter(([_,d])=>d.active);
  const dt = days.find(d=>keyOf(d)===dateKey) || new Date(dateKey);
  const dateLabel = dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  const draft = {shiftType,hours,bonusType,customBonus};
  const previewGross = shiftGross(baseRate, differentials[shiftType], draft);
  const previewNet = Math.round(previewGross*keepRatio);

  const add = ()=>{ if(hours>0&&hours<=24){ setList([...list,{id:Date.now(),...draft}]); setBonus('none'); } else alert('Hours must be 0.1–24'); };
  const remove = id=> setList(list.filter(s=>s.id!==id));

  return (
    <div className="scrim" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <div className="grab"></div>
        <div className="sheet-h">
          <div className="t">Add a shift</div>
          <div className="row-item" style={{margin:0,padding:'7px 12px',fontWeight:600,fontSize:12.5}}>{dateLabel}</div>
        </div>

        {list.length>0 &&
          <div style={{marginBottom:16}}>
            <div className="sec-lab">ON THIS DAY</div>
            {list.map(s=>(
              <div className="row-item" key={s.id}>
                <span style={{display:'flex',alignItems:'center',gap:9}}>
                  <i style={{width:9,height:9,borderRadius:'50%',background:differentials[s.shiftType]?.color||'#8A93A6',display:'inline-block'}}></i>
                  <b style={{fontWeight:600,fontSize:13.5}}>{s.hours}h · {differentials[s.shiftType]?.name||s.shiftType}</b>
                  {s.bonusType!=='none' && <span style={{fontSize:12,color:'var(--muted)'}}>+{BONUS_LABEL[s.bonusType]}</span>}
                </span>
                <button className="danger-link" onClick={()=>remove(s.id)}>Remove</button>
              </div>
            ))}
          </div>}

        <div className="sec-lab">SHIFT TYPE</div>
        <div className="chips-grid" style={{marginBottom:16}}>
          {active.map(([k,d])=>(
            <button key={k} className={'chip-sel'+(shiftType===k?' on':'')} onClick={()=>setType(k)}>
              <i style={{background:d.color||'#8A93A6'}}></i>{d.name}
            </button>
          ))}
        </div>

        <div className="sec-lab">HOURS</div>
        <div className="hrs" style={{marginBottom:12}}>
          {[8,12,16].map(h=><button key={h} className={'hc'+(hours===h?' on':'')} onClick={()=>setHours(h)}>{h}h</button>)}
          <div className="inp suf" style={{flex:1}}><input type="number" step="0.5" min="0.1" max="24" value={hours} onChange={e=>setHours(parseFloat(e.target.value)||0)} style={{padding:'11px 12px',textAlign:'center',fontWeight:700}}/></div>
        </div>

        <div className="sec-lab">BONUS</div>
        <div className="inp" style={{marginBottom:bonusType==='custom'?10:16}}>
          <select value={bonusType} onChange={e=>setBonus(e.target.value)}>
            {Object.keys(BONUS_LABEL).map(k=><option key={k} value={k}>{BONUS_LABEL[k]}</option>)}
          </select>
        </div>
        {bonusType==='custom' &&
          <div className="inp pre" style={{marginBottom:16}}><span className="pfx">$</span><input type="number" step="0.01" value={customBonus} onChange={e=>setCustomBonus(parseFloat(e.target.value)||0)} placeholder="0.00"/></div>}

        <div className="preview">
          <div className="k">This shift adds</div>
          <div className="v">+{fmt(previewGross)} gross · about <b>+{fmt(previewNet)}</b> take-home</div>
        </div>

        <button className="btn btn-ghost" style={{marginBottom:10}} onClick={add}>+ Add to this day</button>
        <button className="btn btn-primary" onClick={()=>onSave(list)}>{list.length? 'Save day':'Save'}</button>
      </div>
    </div>
  );
}

/* ---------- Auth Modal ---------- */
function AuthModal({mode,onClose}){
  const [email,setEmail] = useState('');
  const [password,setPassword] = useState('');
  const [loading,setLoading] = useState(false);
  const [error,setError] = useState('');

  const handleEmailAuth = async (e)=>{
    e.preventDefault();
    setLoading(true);
    setError('');
    const action = mode==='signup' ? supabase.auth.signUp : supabase.auth.signInWithPassword;
    const {error:err} = await action({email,password});
    if(err) setError(err.message);
    else {
      if(mode==='signup') alert('Check your email to confirm your account!');
      onClose();
    }
    setLoading(false);
  };

  const handleGoogleAuth = async ()=>{
    setLoading(true);
    setError('');
    const {error:err} = await supabase.auth.signInWithOAuth({
      provider:'google',
      options:{redirectTo:window.location.origin}
    });
    if(err) setError(err.message);
    setLoading(false);
  };

  return (
    <div className="scrim" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:420}}>
        <div className="sheet-h">
          <div className="t">{mode==='signup'?'Create account':'Sign in'}</div>
          <button className="back" onClick={onClose}>{Ic.x}</button>
        </div>

        <form onSubmit={handleEmailAuth}>
          <div className="field">
            <span className="lab">Email</span>
            <div className="inp"><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required placeholder="you@example.com"/></div>
          </div>
          <div className="field">
            <span className="lab">Password</span>
            <div className="inp"><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required placeholder="••••••••" minLength={6}/></div>
          </div>
          {error && <div style={{color:'var(--danger)',fontSize:13,marginBottom:12}}>{error}</div>}
          <button type="submit" className="btn btn-primary" disabled={loading} style={{marginBottom:12}}>
            {loading ? 'Loading...' : (mode==='signup'?'Sign up':'Sign in')}
          </button>
        </form>

        <div style={{position:'relative',textAlign:'center',margin:'16px 0'}}>
          <div style={{position:'absolute',top:'50%',left:0,right:0,height:1,background:'var(--line)'}}></div>
          <span style={{position:'relative',background:'var(--paper)',padding:'0 12px',fontSize:12,color:'var(--muted-2)'}}>or</span>
        </div>

        <button className="btn btn-ghost" onClick={handleGoogleAuth} disabled={loading} style={{marginBottom:16}}>
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div style={{textAlign:'center',fontSize:13}}>
          {mode==='signup'
            ? <span>Have an account? <button className="link" onClick={()=>window.location.reload()}>Sign in</button></span>
            : <span>No account? <button className="link" onClick={()=>window.location.reload()}>Sign up</button></span>}
        </div>
      </div>
    </div>
  );
}

/* ---------- Settings ---------- */

    pretaxDeductions,setPretax,posttaxDeductions,setPosttax,differentials,setDiff,customWithholdings,setCW,num,

  const tog=k=>setDiff({...differentials,[k]:{...differentials[k],active:!differentials[k].active}});
  const del=k=>{ const n={...differentials}; delete n[k]; setDiff(n); };
  const addDiff=()=>{ if(newName.trim()){ setDiff({...differentials,['custom-'+Date.now()]:{name:newName,amount:parseFloat(newAmt)||0,type:'dollar',active:true,color:'#5B4FE9'}}); setNewName(''); setNewAmt(0); } };

        <div className="sec-lab" style={{marginTop:18}}>TAXES</div>

        <div className="sec-lab" style={{marginTop:14}}>DEDUCTIONS · per pay period</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <div className="field" style={{margin:0}}><span className="lab">Pre-tax</span><div className="inp pre"><span className="pfx">$</span><input type="number" step="0.01" value={pretaxDeductions} onChange={e=>setPretax(num(e.target.value,0))}/></div></div>

      <div className="help">We pre-filled common amounts. Toggle what applies and tweak to your contract.</div>
      <div style={{marginTop:18}}>
        {Object.entries(differentials).filter(([k])=>k!=='overtime').map(([k,d])=>(
          <div className={'drow'+(d.active?'':' off')} key={k}>
            <i style={{width:10,height:10,borderRadius:'50%',background:d.color||'#8A93A6',flex:'0 0 auto'}}></i>
            <span className="nm">{d.name}</span>
            <span className="amt num">{d.type==='multiplier'? d.amount+'× rate' : '+$'+d.amount.toFixed(2)+'/hr'}</span>
            <div className={'tg'+(d.active?' on':'')} onClick={()=>tog(k)}><div className="knob"></div></div>
          </div>
        ))}
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" onClick={()=>setObStep(3)}>Continue</button>
    </div>
  );

  /* 3 — taxes */
  if(obStep===3) return (
    <div className="ob">
      <Head step={3}/>
      <div className="eyebrow">STEP 3 OF 4 · TAXES & DEDUCTIONS</div>
      <div className="q">Last thing — taxes & take-outs.</div>
      <div className="help">We estimated these from typical nurse withholdings. Adjust anything you know.</div>
      <div style={{marginTop:18,display:'flex',flexDirection:'column',gap:10}}>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Federal income tax</div><span className="tag est">ESTIMATED</span></div>
          <div className="inp suf" style={{width:90}}><input type="number" step="0.1" value={federalTaxRate} onChange={e=>setFederal(num(e.target.value,0))} style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>State tax</div><span className="tag est">ESTIMATED</span></div>
          <div className="inp suf" style={{width:90}}><input type="number" step="0.1" value={stateTaxRate} onChange={e=>setState(num(e.target.value,0))} style={{textAlign:'right',fontWeight:700}}/><span className="sfx">%</span></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>FICA</div><span className="tag auto">AUTO 7.65%</span></div>
          <div style={{fontFamily:"'Bricolage Grotesque'",fontWeight:700,fontSize:18}}>7.65%</div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Pre-tax · 401k, health</div><div style={{fontSize:11.5,color:'var(--muted-2)'}}>per pay period</div></div>
          <div className="inp pre" style={{width:110}}><span className="pfx">$</span><input type="number" step="1" value={pretaxDeductions} onChange={e=>setPretax(num(e.target.value,0))} style={{textAlign:'right',fontWeight:700}}/></div></div>
        <div className="row-item"><div><div style={{fontWeight:600,fontSize:14}}>Post-tax · union dues</div><div style={{fontSize:11.5,color:'var(--muted-2)'}}>per pay period</div></div>
          <div className="inp pre" style={{width:110}}><span className="pfx">$</span><input type="number" step="1" value={posttaxDeductions} onChange={e=>setPosttax(num(e.target.value,0))} style={{textAlign:'right',fontWeight:700}}/></div></div>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" onClick={()=>setObStep(4)}>See my estimate</button>
    </div>
  );

  /* 4 — done */
  const sample = sampleNet();
  return (
    <div className="ob dark" style={{alignItems:'center',textAlign:'center'}}>
      <div className="spacer"></div>
      <div style={{width:74,height:74,borderRadius:'50%',background:'var(--mint)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 0 12px rgba(52,211,153,.14)'}}>{Ic.check}</div>
      <div className="display" style={{fontWeight:700,fontSize:27,marginTop:26}}>{name&&name!=='there'?`You're all set, ${name}.`:"You're all set."}</div>
      <div className="help" style={{color:'#9A9DAB'}}>Based on a typical two-week schedule, here's what you'd take home:</div>
      <div style={{width:'100%',background:'var(--ink-2)',borderRadius:22,padding:24,marginTop:24}}>
        <div style={{fontSize:12,fontWeight:600,color:'#9A9DAB'}}>Projected take-home</div>
        <div className="num" style={{fontFamily:"'Bricolage Grotesque'",fontWeight:800,fontSize:54,color:'var(--mint)',letterSpacing:'-.03em',margin:'8px 0',lineHeight:1}}>{fmt(sample.net)}</div>
        <div style={{fontSize:13,color:'#7E8290',fontWeight:500}}>{sample.hours} hrs · 6 shifts · gross {fmt(sample.gross)}</div>
      </div>
      <div style={{width:'100%',marginTop:14}}>
        <div className="field" style={{margin:0,textAlign:'left'}}>
          <div className="inp"><input placeholder="What should we call you?" value={name==='there'?'':name} onChange={e=>setName(e.target.value||'there')} style={{background:'#21242F',border:'1.5px solid #2E3140',color:'#fff'}}/></div>
        </div>
      </div>
      <div className="spacer"></div>
      <button className="btn btn-primary" style={{width:'100%'}} onClick={finish}>Go to my planner</button>
      <button className="btn" style={{width:'100%',color:'#9A9DAB'}} onClick={()=>setObStep(1)}>Edit my setup</button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
