<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Publicly reachable but not for the public: never indexed, never linked from the app. -->
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>BadgeBudget ops</title>
<!--
  THE OPS CONSOLE — feedback inbox (phase 1).

  Deliberately plain: no React, no Babel, no build step, no fonts, no third-party anything except
  supabase-js. privacy.html set that precedent and it is the right one here too — this page has to
  work at 3am on a phone when something is already going wrong, so it must not share a failure mode
  with the app it is used to diagnose.

  AUTH IS BORROWED, NOT IMPLEMENTED. Same origin as the app means the same localStorage, and
  supabase-js keys its session by project ref, so a person already signed in at badgebudget.com is
  already signed in here. That is why there is no sign-in button: adding one would mean adding
  /ops.html to the Supabase OAuth redirect allow-list and maintaining a second auth path for two
  people who are permanently signed in on their phones anyway.

  NOTHING HERE IS TRUSTED TO BE SAFE TO RENDER AS HTML. Every value that came out of the database
  was typed by a member of the public into a feedback box. It reaches the DOM through textContent,
  never innerHTML. See esc-free rendering in row().

  The gate is in Postgres, not here: ops_feedback_inbox() raises 42501 for anyone not on the
  allow-list (supabase/migrations/004_ops_console.sql). This page cannot grant itself access by
  being edited, which is the point of putting the check down there.
-->
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #16181d; --dim: #6b7280; --line: #e5e7eb;
    --accent: #2f6df6; --warn: #b45309; --warn-bg: #fef3c7; --ok: #047857;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #191c22; --ink: #e8eaed; --dim: #9aa1ad; --line: #2a2f38;
      --accent: #7aa2ff; --warn: #fbbf24; --warn-bg: #3a2f10; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 16px; }
  button {
    font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
    min-height: 40px;
  }
  button:active { transform: translateY(1px); }
  button[disabled] { opacity: 0.5; cursor: default; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; min-width: 78px;
  }
  .chip b { display: block; font-size: 19px; line-height: 1.2; letter-spacing: -0.02em; }
  .chip span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 14px; margin-bottom: 10px;
  }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .kind {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--warn-bg); color: var(--warn);
  }
  .kind.wish  { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .kind.other,
  .kind.pre_tiles { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .when { font-size: 12px; color: var(--dim); }
  .tag {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px;
  }
  .tag.insider { color: var(--ok); border-color: currentColor; }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 8px; }
  .contact { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  .contact a { color: var(--accent); }
  .gate { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .gate h2 { font-size: 16px; margin: 0 0 8px; }
  .gate p { margin: 0 0 10px; color: var(--dim); }
  .gate a { color: var(--accent); }
  .empty { color: var(--dim); padding: 24px 2px; }
  .err { color: var(--warn); }

  /* ---- phase 3b: devices + trail ---- */
  .tabs { display: flex; gap: 6px; margin: 12px 0 14px; }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .dev { width: 100%; text-align: left; border-radius: 12px; padding: 12px 13px; margin-bottom: 8px;
         min-height: 0; display: block; }
  .dev .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .dev b { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .dev .line { font-size: 12.5px; color: var(--dim); }
  .dev .line em { font-style: normal; color: var(--ink); }
  .sess { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 11px 13px; margin-bottom: 9px; }
  .sess h3 { font-size: 13px; margin: 0 0 7px; letter-spacing: 0.01em; }
  .sess h3 span { font-weight: 400; color: var(--dim); }
  .ev { display: flex; gap: 9px; font-size: 13px; padding: 2px 0; align-items: baseline; }
  .ev .t { color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; font-size: 12px; }
  .ev .n { font-weight: 600; overflow-wrap: anywhere; }
  .ev .p { color: var(--dim); overflow-wrap: anywhere; font-size: 12px; }
  .ev.end .n { color: var(--accent); }
  .ev.bad .n { color: var(--warn); }
  .errline { font-size: 11.5px; color: var(--warn); margin: 1px 0 1px 16px; overflow-wrap: anywhere; }
  .note { font-size: 12px; color: var(--dim); margin: 0 2px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BadgeBudget ops</h1>
    <span class="sub" id="sub">loading…</span>
  </header>
  <div id="main" aria-live="polite"><p class="empty">Checking your session…</p></div>
</div>

<script crossorigin="anonymous" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://mnnlgcxnvodjwlhhiphq.supabase.co';
  var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ubmxnY3hudm9kandsaGhpcGhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2OTYxMjUsImV4cCI6MjA5ODI3MjEyNX0.U5XtRZTBvicRqeA0Q02wIbJD5-BLOkQplQF11ynklFA';
  var PAGE = 50;
  var DEVICE_PAGE = 100;
  var POLL_MS = 30000;

  /* The tile labels, verbatim from the app so the inbox reads in the nurse's words rather than in
     column values. Keep in step with FEEDBACK_KINDS in index.html. */
  var KIND_LABEL = {
    wrong_number: 'A number looks wrong',
    broken: "Something didn't work",
    confused: "Couldn't find how to…",
    wish: 'I wish it could…',
    other: 'Open box',
    pre_tiles: 'Before the tiles'
  };

  var $ = function (id) { return document.getElementById(id); };
  var main = $('main');
  var sub = $('sub');

  /* Same guard the app uses: if the CDN script never arrived, say so instead of throwing. */
  var supabase = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON)
    : null;

  /* getSession() can deadlock on WebKit — Invariant 1's hard-won lesson. Never await it bare. */
  function withTimeout(p, ms, label) {
    return Promise.race([p, new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error((label || 'operation') + ' timed out')); }, ms);
    })]);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // never innerHTML: this is public-authored text
    return n;
  }

  function ago(iso) {
    var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }

  function dur(secs) {
    if (secs == null) return '';
    if (secs < 60) return secs + 's';
    if (secs < 3600) return Math.round(secs / 60) + 'm';
    return (secs / 3600).toFixed(1) + 'h';
  }

  function gate(title, body, linkText, linkHref) {
    main.replaceChildren();
    var box = el('div', 'gate');
    box.appendChild(el('h2', null, title));
    box.appendChild(el('p', null, body));
    if (linkText) {
      var a = el('a', null, linkText);
      a.href = linkHref;
      box.appendChild(a);
    }
    main.appendChild(box);
    sub.textContent = '';
  }

  /* 42501 is the allow-list saying no. Anything else is a real fault worth showing raw. */
  function showError(e) {
    if (e && (e.code === '42501' || /not authorized/i.test(e.message || ''))) {
      gate('Not an ops account', 'You are signed in, but this account is not on the ops list.');
    } else {
      gate('Could not load', String((e && e.message) || e));
    }
  }

  function row(r) {
    var node = el('div', 'row');
    var meta = el('div', 'meta');

    var kindKey = r.kind || 'pre_tiles';
    meta.appendChild(el('span', 'kind ' + kindKey, KIND_LABEL[kindKey] || kindKey));
    meta.appendChild(el('span', 'when', ago(r.created_at)));
    if (r.segment === 'insider') meta.appendChild(el('span', 'tag insider', 'insider'));
    meta.appendChild(el('span', 'tag', r.device));
    meta.appendChild(el('span', 'tag', r.signed_in ? 'signed in' : 'anonymous'));
    node.appendChild(meta);

    node.appendChild(el('p', 'msg', r.message));

    if (r.contact) {
      var c = el('div', 'contact');
      c.appendChild(el('span', null, 'Reply to: '));
      /* Linkify only an unambiguous email. Anything else stays inert text — a contact field is
         free-form and a nurse could paste anything into it. */
      if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.contact.trim())) {
        var a = el('a', null, r.contact.trim());
        a.href = 'mailto:' + encodeURIComponent(r.contact.trim());
        c.appendChild(a);
      } else {
        c.appendChild(el('span', null, r.contact));
      }
      node.appendChild(c);
    }
    return node;
  }

  /* ------------------------------------------------------------------------------------
     STATE. `view` is 'inbox' | 'devices' | 'trail'. The poll only ever refreshes the view
     that is actually on screen, so an open trail is never yanked out from under a thumb. */
  var state = {
    view: 'inbox',
    rows: [], done: false, loading: false, summary: null,
    devices: [], synthetic: false,
    trail: null, trailFor: null, trailMeta: null
  };

  function tabs() {
    var bar = el('div', 'tabs');
    [['inbox', 'Feedback'], ['devices', 'Devices']].forEach(function (pair) {
      var b = el('button', null, pair[1]);
      b.setAttribute('aria-selected', state.view === pair[0] || (pair[0] === 'devices' && state.view === 'trail') ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (pair[0] === 'inbox') { state.view = 'inbox'; loadInbox({ reset: true }); }
        else { state.view = 'devices'; loadDevices(); }
      });
      bar.appendChild(b);
    });
    return bar;
  }

  function refreshButton(fn) {
    var bar = el('div', 'bar');
    var b = el('button', null, 'Refresh');
    b.addEventListener('click', fn);
    bar.appendChild(b);
    return bar;
  }

  /* ---- inbox ------------------------------------------------------------------------- */
  function renderInbox() {
    main.replaceChildren();
    main.appendChild(tabs());
    main.appendChild(refreshButton(function () { loadInbox({ reset: true }); }));

    if (state.summary) {
      var chips = el('div', 'chips');
      [['total', state.summary.total], ['7 days', state.summary.last_7d], ['24 hours', state.summary.last_24h]]
        .forEach(function (pair) {
          var chip = el('div', 'chip');
          chip.appendChild(el('b', null, String(pair[1] == null ? '—' : pair[1])));
          chip.appendChild(el('span', null, pair[0]));
          chips.appendChild(chip);
        });
      main.appendChild(chips);
    }

    if (!state.rows.length) { main.appendChild(el('p', 'empty', 'No feedback yet.')); return; }
    state.rows.forEach(function (r) { main.appendChild(row(r)); });

    if (!state.done) {
      var more = el('button', null, state.loading ? 'Loading…' : 'Load older');
      more.disabled = state.loading;
      more.addEventListener('click', function () { loadInbox({ reset: false }); });
      main.appendChild(more);
    }
  }

  function loadInbox(opts) {
    if (!supabase || state.loading) return;
    state.loading = true;

    var last = state.rows[state.rows.length - 1];
    var args = { p_limit: PAGE };
    if (!opts.reset && last) { args.p_before = last.created_at; args.p_before_id = last.id; }

    var inbox = supabase.rpc('ops_feedback_inbox', args);
    var summaryCall = opts.reset ? supabase.rpc('ops_feedback_summary') : Promise.resolve({ data: null });

    withTimeout(Promise.all([inbox, summaryCall]), 10000, 'ops query').then(function (res) {
      state.loading = false;
      var got = res[0], sum = res[1];
      if (got.error) { showError(got.error); return; }

      var rows = got.data || [];
      state.rows = opts.reset ? rows : state.rows.concat(rows);
      state.done = rows.length < PAGE;
      if (opts.reset) state.summary = (sum && sum.data) || null;
      state.view = 'inbox';
      renderInbox();
      stamp();
    }).catch(function (e) { state.loading = false; showError(e); });
  }

  /* ---- devices ------------------------------------------------------------------------
     One card per anon_id. The two numbers that carry the weight are `visits` and `days`:
     a device with days > 1 is the only kind of evidence this app has that somebody came
     back, since there are no accounts for most visitors. */
  function deviceCard(d) {
    var b = el('button', 'dev');
    var top = el('div', 'top');
    top.appendChild(el('b', null, d.device + (d.visits > 1 ? ' · ' + d.visits + ' visits' : ' · 1 visit')));
    if (d.days > 1) top.appendChild(el('span', 'tag insider', 'returned · ' + d.days + ' days'));
    if (d.segment === 'insider') top.appendChild(el('span', 'tag insider', 'insider'));
    if (d.synthetic) top.appendChild(el('span', 'tag', 'test traffic'));
    if (d.signed_in) top.appendChild(el('span', 'tag', 'signed in'));
    if (d.feedback_n > 0) top.appendChild(el('span', 'tag', d.feedback_n + ' feedback'));
    if (d.errors > 0) top.appendChild(el('span', 'tag', d.errors + ' errors'));
    b.appendChild(top);

    var l1 = el('div', 'line');
    l1.appendChild(el('span', null, 'stopped at '));
    l1.appendChild(el('em', null, d.stalled_at || '—'));
    l1.appendChild(el('span', null, '  ·  ' + d.events + ' events  ·  '));
    l1.appendChild(el('span', null, d.setup ? 'finished setup' : (d.ob == null ? 'never saw onboarding' : 'onboarding step ' + d.ob)));
    b.appendChild(l1);

    b.appendChild(el('div', 'line', 'last seen ' + ago(d.last_seen) + '  ·  first seen ' + new Date(d.first_seen).toLocaleDateString()));
    b.addEventListener('click', function () { loadTrail(d); });
    return b;
  }

  function renderDevices() {
    main.replaceChildren();
    main.appendChild(tabs());

    var bar = el('div', 'bar');
    var r = el('button', null, 'Refresh');
    r.addEventListener('click', function () { loadDevices(); });
    bar.appendChild(r);
    var t = el('button', null, state.synthetic ? 'Hide test traffic' : 'Show test traffic');
    t.addEventListener('click', function () { state.synthetic = !state.synthetic; loadDevices(); });
    bar.appendChild(t);
    main.appendChild(bar);

    main.appendChild(el('p', 'note',
      'One card per device. "Returned" means it came back on a later day — with no account, that is '
      + 'the only evidence of a second visit there is. Tap a card for the whole trail.'));

    if (!state.devices.length) { main.appendChild(el('p', 'empty', 'No devices yet.')); return; }
    state.devices.forEach(function (d) { main.appendChild(deviceCard(d)); });
  }

  function loadDevices() {
    if (!supabase || state.loading) return;
    state.loading = true;
    withTimeout(supabase.rpc('ops_device_list', { p_limit: DEVICE_PAGE, p_include_synthetic: state.synthetic }), 10000, 'ops query')
      .then(function (got) {
        state.loading = false;
        if (got.error) { showError(got.error); return; }
        state.devices = got.data || [];
        state.view = 'devices';
        renderDevices();
        stamp();
      }).catch(function (e) { state.loading = false; showError(e); });
  }

  /* ---- one device's trail --------------------------------------------------------------
     Grouped by session_no, which the SQL derives from a 30-minute gap. The grouping is the
     answer to "did she come back and give up again?" — each block is one visit and the last
     line of each block is where that visit ended. */
  function propsLine(name, props) {
    if (!props) return '';
    var parts = [];
    Object.keys(props).forEach(function (k) {
      if (k === 'errors') return;                       // rendered as its own lines below
      var v = props[k];
      if (v == null || typeof v === 'object') return;
      parts.push(k + '=' + String(v));
    });
    return parts.join('  ');
  }

  function eventLine(e) {
    var line = el('div', 'ev' + (e.name === 'session_end' ? ' end' : '') + (e.name === 'client_error' ? ' bad' : ''));
    line.appendChild(el('span', 't', new Date(e.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })));
    line.appendChild(el('span', 'n', e.name));
    var p = propsLine(e.name, e.props);
    if (p) line.appendChild(el('span', 'p', p));
    return line;
  }

  function renderTrail() {
    main.replaceChildren();

    var bar = el('div', 'bar');
    var back = el('button', null, '← Devices');
    back.addEventListener('click', function () { state.view = 'devices'; renderDevices(); });
    bar.appendChild(back);
    main.appendChild(bar);

    var d = state.trailMeta;
    if (d) {
      main.appendChild(el('p', 'note',
        d.device + ' · ' + d.visits + ' visit' + (d.visits === 1 ? '' : 's') + ' over ' + d.days + ' day'
        + (d.days === 1 ? '' : 's') + ' · ' + (d.segment === 'insider' ? 'insider' : 'public')
        + (d.setup ? ' · finished setup' : '') + (d.signed_in ? ' · signed in' : ' · never signed in')));
    }

    var evs = state.trail || [];
    if (!evs.length) { main.appendChild(el('p', 'empty', 'No events for this device.')); return; }

    var sessions = [];
    evs.forEach(function (e) {
      var s = sessions[sessions.length - 1];
      if (!s || s.no !== e.session_no) { s = { no: e.session_no, items: [] }; sessions.push(s); }
      s.items.push(e);
    });

    sessions.forEach(function (s) {
      var box = el('div', 'sess');
      var first = s.items[0], last = s.items[s.items.length - 1];
      var secs = Math.round((new Date(last.created_at) - new Date(first.created_at)) / 1000);
      var h = el('h3', null, 'Visit ' + s.no + ' ');
      h.appendChild(el('span', null, new Date(first.created_at).toLocaleString() + '  ·  '
        + s.items.length + ' event' + (s.items.length === 1 ? '' : 's')
        + (secs > 0 ? '  ·  ' + dur(secs) : '')));
      box.appendChild(h);
      s.items.forEach(function (e) {
        box.appendChild(eventLine(e));
        /* client_error payloads are already money-redacted on the device; render them as the
           plain text they are so a support question does not need a SQL session. */
        if (e.name === 'client_error' && e.props && Array.isArray(e.props.errors)) {
          e.props.errors.forEach(function (x) {
            box.appendChild(el('div', 'errline', String((x && x.msg) || '')));
          });
        }
      });
      main.appendChild(box);
    });
  }

  function loadTrail(d) {
    if (!supabase || state.loading) return;
    state.loading = true;
    state.trailFor = d.anon_id;
    state.trailMeta = d;
    withTimeout(supabase.rpc('ops_device', { p_anon_id: d.anon_id, p_limit: 500 }), 10000, 'ops query')
      .then(function (got) {
        state.loading = false;
        if (got.error) { showError(got.error); return; }
        state.trail = got.data || [];
        state.view = 'trail';
        renderTrail();
        stamp();
      }).catch(function (e) { state.loading = false; showError(e); });
  }

  function stamp() { sub.textContent = 'updated ' + new Date().toLocaleTimeString(); }

  function start() {
    if (!supabase) {
      gate('Offline', 'The Supabase client did not load, so there is nothing to read. Check the network and reload.');
      return;
    }
    withTimeout(supabase.auth.getSession(), 4000, 'getSession')
      .then(function (res) {
        var session = res && res.data && res.data.session;
        if (!session) {
          gate('Sign in first',
               'This console borrows your badgebudget.com session. Sign in there, then come back to this page.',
               'Open badgebudget.com', 'https://badgebudget.com/');
          return;
        }
        loadInbox({ reset: true });
      })
      .catch(function () {
        gate('Sign in first',
             'Could not read a signed-in session. Sign in at badgebudget.com, then reload this page.',
             'Open badgebudget.com', 'https://badgebudget.com/');
      });
  }

  /* Poll only while the tab is actually being looked at — same discipline as the app's sync poll,
     and the reason a console left open on a phone overnight costs nothing. An open trail is left
     alone: refreshing it under a thumb mid-read would be worse than being 30 seconds stale. */
  setInterval(function () {
    if (document.visibilityState !== 'visible' || state.loading) return;
    if (state.view === 'inbox' && state.rows.length) loadInbox({ reset: true });
    else if (state.view === 'devices' && state.devices.length) loadDevices();
  }, POLL_MS);

  start();
})();
</script>
</body>
</html>
