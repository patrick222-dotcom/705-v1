<!-- @dsCard group="Calendar" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScrubPay — Calendar anatomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16181F; --paper:#F6F5F1; --card:#FFFFFF;
    --indigo:#5B4FE9; --indigo-soft:#ECEAFE;
    --money:#11A86B; --money-ink:#0B5D3C; --amber:#F5A524;
    --muted:#6B665C; --muted-2:#9A968C; --line:#EEEDE8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .num{font-variant-numeric:tabular-nums}

  .wrap{max-width:520px;margin:0 auto;padding:22px 18px 60px}
  .pg-h{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;margin-bottom:4px}
  .pg-s{font-size:13px;color:var(--muted-2);margin-bottom:18px}
  .sec-lab{font-weight:600;font-size:12px;color:var(--muted-2);margin:22px 0 10px;letter-spacing:.02em;text-transform:uppercase}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}

  /* --- exact app rules --- */
  .viewseg{display:flex;gap:4px;background:#EFEEE9;border-radius:12px;padding:4px;margin-bottom:14px}
  .viewseg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);background:transparent;border:0;transition:background .15s,color .15s;cursor:pointer}
  .viewseg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,18,26,.1)}

  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px;min-width:320px}
  .dow div{text-align:center;font-weight:700;font-size:11px;color:#A8A498}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;min-width:320px}

  .cal-pp-div{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:3px 0 7px}
  .cal-pp-div::before,.cal-pp-div::after{content:'';flex:1;height:1px;background:var(--line)}
  .cal-pp-div .pp-chip{flex:0 0 auto;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.01em;color:var(--muted-2);background:var(--card);padding:3px 9px;border-radius:20px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}

  .cell{position:relative;aspect-ratio:1/1;min-height:0;border-radius:11px;background:#fbfaf7;border:1px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;text-align:left}
  .cell.empty{border-style:dashed;background:#fff}
  .cell .d{font-weight:700;font-size:13px}
  .cell .plus{margin-top:auto;color:#cfccc2;font-size:17px;font-weight:700}
  .cell .dots{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
  .cell .dots i.glyph{width:auto;height:auto;background:none;font-size:9.5px;line-height:1;font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .cell .dots i.ev{background:transparent;border:1.3px solid #8A93A6;box-sizing:border-box;width:6px;height:6px}
  .cell .amt{font-weight:700;font-size:10px;color:var(--money);margin-top:1px}
  .cell .note-mark{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--indigo)}
  .cell.has{background:#fff}
  .cell.pp-active{background:rgba(91,79,233,.055)}
  .cell.today{box-shadow:0 0 0 2px var(--indigo) inset}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
  .legend span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);font-weight:500}
  .legend i{width:8px;height:8px;border-radius:50%}
  .legend i.glyph{width:auto;height:auto;background:none;font-size:10.5px;line-height:1;font-style:normal;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .disclaimer{font-size:11.5px;line-height:1.5;color:#A8A498;text-align:center;margin-top:14px}
  .callout{font-size:11px;color:var(--muted-2);text-align:center;margin:6px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="pg-h">Calendar anatomy</div>
  <div class="pg-s">Day-grid cell states, the pay-period boundary divider, the Month/Year segment control, and the glyph/event legend.</div>

  <div class="card">
    <div class="viewseg" role="tablist" aria-label="Calendar view">
      <button class="on" role="tab" aria-selected="true">Month</button>
      <button role="tab" aria-selected="false">Year</button>
    </div>

    <div class="dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>

    <div class="grid">
      <!-- empty cell -->
      <div class="cell empty"><div class="plus">+</div></div>

      <!-- cell with shift glyphs + net amount -->
      <button class="cell has">
        <div class="d">2</div>
        <div style="margin-top:auto">
          <div class="dots"><i class="glyph" style="color:#5B4FE9">☾</i></div>
          <div class="amt num">~$540</div>
        </div>
      </button>

      <!-- cell with two shift glyphs (day + night, e.g. double shift week) -->
      <button class="cell has">
        <div class="d">3</div>
        <div style="margin-top:auto">
          <div class="dots"><i class="glyph" style="color:#8A93A6">☀</i><i class="glyph" style="color:#F5A524">★</i></div>
          <div class="amt num">~$610</div>
        </div>
      </button>

      <!-- cell with event hollow ring + note marker, no shift -->
      <button class="cell has">
        <div class="d">4<span class="note-mark" aria-hidden="true"></span></div>
        <div style="margin-top:auto">
          <div class="dots"><i class="ev" style="border-color:var(--amber)"></i></div>
        </div>
      </button>

      <!-- today -->
      <button class="cell has today">
        <div class="d">5</div>
        <div style="margin-top:auto">
          <div class="dots"><i class="glyph" style="color:#FF6B5C">☀</i></div>
          <div class="amt num">~$470</div>
        </div>
      </button>

      <!-- pp-active tint, empty -->
      <div class="cell empty pp-active"><div class="plus">+</div></div>

      <!-- pp-active tint, has shift -->
      <button class="cell has pp-active">
        <div class="d">7</div>
        <div style="margin-top:auto">
          <div class="dots"><i class="glyph" style="color:#9B5BE9">☾</i></div>
          <div class="amt num">~$690</div>
        </div>
      </button>
    </div>

    <div class="cal-pp-div"><button class="pp-chip">JUL 6 – JUL 19</button></div>

    <div class="dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="grid">
      <div class="cell empty pp-active"><div class="plus">+</div></div>
      <div class="cell empty pp-active"><div class="plus">+</div></div>
      <button class="cell has pp-active">
        <div class="d">9</div>
        <div style="margin-top:auto">
          <div class="dots"><i class="glyph" style="color:#5B4FE9">☾</i><i class="ev" style="border-color:var(--money-ink)"></i></div>
          <div class="amt num">~$540</div>
        </div>
      </button>
      <div class="cell empty pp-active"><div class="plus">+</div></div>
      <div class="cell empty pp-active"><div class="plus">+</div></div>
      <div class="cell empty pp-active"><div class="plus">+</div></div>
      <div class="cell empty pp-active"><div class="plus">+</div></div>
    </div>

    <div class="legend">
      <span><i class="glyph" style="color:#5B4FE9">☾</i>Night</span>
      <span><i class="glyph" style="color:#FF6B5C">☀</i>Weekend day</span>
      <span><i class="glyph" style="color:#9B5BE9">☾</i>Weekend night</span>
      <span><i class="glyph" style="color:#F5A524">★</i>Holiday</span>
      <span><i class="glyph" style="color:#11A86B">✦</i>Bonus</span>
    </div>
    <div class="legend" style="margin-top:6px">
      <span><i style="background:transparent;border:1.3px solid var(--money-ink);box-sizing:border-box"></i>PTO</span>
      <span><i style="background:transparent;border:1.3px solid #9B5BE9;box-sizing:border-box"></i>Education</span>
      <span><i style="background:transparent;border:1.3px solid #F5A524;box-sizing:border-box"></i>Appt</span>
      <span><i style="background:transparent;border:1.3px solid #8A93A6;box-sizing:border-box"></i>Off</span>
    </div>
    <div class="disclaimer">Day amounts are estimated take-home.</div>
  </div>
</div>
</body>
</html>
